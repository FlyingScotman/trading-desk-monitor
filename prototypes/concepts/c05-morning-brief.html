<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>C05 · Утренний брифинг</title>
<link rel="stylesheet" href="lib/kit.css">
<style>
.brief { max-width: 1100px; margin: 0 auto; padding: 18px 16px 60px; }
.brief section { border-top: 1px solid var(--line); padding: 16px 0 18px; }
.brief section:first-child { border-top: 0; padding-top: 4px; }
.brief h2 { margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-2); display: flex; align-items: center; gap: 10px; }
.brief h2 .no { font: 600 11px var(--mono); color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 5px; letter-spacing: 0; }
.brief h2 .sp { flex: 1; }
.brief h2 .k-note { text-transform: none; letter-spacing: 0; font-weight: 400; }
.brief p { margin: 0 0 8px; font-size: 14.5px; line-height: 1.65; max-width: 900px; }
.brief p b { font-weight: 600; }
.hl { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; margin-bottom: 6px; }
.hl .big { font-size: 38px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.hl .sub { color: var(--fg-2); font-size: 14px; }
.hl .sub b { color: var(--fg); }
.factors { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 4px; }
.factor { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 5px 10px; min-width: 112px; }
.factor .l { font-size: 11px; color: var(--fg-2); }
.factor .v { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 860px) { .two { grid-template-columns: 1fr; } .hl .big { font-size: 30px; } }
.mini { width: 100%; border-collapse: collapse; font-size: 13px; }
.mini th { text-align: left; font-weight: 500; color: var(--fg-2); font-size: 11.5px; padding: 4px 6px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
.mini td { padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
.mini td.n, .mini th.n { text-align: right; font-variant-numeric: tabular-nums; }
.mini tr[data-card] { cursor: pointer; }
.mini tr[data-card]:hover td { background: var(--hover); }
.mini .why { color: var(--fg-3); font-size: 11.5px; }
/* кнопки таблиц (#131): страница-документ прокручивается целиком — строка кнопок под таблицей, не у края окна */
.mini + .k-tbl-ctlbar { position: static; background: transparent; }
.mini td.name { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.cap { font-size: 12px; color: var(--fg-2); margin: 0 0 6px; font-weight: 600; }
.alerts { display: flex; flex-direction: column; gap: 6px; }
.alert { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 6px; background: var(--panel); font-size: 13.5px; line-height: 1.55; }
.alert.bad { border-left-color: var(--neg); } .alert.info { border-left-color: var(--accent); }
.alert .ic { font-size: 14px; text-align: center; }
.alert .lst { color: var(--fg-2); font-size: 12.5px; margin-top: 2px; }
.alert .lst span[data-card] { cursor: pointer; border-bottom: 1px dotted var(--fg-3); }
.alert .lst span[data-card]:hover { color: var(--accent); }
.days { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 3px; margin: 6px 0 12px; }
.day { border: 1px solid var(--line); border-radius: 5px; background: var(--panel); padding: 4px 4px 5px; min-height: 64px; font-size: 11px; position: relative; cursor: default; }
.day.we { opacity: .5; }
.day.today { border-color: var(--accent); }
.day .d { color: var(--fg-2); font-variant-numeric: tabular-nums; }
.day .d b { color: var(--fg); }
.day .ev { display: block; margin-top: 3px; height: 6px; border-radius: 2px; }
.day .amt { font-variant-numeric: tabular-nums; color: var(--fg); font-weight: 600; margin-top: 2px; }
.day.has { cursor: pointer; }
.day.has:hover { border-color: var(--accent); }
.day .cbr { position: absolute; top: 3px; right: 4px; font: 600 9px var(--mono); color: #fff; background: var(--neg); border-radius: 3px; padding: 0 3px; }
@media (max-width: 860px) { .days { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--fg-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 6px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.chg-up { color: var(--neg); } .chg-dn { color: var(--pos); }
.chart { height: 240px; }
.toc { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 6px; }
.toc a { font-size: 12px; color: var(--fg-2); padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; }
.toc a:hover { color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
<div class="brief" id="brief"></div>
<script src="../echarts.min.js"></script>
<script src="lib/boot.js"></script>
<script src="lib/kit.js"></script>
<script src="lib/instr.js"></script>
<script>
(function () {
  const M = MOCK, K = KIT, f = K.f, esc = K.esc;
  const MH = M.marketHistory ? M.marketHistory() : null;  // история рынка (прогон из базы): фиксинги, курсы, кривые по датам
  K.top({ title: 'C05 · Утренний брифинг', tag: 'читается сверху вниз за 2 минуты' });
  const root = document.getElementById('brief');
  const SECS = [['s1', 'Итог'], ['s2', 'Что изменилось'], ['s3', 'Главные вклады'], ['s4', '2 недели'], ['s5', 'Внимание'], ['s6', 'Рынок']];
  K.commands(SECS.map(([id, t]) => ({ label: 'Раздел: ' + t, run: () => document.getElementById(id).scrollIntoView({ behavior: 'smooth' }) })));

  // ---------- помощники ----------
  const ratePnl = (p, cid) => p.risk[cid].reduce((s, v, k) => s + v * M.curve[cid].chg[k], 0);
  // mm ₽ со знаком, кликабельно
  const mln = (title, list, val, d) => K.d({ title, unit: 'mm ₽', fmt: v => f.mns(v, d == null ? 1 : d), list, val }) + '&nbsp;mm';
  const dvx = (title, list, val) => K.d({ title, unit: 'тыс ₽/бп', list, val }, null, '') + '&nbsp;тыс/бп';
  // диапазон сдвига кривой по бакетам, б.п. (до 0.1); у кривой без точек (USD/CNY в прогоне без кривых хаба) — «нет данных»
  const noCurve = c => !c || c.pts.every(v => v == null);
  const chgRange = c => { if (noCurve(c)) return 'нет данных'; const a = c.chg.filter(x => x).map(v => Math.round(v * 10) / 10).filter(x => x); if (!a.length) return '0'; const mn = Math.min(...a), mx = Math.max(...a); const s = v => (v > 0 ? '+' : '') + v; return mn === mx ? s(mn) : s(mn) + '…' + s(mx); };
  const avgChg = c => noCurve(c) ? 0 : c.chg.reduce((a, v) => a + (v || 0), 0) / Math.max(1, c.chg.length);
  const maxBucket = c => { let k = 0; c.chg.forEach((v, i) => { if (Math.abs(v || 0) > Math.abs(c.chg[k] || 0)) k = i; }); return M.buckets[k]; };
  const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return n + ' ' + (m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c); };
  const daysTo = d => Math.round((M.util.parse(d) - M.util.parse(M.asOf)) / 864e5);
  const word = v => v >= 0 ? 'заработали' : 'потеряли';
  // USD / EUR / CNY: сдвиг кривой, если она есть в прогоне; без кривой — фиксинги SOFR и €STR (хаб 0.3.0), иначе «нет
  // данных» (R25). Прокси-кривая UST par (не OIS) подписана как прокси.
  function fxRatesLine() {
    const fix = k => { const x = MH && MH.indices && MH.indices[k]; const v = x && x.value != null ? x.value : M.indices[k];
      return v == null ? null : k + ' ' + f.pct(v) + (x && x.chgBp && x.chgBp[0] ? ' (' + f.bps(x.chgBp[0]) + ' б.п.)' : ''); };
    const c = M.curve['USD SOFR'], e = M.curve['EUR ESTR'], cn = M.curve['CNY XCCY'];
    const cur = (cv, name) => (/прокси/.test(cv.name || '') ? esc(cv.name) : name) + ' ' + chgRange(cv) + ' б.п.';
    const parts = [noCurve(c) ? (fix('SOFR') || 'SOFR нет данных') : cur(c, 'USD')];
    if (!noCurve(e)) parts.push(cur(e, 'EUR')); else if (fix('€STR')) parts.push(fix('€STR'));
    parts.push(noCurve(cn) ? 'CNY нет данных' : 'CNY ' + chgRange(cn) + ' б.п.');
    return parts.join(', ') + (noCurve(c) && noCurve(cn) ? ' (кривых USD/CNY в данных хаба нет' + (fix('SOFR') ? '; SOFR и €STR — фиксинги дня' : '') + ')' : '');
  }

  // ---------- фиксинги, курсы ЦБ и кривые за неделю, месяц, с начала года (история рынка хаба) ----------
  function marketHist() {
    if (!MH || !MH.marketDate) return '';
    const P = MH.periodOrder || ['1D', '1W', '1M', '3M', 'YTD'], at = k => P.indexOf(k);
    const cl = v => v == null ? 'mut3' : v > 0 ? 'chg-up' : v < 0 ? 'chg-dn' : 'mut3';
    const bp = v => v == null ? '—' : f.bps(v);
    const rows = Object.entries(MH.indices || {}).map(([k, x]) => '<tr><td title="' + (x.date ? 'последнее значение: ' + f.date(x.date) : '') + '">' + esc(k) + (x.lag ? ' <span class="mut3" title="ЦБ публикует RUONIA на следующий рабочий день">за ' + f.dshort(x.date) + '</span>' : '') + '</td><td class="n"><b>' + f.pct(x.value) + '</b></td>' +
      ['1D', '1W', '1M', 'YTD'].map(p => '<td class="n ' + cl(x.chgBp[at(p)]) + '">' + bp(x.chgBp[at(p)]) + '</td>').join('') +
      '<td>' + K.spark((x.series || []).slice(-130).map(v => v[1]), 110, 20) + '</td></tr>').join('');
    const fx = Object.entries(MH.fx || {}).map(([c, x]) => '<tr><td>' + c + '/RUB ЦБ</td><td class="n"><b>' + f.n(x.cbr, c === 'CNY' ? 4 : 2) + '</b></td>' +
      ['1D', '1W', '1M', 'YTD'].map(p => { const v = x.chgPct[at(p)]; return '<td class="n ' + cl(v) + '">' + (v == null ? '—' : f.s(v, 2) + '%') + '</td>'; }).join('') +
      '<td class="mut3">' + (x.moexTom != null ? 'MOEX TOM ' + f.n(x.moexTom, c === 'CNY' ? 4 : 2) : '') + '</td></tr>').join('') +
      // кросс-курсы (R25): ряды хаба 0.3.0 (ЕЦБ, ФРС H.10, CETS, кросс ЦБ), иначе — кросс курсов ЦБ
      Object.entries(MH.crosses || {}).map(([pr, x]) => '<tr><td title="' + esc(x.label + (x.date ? ', ' + f.date(x.date) : '')) + '">' + pr + ' <span class="mut3">' + esc(x.label) + '</span></td><td class="n"><b>' + f.n(x.value, 4) + '</b></td>' +
        ['1D', '1W', '1M', 'YTD'].map(p => { const v = x.chgPct[at(p)]; return '<td class="n ' + cl(v) + '">' + (v == null ? '—' : f.s(v, 2) + '%') + '</td>'; }).join('') +
        '<td>' + K.spark((x.series || []).slice(-130).map(v => v[1]), 110, 20) + '</td></tr>').join('');
    const T = [1, 5, 10], ti = t => (MH.pillars || M.pillars).indexOf(t);
    // прокси-кривые USD / EUR (госбумаги par, не OIS; хаб 0.3.0) — только для взгляда, в риск не входят (R25)
    const proxies = Object.entries(MH.curves || {}).filter(([, c]) => c.proxy).map(([id, c]) => [(c.ccy || '') + ' <span class="mut3">' + esc(c.proxy) + '</span>', id]);
    const cv = [['RUONIA OIS', 'RUB RUONIA'], ['КС-свопы', 'RUB KEY'], ['КБД (ОФЗ)', 'OFZ']].concat(proxies).filter(([, id]) => MH.curves && MH.curves[id]).map(([n, id]) => {
      const c = MH.curves[id], now = c.pts.asOf || [];
      return '<tr><td>' + n + '</td>' + T.map(t => '<td class="n"><b>' + f.pct(now[ti(t)]) + '</b></td>').join('') +
        ['1W', '1M', 'YTD'].map(p => { const b = c.pts[p]; return T.map(t => { const v = b && now[ti(t)] != null && b[ti(t)] != null ? Math.round((now[ti(t)] - b[ti(t)]) * 100) : null; return '<td class="n ' + cl(v) + '">' + bp(v) + '</td>'; }).join(''); }).join('') + '</tr>';
    }).join('');
    return '<div style="display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:12px"><div><div class="cap">Ставки и курсы <span class="mut3">· изменения в б.п. (курсы — в %) к ' + ['1D', '1W', '1M', 'YTD'].map(p => f.dshort(MH.periods[p])).join(' / ') + '</span></div>' +
      '<table class="mini" data-vk="c05-rates-fx" data-title="Ставки и курсы"><thead><tr><th></th><th class="n">сейчас</th><th class="n">день</th><th class="n">неделя</th><th class="n">месяц</th><th class="n">с н.г.</th><th>полгода</th></tr></thead><tbody>' + rows + fx + '</tbody></table></div>' +
      (cv ? '<div><div class="cap">Кривые: уровень 1Y / 5Y / 10Y и сдвиг, б.п.</div><table class="mini" data-vk="c05-curves" data-title="Кривые: уровень и сдвиг, б.п."><thead><tr><th></th>' + T.map(t => '<th class="n">' + t + 'Y</th>').join('') +
        ['неделя', 'месяц', 'с н.г.'].map(p => '<th class="n" colspan="3">' + p + '</th>').join('') + '</tr></thead><tbody>' + cv + '</tbody></table></div>' : '') + '</div>';
  }

  function render() {
    K.charts.slice().forEach(c => c.dispose());
    const L = K.list(), k = M.kpis(L);
    let html = '';

    // ---------- 01 итог ----------
    const bonds = L.filter(p => p.group !== 'DER');
    const parts = [];
    M.curves.filter(c => c.kind === 'rate').forEach(c => {
      const v = M.sum(L, p => ratePnl(p, c.id));
      if (Math.abs(v) > 3e5) parts.push({ v, h: 'ставки ' + c.short + ' ' + mln('PnL от ' + c.short, L, p => ratePnl(p, c.id)) + ' <span class="mut">(' + c.short + ' ' + chgRange(c) + ' б.п.)</span>' });
    });
    const bas = M.ofzView === 'kbd' ? 0 : M.sum(L, p => ratePnl(p, 'RUB OFZ'));  // в виде «КБД» КБД — среди кривых ставок выше
    if (Math.abs(bas) > 3e5) parts.push({ v: bas, h: 'базис ОФЗ ' + mln('PnL от базиса ОФЗ − RUONIA', L, p => ratePnl(p, 'RUB OFZ')) + ' <span class="mut">(ОФЗ шире RUONIA на ' + chgRange(M.curve['RUB OFZ']) + ' б.п.)</span>' });
    [['carry', 'кэрри'], ['spread', 'кредитные спреды'], ['fx', 'курсы'], ['trading', 'сделки дня'], ['other', 'прочее']].forEach(([key, t]) => {
      const v = M.sum(L, p => p.pnl[key]); if (Math.abs(v) > 2e5) parts.push({ v, h: t + ' ' + mln('PnL · ' + t, L, p => p.pnl[key]) });
    });
    parts.sort((a, b) => Math.abs(b.v) - Math.abs(a.v));
    const tot = k.pnl;
    html += '<section id="s1"><div class="toc">' + SECS.map(([id, t]) => '<a href="#' + id + '">' + t + '</a>').join('') + '</div>' +
      '<h2><span class="no">01</span> Итог дня <span class="sp"></span><span class="k-note">' + f.date(M.asOf) + ', ' + esc(M.cut.label) + ' · к закрытию ' + f.date(M.prevDate) + '</span></h2>' +
      '<div class="hl"><span class="big ' + f.cls(tot) + '">' + K.d({ title: 'PnL дня', unit: 'mm ₽', fmt: v => f.mns(v, 2), list: L, val: p => p.pnl.total }, f.mns(tot, 1)) + ' <span style="font-size:18px;font-weight:500" class="mut">mm ₽</span></span>' +
      '<span class="sub">MTD <b>' + mln('PnL MTD', L, 'pnlMtd') + '</b>' + K.partial('mtd') + ' · YTD <b>' + mln('PnL YTD', L, 'pnlYtd', 0) + '</b>' + K.partial('ytd') + '</span></div>' +
      '<p>За день ' + word(tot) + ' <b>' + f.mn(Math.abs(tot), 1) + ' mm</b>. Главное: ' + parts.slice(0, 3).map(x => x.h).join(', ') + '.' +
      (parts.length > 3 ? ' Остальное: ' + parts.slice(3).map(x => x.h).join(', ') + '.' : '') + '</p>' +
      '<p class="mut" style="font-size:13px">Риск на утро: DV01 по ставкам ' + dvx('DV01 ставки', L, 'dv01') + ', из них RUONIA ' + dvx('DV01 RUONIA', L, p => p.dv01ByCurve['RUB RUONIA']) +
      ', КС ' + dvx('DV01 КС', L, p => p.dv01ByCurve['RUB KEY']) + (M.ofzView === 'kbd' ? ', КБД ' + dvx('DV01 КБД', L, p => p.dv01ByCurve['RUB OFZ'])
        : '; базис ОФЗ ' + dvx('Базис ОФЗ − RUONIA', L, 'basis01')) + '; спред ОФЗ к КБД ' + dvx('Спред ОФЗ к КБД', L, 'ofzSpr01') + '; CS01 ' + dvx('CS01', L, 'cs01') +
      '. Кэрри ' + K.d({ title: 'Кэрри за день', unit: 'тыс ₽', fmt: f.ks, list: L, val: 'carryDay' }) + '&nbsp;тыс в день.</p>' +
      '<div class="factors">' + [['Кэрри', 'carry'], ['Ставки', 'rates'], ['Спред', 'spread'], ['FX', 'fx'], ['Сделки', 'trading'], ['Прочее', 'other']].map(([t, key]) =>
        '<div class="factor"><div class="l">' + t + '</div><div class="v">' + K.d({ title: 'PnL · ' + t, unit: 'mm ₽', fmt: v => f.mns(v, 2), list: L, val: p => p.pnl[key] }, null) + '</div></div>').join('') + '</div></section>';

    // ---------- 02 что изменилось ----------
    const H = M.hist, n = M.histDates.length;
    const rowsChg = M.curves.map(c => ({ label: c.short + (c.kind === 'basis' ? ' (базис)' : ''), ser: H.dv01[c.id], today: k.byCurve[c.id], list: L, val: p => p.dv01ByCurve[c.id], color: K.curveColors[c.id] }))
      .concat([{ label: 'CS01', ser: H.cs01, today: k.cs01, list: L, val: 'cs01', color: K.curveColors.CS01 }]);
    // приближение: история деска без фильтра; при фильтре берём долю
    const all = M.kpis();
    const traded = L.filter(p => p.tradedToday && p.tradeToday && p.notional);
    const tradeDv = p => p.dv01 * p.tradeToday.qty / p.notional;
    const dDay = H.dv01['RUB RUONIA'][n - 1] - H.dv01['RUB RUONIA'][n - 2];
    const dvSumAll = s => M.curves.filter(c => c.kind === 'rate').reduce((a, c) => a + H.dv01[c.id][s], 0);
    const dvDay = dvSumAll(n - 1) - dvSumAll(n - 2), dvWeek = dvSumAll(n - 1) - dvSumAll(n - 6);
    html += '<section id="s2"><h2><span class="no">02</span> Что изменилось в риске <span class="sp"></span><span class="k-note">тыс ₽/бп · история — по всему деску</span></h2>' +
      '<p>DV01 по ставкам за день ' + (dvDay < 0 ? 'удлинился' : 'укоротился') + ' на <b>' + f.dv(Math.abs(dvDay)) + '</b> тыс/бп, за неделю — на <b>' + f.dv(Math.abs(dvWeek)) + '</b> (' + (dvWeek < 0 ? 'длиннее' : 'короче') + '). ' +
      (traded.length ? 'Сегодня сделки по ' + plural(traded.length, 'позиции', 'позициям', 'позициям') + ' добавили ' + K.d({ title: 'Изменение DV01 от сделок дня', unit: 'тыс ₽/бп', rows: traded.map(p => ({ p, v: tradeDv(p) })) }, null, '') + ' тыс/бп; остальное — движение рынка и старение позиций.' : 'Сделок сегодня нет — изменение от рынка и старения позиций.') +
      ' RUONIA за день ' + f.dvs(dDay) + ' тыс/бп.</p>' +
      '<table class="mini" data-vk="c05-risk-change" data-title="Что изменилось в риске, тыс ₽/бп"><thead><tr><th>Фактор</th><th class="n">Сейчас</th><th class="n">Δ день</th><th class="n">Δ неделя</th><th class="n">Δ месяц</th><th>30 дней</th><th class="n">min … max (130д)</th></tr></thead><tbody>' +
      rowsChg.map(r => {
        const s = r.ser, d1 = s[n - 1] - s[n - 2], d5 = s[n - 1] - s[n - 6], d21 = s[n - 1] - s[n - 22];
        const cl = v => Math.abs(v) < 1e3 ? 'mut3' : '';
        return '<tr><td><b style="color:' + r.color + '">■</b> ' + esc(r.label) + '</td><td class="n"><b>' + K.d({ title: 'Риск · ' + r.label, unit: 'тыс ₽/бп', list: r.list, val: r.val }, null, '') + '</b></td>' +
          '<td class="n ' + cl(d1) + '">' + f.dvs(d1) + '</td><td class="n ' + cl(d5) + '">' + f.dvs(d5) + '</td><td class="n ' + cl(d21) + '">' + f.dvs(d21) + '</td>' +
          '<td>' + K.spark(s.slice(-30), 110, 20, r.color) + '</td><td class="n mut">' + f.dv(Math.min(...s)) + ' … ' + f.dv(Math.max(...s)) + '</td></tr>';
      }).join('') + '</tbody></table></section>';

    // ---------- 03 главные вклады ----------
    const byPnl = L.slice().sort((a, b) => b.pnl.total - a.pnl.total);
    const top = byPnl.filter(p => p.pnl.total > 0).slice(0, 5), bot = byPnl.filter(p => p.pnl.total < 0).slice(-5).reverse();
    const mx = Math.max(1, ...top.concat(bot).map(p => Math.abs(p.pnl.total)));
    const why = p => { const fs = [['кэрри', p.pnl.carry], ['ставки', p.pnl.rates], ['спред', p.pnl.spread], ['FX', p.pnl.fx], ['сделки', p.pnl.trading]].filter(x => Math.abs(x[1]) > 1e4).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).slice(0, 2); return fs.map(x => x[0] + ' ' + f.mns(x[1], 1)).join(', '); };
    const lst = (arr, vk, t) => '<table class="mini" data-vk="' + vk + '" data-title="' + t + '"><tbody>' + arr.map(p => '<tr data-card="' + p.id + '"><td style="width:4px;padding:0;background:' + K.issuerColor(p.issuer) + '"></td><td class="name">' + esc(p.name) + ' <span class="mut3">' + esc(p.book) + '</span><div class="why">' + why(p) + '</div></td><td class="n ' + f.cls(p.pnl.total) + '"><b>' + f.mns(p.pnl.total, 1) + '</b></td><td style="width:90px">' + K.bar(p.pnl.total, mx) + '</td></tr>').join('') + '</tbody></table>';
    const share = (top.concat(bot)).reduce((s, p) => s + Math.abs(p.pnl.total), 0) / Math.max(1, L.reduce((s, p) => s + Math.abs(p.pnl.total), 0));
    html += '<section id="s3"><h2><span class="no">03</span> Главные вклады <span class="sp"></span><span class="k-note">mm ₽ · щелчок — карточка позиции</span></h2>' +
      '<p>Десять позиций ниже дают <b>' + Math.round(share * 100) + '%</b> всего оборота PnL (сумма модулей). Больше всех ' + (bot[0] ? 'потеряла <b data-card="' + bot[0].id + '" style="cursor:pointer">' + esc(bot[0].name) + '</b> (' + f.mns(bot[0].pnl.total, 1) + ' mm)' : '') + (top[0] ? ', заработала <b data-card="' + top[0].id + '" style="cursor:pointer">' + esc(top[0].name) + '</b> (' + f.mns(top[0].pnl.total, 1) + ' mm)' : '') + '. ' +
      'Полный список — ' + K.d({ title: 'PnL дня по позициям', unit: 'mm ₽', fmt: v => f.mns(v, 2), list: L, val: p => p.pnl.total }, 'все ' + L.length + ' позиций', '') + '.</p>' +
      '<div class="two"><div><div class="cap neg">▼ Потери</div>' + lst(bot, 'c05-pnl-losers', 'Главные вклады: потери') + '</div><div><div class="cap pos">▲ Заработок</div>' + lst(top, 'c05-pnl-gainers', 'Главные вклады: заработок') + '</div></div></section>';

    // ---------- 04 горизонт 2 недели ----------
    const end = M.util.addDays(M.asOf, 14);
    const ids = new Set(L.map(p => p.id));
    const cfs = M.cashflows.filter(c => c.date > M.asOf && c.date <= end && ids.has(c.pos));
    const days = []; for (let i = 0; i <= 14; i++) days.push(M.util.addDays(M.asOf, i));
    const evColor = { cpn: 'var(--accent)', mat: 'var(--pos)', put: 'var(--warn)', call: 'var(--eur)' };
    const evName = { cpn: 'купон', mat: 'погашение', put: 'пут-оферта', call: 'колл' };
    const cpnRub = cfs.filter(c => c.kind === 'cpn');
    const big = cfs.filter(c => c.kind !== 'cpn');
    const nextOffers = L.filter(p => p.event && (p.event.kind === 'put' || p.event.kind === 'call')).sort((a, b) => a.event.date.localeCompare(b.event.date));
    const cbrIn = M.cbr.meetings.find(d => d > M.asOf);
    html += '<section id="s4"><h2><span class="no">04</span> На горизонте 2 недели <span class="sp"></span><span class="k-note">' + f.date(M.asOf) + ' — ' + f.date(end) + '</span></h2>' +
      '<p>' + (M.cbr.next && M.cbr.next.date ? '<b>' + f.dshort(M.cbr.next.date) + ' — ' + esc(M.cbr.next.label) + '</b> (через ' + plural(daysTo(M.cbr.next.date), 'день', 'дня', 'дней') + '): ' + K.cbrLine() + ' ' : '<span class="mut">Календаря заседаний ЦБ в данных нет.</span> ') +
      'Риск к КС на сроке до 1 года: ' + K.d({ title: 'КС до 1Y', unit: 'тыс ₽/бп', list: L, val: p => p.risk['RUB KEY'].slice(0, M.buckets.indexOf('1Y') + 1).reduce((a, b) => a + b, 0) }, null, '') + ' тыс/бп, RUONIA до 1 года: ' + K.d({ title: 'RUONIA до 1Y', unit: 'тыс ₽/бп', list: L, val: p => p.risk['RUB RUONIA'].slice(0, M.buckets.indexOf('1Y') + 1).reduce((a, b) => a + b, 0) }, null, '') + ' тыс/бп. ' +
      'Купонов придёт на ' + K.d({ title: 'Купоны за 2 недели', unit: 'mm ₽', fmt: v => f.mn(v, 1), rows: cpnRub.map(c => ({ p: M.pos[c.pos], v: c.amountRub })), color: false }) + ' mm ₽ по ' + plural(new Set(cpnRub.map(c => c.pos)).size, 'бумаге', 'бумагам', 'бумагам') +
      (big.length ? '; погашения и оферты — ' + K.d({ title: 'Погашения и оферты', unit: 'mm ₽', fmt: v => f.mn(v, 1), rows: big.map(c => ({ p: M.pos[c.pos], v: c.amountRub })), color: false }) + ' mm ₽.' : '; погашений и оферт нет.') +
      (nextOffers[0] ? ' Ближайшая оферта — <b data-card="' + nextOffers[0].id + '" style="cursor:pointer">' + esc(nextOffers[0].name) + '</b>, ' + f.date(nextOffers[0].event.date) + ' (через ' + plural(daysTo(nextOffers[0].event.date), 'день', 'дня', 'дней') + ').' : '') + '</p>' +
      '<div class="days">' + days.map(d => {
        const dd = M.util.parse(d), we = dd.getDay() === 0 || dd.getDay() === 6;
        const ev = cfs.filter(c => c.date === d); const amt = ev.reduce((s, c) => s + c.amountRub, 0);
        const kinds = [...new Set(ev.map(c => c.kind))];
        return '<div class="day' + (we ? ' we' : '') + (d === M.asOf ? ' today' : '') + (ev.length ? ' has' : '') + '" data-day="' + d + '">' + (M.cbr.meetings.includes(d) ? '<span class="cbr">ЦБ</span>' : '') +
          '<div class="d"><b>' + dd.getDate() + '</b> ' + ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'][dd.getDay()] + '</div>' +
          kinds.map(x => '<span class="ev" style="background:' + evColor[x] + '"></span>').join('') +
          (ev.length ? '<div class="amt">' + f.mn(amt, 0) + '</div><div class="mut3">' + plural(ev.length, 'поток', 'потока', 'потоков') + '</div>' : '') + '</div>';
      }).join('') + '</div>' +
      '<div class="legend">' + Object.keys(evName).map(x => '<span><i style="background:' + evColor[x] + '"></i>' + evName[x] + '</span>').join('') + '<span><i style="background:var(--neg)"></i>заседание ЦБ</span><span class="mut3">суммы — mm ₽; щелчок по дню — разбор</span></div>' +
      '</section>';

    // ---------- 05 внимание ----------
    const alerts = [];
    const soon = nextOffers.filter(p => daysTo(p.event.date) <= 30);
    const soon180 = nextOffers.filter(p => daysTo(p.event.date) <= 180);
    const pl = arr => '<div class="lst">' + arr.map(p => '<span data-card="' + p.id + '">' + esc(p.name) + '</span>').join(' · ') + '</div>';
    if (soon.length) alerts.push({ c: 'bad', i: '⏰', h: 'Оферты в ближайшие 30 дней: <b>' + soon.length + '</b> на ' + K.d({ title: 'Номинал под оферту ≤ 30д', unit: 'mm ₽', fmt: v => f.mn(v, 0), list: soon, val: 'notionalRub', color: false }) + ' mm ₽ — решить, предъявлять ли.' + pl(soon) });
    else if (soon180.length) alerts.push({ c: 'info', i: '⏰', h: 'В ближайшие 30 дней оферт нет. За полгода — <b>' + soon180.length + '</b> на ' + K.d({ title: 'Номинал под оферту ≤ 180д', unit: 'mm ₽', fmt: v => f.mn(v, 0), list: soon180, val: 'notionalRub', color: false }) + ' mm ₽, первая — ' + f.date(soon180[0].event.date) + '.' + pl(soon180) });
    const mvB = M.sum(bonds, 'mv') || 1;
    const byIss = {}; bonds.forEach(p => { (byIss[p.issuer] = byIss[p.issuer] || []).push(p); });
    const conc = Object.entries(byIss).map(([id, arr]) => ({ id, arr, mv: M.sum(arr, 'mv') })).filter(x => !M.isMinfin(x.id) && x.mv / mvB > 0.05).sort((a, b) => b.mv - a.mv);
    if (conc.length) alerts.push({ c: '', i: '◔', h: 'Концентрация: ' + conc.map(x => '<b>' + esc(M.issuer[x.id].short) + '</b> ' + K.d({ title: 'Эмитент ' + M.issuer[x.id].short + ' · MV', unit: 'mm ₽', fmt: v => f.mn(v, 0), list: x.arr, val: 'mv', color: false }, Math.round(x.mv / mvB * 100) + '%', '')).join(', ') + ' облигаций по MV (порог 5%, без Минфина).' });
    const wide = bonds.filter(p => p.zspread != null && p.zspread >= 300).sort((a, b) => b.zspread - a.zspread);
    if (wide.length) alerts.push({ c: '', i: '↔', h: 'Широкие спреды (≥ 300 б.п.): <b>' + wide.length + '</b> бумаг, CS01 ' + K.d({ title: 'CS01 бумаг со спредом ≥ 300', unit: 'тыс ₽/бп', list: wide, val: 'cs01' }, null, '') + ' тыс/бп.' + '<div class="lst">' + wide.map(p => '<span data-card="' + p.id + '">' + esc(p.name) + ' ' + Math.round(p.zspread) + '</span>').join(' · ') + '</div>' });
    const moved = bonds.filter(p => Math.abs(p.spreadChgBp || 0) >= 5).sort((a, b) => Math.abs(b.spreadChgBp) - Math.abs(a.spreadChgBp));
    if (moved.length) alerts.push({ c: '', i: '⇅', h: 'Спред сдвинулся на 5+ б.п.: <b>' + moved.length + '</b> бумаг, PnL от спреда ' + K.d({ title: 'PnL спреда · сдвиг ≥ 5 б.п.', unit: 'mm ₽', fmt: v => f.mns(v, 2), list: moved, val: p => p.pnl.spread }) + ' mm.' + '<div class="lst">' + moved.slice(0, 10).map(p => '<span data-card="' + p.id + '">' + esc(p.name) + ' <span class="' + (p.spreadChgBp > 0 ? 'chg-up' : 'chg-dn') + '">' + f.bps(p.spreadChgBp) + '</span></span>').join(' · ') + '</div>' });
    if (traded.length) alerts.push({ c: 'info', i: '✎', h: 'Сделки сегодня: <b>' + traded.length + '</b>, PnL сделок ' + K.d({ title: 'PnL сделок дня', unit: 'mm ₽', fmt: v => f.mns(v, 2), list: traded, val: p => p.pnl.trading }) + ' mm.' + '<div class="lst">' + traded.map(p => '<span data-card="' + p.id + '">' + esc(p.name) + ' ' + (p.tradeToday.qty > 0 ? '+' : '') + f.mn(p.tradeToday.qty, 0) + '</span>').join(' · ') + '</div>' });
    const neg = bonds.filter(p => p.carryDay < 0 && p.book !== 'HTM');
    if (neg.length) alerts.push({ c: '', i: '₽', h: 'Отрицательное кэрри у <b>' + neg.length + '</b> бумаг: ' + K.d({ title: 'Отрицательное кэрри', unit: 'тыс ₽/день', fmt: f.ks, list: neg, val: 'carryDay' }) + ' тыс в день (фондирование дороже доходности).' });
    html += '<section id="s5"><h2><span class="no">05</span> Внимание <span class="sp"></span><span class="k-note">' + alerts.length + ' пунктов</span></h2><div class="alerts">' +
      alerts.map(a => '<div class="alert ' + a.c + '"><div class="ic">' + a.i + '</div><div>' + a.h + '</div></div>').join('') + '</div></section>';

    // ---------- 06 рынок ----------
    // фраза о ставках — по данным: направление по среднему сдвигу RUONIA OIS, бакет с наибольшим сдвигом, знак базиса
    function mktSentence() {
      const r = M.curve['RUB RUONIA'], b = K.basisCurve(), a = avgChg(r), ab = avgChg(b);
      const head = noCurve(r) ? 'Ставки: кривой RUONIA OIS в прогоне нет' : (a > 0.5 ? 'Ставки выросли' : a < -0.5 ? 'Ставки снизились' : 'Ставки почти не изменились') + ': RUONIA OIS ' + chgRange(r) + ' б.п.' + (Math.abs(a) > 0.5 ? ' (сильнее всего ' + maxBucket(r) + ')' : '');
      return head + ', КС-свопы ' + chgRange(M.curve['RUB KEY']) + ', базис ОФЗ ' + chgRange(b) + (ab > 0.5 ? ' — ОФЗ слабее свопов.' : ab < -0.5 ? ' — ОФЗ сильнее свопов.' : '.');
    }
    // курс PnL FX (R26): рыночный — курс шапки (MOEX 19:00, иначе 14:00 / CETS / ЦБ — источник рядом), курс ЦБ,
    // действующий на дату, — рядом; прогон до R26 считал PnL по курсу ЦБ — тогда сказано, что по нему
    const differs = (a, c) => a && a.rate[c] != null && (Math.abs(a.rate[c] - M.fx[c]) > 0.005 || Math.abs((a.chgPct[c] || 0) - (M.fxChgPct[c] || 0)) > 0.005);
    const fxPnlRate = c => (M.fxSource && M.fxSource[c] ? ', ' + esc(M.fxSource[c]) : '') +
      (differs(M.fxPnl, c) ? '; PnL по курсу ' + M.fxPnl.label + ' ' + f.n(M.fxPnl.rate[c], 2) + ', ' + (M.fxPnl.chgPct[c] > 0 ? '+' : '') + f.n(M.fxPnl.chgPct[c], 2) + '%'
        : differs(M.fxCbr, c) ? '; ЦБ ' + f.n(M.fxCbr.rate[c], 2) + ', ' + (M.fxCbr.chgPct[c] > 0 ? '+' : '') + f.n(M.fxCbr.chgPct[c], 2) + '%' : '');
    const mv = M.marketMovers.slice().sort((a, b) => b.chgBp - a.chgBp);
    const up = mv.slice(0, 6), dn = mv.slice(-6).reverse();
    const ccyFx = M.ccys.filter(c => c !== 'RUB');
    const mvT = (arr, vk, t) => '<table class="mini" data-vk="' + vk + '" data-title="' + t + '"><thead><tr><th>Выпуск</th><th>Рейт.</th><th class="n">Дох.</th><th class="n">Δ б.п.</th></tr></thead><tbody>' + arr.map(b => '<tr><td class="name">' + esc(b.name) + ' <span class="mut3">' + esc(b.sector) + '</span></td><td class="mut">' + esc(b.rating) + '</td><td class="n">' + f.pct(b.ytm) + '</td><td class="n ' + (b.chgBp > 0 ? 'chg-up' : 'chg-dn') + '"><b>' + f.bps(b.chgBp) + '</b></td></tr>').join('') + '</tbody></table>';
    html += '<section id="s6"><h2><span class="no">06</span> Рынок <span class="sp"></span><span class="k-note">изменения к закрытию ' + f.date(M.prevDate) + '</span></h2>' +
      '<p>' + mktSentence() + ' ' +
      fxRatesLine() + '. Курсы: ' + ccyFx.map(c => c + ' ' + f.n(M.fx[c], 2) + ' (' + (M.fxChgPct[c] > 0 ? '+' : '') + f.n(M.fxChgPct[c], 2) + '%' + fxPnlRate(c) + ', PnL ' + K.d({ title: 'FX PnL ' + c, unit: 'mm ₽', fmt: v => f.mns(v, 2), list: L.filter(p => p.ccy === c), val: p => p.pnl.fx }) + ' mm)').join(', ') + '. ' +
      'КС ' + f.pct(M.indices['КС']) + ', RUONIA ' + f.pct(M.indices['RUONIA']) + '.</p>' +
      '<div class="two"><div><div class="cap">Кривые RUB: сегодня, вчера и сдвиг</div><div class="chart" id="curveChart"></div></div>' +
      '<div><div class="cap">Корпоративный рынок: сильнее всего выросли доходности</div>' + mvT(up, 'c05-movers-up', 'Корпоративный рынок: рост доходностей') + '<div class="cap" style="margin-top:10px">…и снизились</div>' + mvT(dn, 'c05-movers-down', 'Корпоративный рынок: снижение доходностей') + '</div></div>' + marketHist() + '</section>';

    root.innerHTML = html;
    K.tableToolsAll(root);

    // кликабельные дни
    root.querySelectorAll('.day.has').forEach(el => el.onclick = () => {
      const d = el.dataset.day, ev = cfs.filter(c => c.date === d);
      K.drill({ title: 'Потоки ' + f.date(d), unit: 'mm ₽', fmt: v => f.mn(v, 1), rows: ev.map(c => ({ p: M.pos[c.pos], v: c.amountRub })), color: false, note: [...new Set(ev.map(c => evName[c.kind]))].join(', ') });
    });
    // график кривых
    const P = M.pillars;
    const ru = M.curve['RUB RUONIA'], ks = M.curve['RUB KEY'], ba = K.basisCurve();
    const ofzY = M.ofzCurve.map((v, i) => v - ru.chg[i] / 100 - ba.chg[i] / 100);
    K.chart(document.getElementById('curveChart'), () => ({
      grid: { left: 6, right: 6, top: 30, bottom: 4, containLabel: true }, legend: { top: 0, left: 0 },
      tooltip: { trigger: 'axis', valueFormatter: v => v == null ? '—' : f.n(v, 2) },
      xAxis: { type: 'category', data: M.buckets },
      yAxis: [{ type: 'value', scale: true, axisLabel: { formatter: v => f.n(v, 1) + '%' } }, { type: 'value', name: 'Δ б.п.', splitLine: { show: false } }],
      series: [
        { name: 'RUONIA', type: 'line', data: ru.pts, color: K.curveColors['RUB RUONIA'], showSymbol: false, lineStyle: { width: 2 } },
        { name: 'RUONIA вчера', type: 'line', data: ru.pts.map((v, i) => v - ru.chg[i] / 100), color: K.curveColors['RUB RUONIA'], showSymbol: false, lineStyle: { width: 1, type: 'dashed' } },
        { name: 'ОФЗ', type: 'line', data: M.ofzCurve, color: K.curveColors['RUB OFZ'], showSymbol: false, lineStyle: { width: 2 } },
        { name: 'ОФЗ вчера', type: 'line', data: ofzY, color: K.curveColors['RUB OFZ'], showSymbol: false, lineStyle: { width: 1, type: 'dashed' } },
        { name: 'Δ RUONIA', type: 'bar', yAxisIndex: 1, data: ru.chg, color: K.curveColors['RUB RUONIA'], itemStyle: { opacity: .22 }, barGap: 0, barMaxWidth: 9 },
        { name: 'Δ КС', type: 'bar', yAxisIndex: 1, data: ks.chg, color: K.curveColors['RUB KEY'], itemStyle: { opacity: .22 }, barMaxWidth: 9 },
      ],
    }));
  }
  render();
  K.onFilter(render);
  K.on('theme', render);
})();
</script>
</body>
</html>
