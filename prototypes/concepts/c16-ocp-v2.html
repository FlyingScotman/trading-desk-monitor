<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>C16 · ОВП — макет</title>
<link rel="stylesheet" href="lib/kit.css">
<style>
.v2-strip { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--warn); }
.v2-sum { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); gap: 8px; }
.v2-sum .k-kpi.tot { border-color: var(--accent); }
.v2-sum .k-kpi .l .c { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.v2-chart { height: 300px; }
.k-tbl tr.tot td { font-weight: 650; border-top: 1px solid var(--line-2); background: var(--panel-2); }
</style>
</head>
<body>
<div class="k-page">
  <div id="view"></div>
</div>
<script src="../echarts.min.js"></script>
<script src="lib/boot.js"></script>
<script src="lib/kit.js"></script>
<script>
(function () {
  'use strict';
  // МАКЕТ экрана «ОВП» (trading-desk-monitor#446), вторая версия по замечаниям владельца: ОВП книг фильтра шапки по
  // валютам — в валюте или в долларовом эквиваленте по выбранному курсу; общая ОВП в USD; книги × валюты; история по
  // дням. Данные вымышленные, встроены в страницу, запросов к серверу нет; боевой экран — c16-ocp.html.
  // Курсы — те, что прогон публикует (FX — рыночный: MOEX 19:00, иначе 14:00, иначе закрытие CETS, иначе ЦБ;
  // FX_CBR — ЦБ, действующий на дату); в макете — демо-значения.
  // Общая ОВП — большая из сумм длинных и коротких позиций по валютам в USD-эквиваленте (USD входит своей суммой).
  const M = MOCK, K = KIT, f = K.f, esc = K.esc, h = K.h;
  const bar = K.top({ title: 'C16 · ОВП — макет' });
  ['[data-a=ofzview]', '[data-a=repr]'].forEach(s => { const e = bar.querySelector(s); if (e) e.style.display = 'none'; });
  const view = document.getElementById('view');

  // ---------- демо-данные (вымышленные) ----------
  const bday = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); do d.setUTCDate(d.getUTCDate() + n); while (d.getUTCDay() === 0 || d.getUTCDay() === 6); return d.toISOString().slice(0, 10); };
  const AS_OF = M.asOf || '2026-10-28', N = 66;
  const DATES = []; for (let i = 0, d = AS_OF; i < N; i++, d = bday(d, -1)) DATES.unshift(d);
  const CCYS = ['USD', 'EUR', 'CNY'];
  // ОВП книги на дату, mm в валюте; книги — демо-набора шапки
  const TODAY = {
    'FXCR-USD': { USD: 12 }, 'FXCR-CNY': { CNY: 150 }, FXB: { CNY: -5 },
    'FXB-SWAP': { USD: -8, EUR: 3, CNY: -60 }, 'FXB-FWD': { USD: -2.5, EUR: -1, CNY: 20 },
    HTM: { EUR: 2 }, 'IC-BND': { USD: 1.5 }, 'AM-CNY': { CNY: 40 },
  };
  const RATES = {  // ₽ за единицу, по дням; источник — как в прогоне
    market: { name: 'MOEX 19:00', title: 'рыночный курс: индикативный MOEX 19:00 (нет — 14:00, закрытие CETS, ЦБ)', base: { USD: 81.4, EUR: 94.6, CNY: 11.4 } },
    cbr: { name: 'ЦБ', title: 'официальный курс ЦБ, действующий на дату', base: { USD: 81.2, EUR: 94.3, CNY: 11.38 } },
  };
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const HIST = {};  // книга → валюта → [mm по дням]; случайное блуждание назад от сегодняшней цифры
  Object.entries(TODAY).forEach(([b, o]) => {
    HIST[b] = {};
    Object.entries(o).forEach(([c, v]) => {
      const a = new Array(N); a[N - 1] = v;
      for (let i = N - 2; i >= 0; i--) a[i] = Math.round((a[i + 1] + v * 0.08 * (rnd() * 2 - 1)) * 10) / 10;
      HIST[b][c] = a;
    });
  });
  const rateOn = (src, c, i) => c === 'USD' ? RATES[src].base.USD * (1 + 0.003 * Math.sin(i / 4)) : RATES[src].base[c] * (1 + 0.004 * Math.sin(i / 5 + c.length + (c === 'CNY' ? 2 : 0)));
  const toUsd = (v, c, i) => c === 'USD' ? v : v * rateOn(S.rate, c, i) / rateOn(S.rate, 'USD', i);

  // ---------- состояние ----------
  const S = { data: 'ok', unit: 'ccy', rate: 'market', period: 22 };
  if (/s=none/.test(location.hash)) S.data = 'none';

  // книги фильтра шапки (юрлицо, деск, книги), у которых есть ОВП; фильтр валюты шапки — валюты
  const books = () => {
    const F = K.filter;
    return Object.keys(TODAY).map(id => M.book[id]).filter(b => b && (!F.entity || b.entity === F.entity) && (!F.desk || b.desk === F.desk) && (!F.books || !F.books.length || F.books.includes(b.id)));
  };
  const ccys = () => CCYS.filter(c => !K.filter.ccy || K.filter.ccy === c);
  const gross = vals => { let l = 0, s = 0; vals.forEach(v => { if (v > 0) l += v; else s -= v; }); return Math.max(l, s); };  // большая из сумм длинных и коротких
  const fmt = v => v == null ? '<span class="mut3">—</span>' : '<span class="' + f.cls(Math.round(v * 10)) + '">' + f.s(v, 1) + '</span>';
  const unitOf = c => 'mm ' + (S.unit === 'usd' ? 'USD' : c);
  const shown = (v, c, i) => S.unit === 'usd' ? toUsd(v, c, i) : v;

  function panel(title, cls) { const p = h('div', 'k-panel' + (cls ? ' ' + cls : '')); p.innerHTML = '<div class="hd"><h3>' + title + '</h3><span class="sp"></span><span class="m"></span></div><div class="bd"></div>'; return p; }
  let chart = null;

  function render() {
    if (chart) { chart.dispose(); chart = null; }
    const B = books(), C = ccys().filter(c => B.some(b => HIST[b.id][c])), today = S.data === 'ok', T = N - 1;
    view.innerHTML = '';
    const wrap = h('div', 'k-grid');

    const strip = h('div', 'v2-strip'); strip.innerHTML = '<span>макет · демо-данные</span><span class="m"></span>';
    K.seg(strip.querySelector('.m'), [['ok', 'есть данные'], ['none', 'нет данных за день']], S.data, v => { S.data = v; history.replaceState(null, '', v === 'none' ? '#s=none' : '#'); render(); });
    wrap.appendChild(strip);

    // итог: дата, общая ОВП в USD, валюты
    const sp = panel('ОВП на ' + f.dshort(AS_OF));
    const m = sp.querySelector('.m'); m.style.cssText = 'display:inline-flex;gap:6px;flex-wrap:wrap';
    const u = h('span'), r = h('span'); m.append(u, r);
    K.seg(u, [['ccy', 'в валюте'], ['usd', 'в USD']], S.unit, v => { S.unit = v; render(); });
    const rs = K.seg(r, Object.entries(RATES).map(([k, x]) => [k, 'курс ' + x.name]), S.rate, v => { S.rate = v; render(); });
    rs.querySelectorAll('button').forEach((b, i) => { b.title = Object.values(RATES)[i].title; });
    const tot = c => B.reduce((s, b) => s + ((HIST[b.id][c] || [])[T] || 0), 0);
    if (!today) sp.querySelector('.bd').innerHTML = '<div class="k-empty">Нет данных ОВП за ' + f.date(AS_OF) + '</div>';
    else if (!B.length) sp.querySelector('.bd').innerHTML = '<div class="k-empty">У книг фильтра нет валютной позиции</div>';
    else {
      const usd = C.map(c => toUsd(tot(c), c, T));
      sp.querySelector('.bd').innerHTML = '<div class="v2-sum">' +
        '<div class="k-kpi tot" title="большая из сумм длинных и коротких позиций по валютам, USD-эквивалент"><div class="l">Общая ОВП</div><div class="v">' + f.n(gross(usd), 1) + ' <span class="u">mm USD</span></div><div class="s">&nbsp;</div></div>' +
        C.map((c, k) => '<div class="k-kpi"><div class="l"><i class="c" style="background:' + K.ccyColor(c) + '"></i>' + c + '</div><div class="v">' + fmt(shown(tot(c), c, T)) + ' <span class="u">' + unitOf(c) + '</span></div><div class="s">' +
          (c === 'USD' ? '&nbsp;' : S.unit === 'usd' ? f.s(tot(c), 1) + ' mm ' + c : '≈ ' + f.s(usd[k], 1) + ' mm USD') + '</div></div>').join('') + '</div>';
    }
    wrap.appendChild(sp);

    // книги × валюты
    const bp = panel('По книгам');
    bp.querySelector('.bd').classList.add('flush', 'scroll');
    if (today && B.length) {
      const rows = B.map(b => { const v = C.map(c => (HIST[b.id][c] || [])[T]); return { b, v, g: gross(C.map((c, k) => v[k] == null ? 0 : toUsd(v[k], c, T))) }; }).sort((a, z) => z.g - a.g);
      const cell = (v, c) => '<td class="n">' + (v == null ? '<span class="mut3">—</span>' : fmt(shown(v, c, T))) + '</td>';
      bp.querySelector('.bd').innerHTML = '<table class="k-tbl" data-vk="c16v2-books" data-title="ОВП по книгам"><thead><tr><th>Книга</th>' +
        C.map(c => '<th class="n">' + c + '<span class="k-thu">' + unitOf(c) + '</span></th>').join('') + '<th class="n" title="большая из сумм длинных и коротких, USD-эквивалент">Общая<span class="k-thu">mm USD</span></th></tr></thead><tbody>' +
        rows.map(x => '<tr><td>' + esc(x.b.name) + '</td>' + x.v.map((v, k) => cell(v, C[k])).join('') + '<td class="n">' + f.n(x.g, 1) + '</td></tr>').join('') +
        '<tr class="tot"><td>Итого</td>' + C.map(c => cell(tot(c), c)).join('') + '<td class="n">' + f.n(gross(C.map(c => toUsd(tot(c), c, T))), 1) + '</td></tr></tbody></table>';
    } else bp.querySelector('.bd').innerHTML = '<div class="k-empty">' + (today ? 'Нет книг с ОВП' : 'Нет данных за ' + f.date(AS_OF)) + '</div>';
    wrap.appendChild(bp);

    // история по дням: столбцы по валютам (USD-эквивалент), линия — общая ОВП
    const hp = panel('По дням');
    K.seg(hp.querySelector('.m'), [[10, '2 нед'], [22, 'месяц'], [66, '3 мес']], S.period, v => { S.period = v; render(); });
    hp.querySelector('.bd').innerHTML = '<div class="v2-chart"></div>';
    wrap.appendChild(hp);
    view.appendChild(wrap);
    K.tableToolsAll(wrap);

    const last = today ? N : N - 1, I = []; for (let i = Math.max(0, last - S.period); i < last; i++) I.push(i);
    const day = (c, i) => B.reduce((s, b) => s + ((HIST[b.id][c] || [])[i] || 0), 0);
    const css = K.css;
    chart = K.chart(hp.querySelector('.v2-chart'), () => ({
      animation: false, grid: { left: 6, right: 10, top: 30, bottom: 4, containLabel: true }, legend: { top: 0, left: 0 },
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, valueFormatter: v => v == null ? '—' : f.s(v, 1) + ' mm USD' },
      xAxis: { type: 'category', data: I.map(i => f.dshort(DATES[i])) },
      yAxis: { type: 'value', unit: 'mm USD', axisLabel: { formatter: v => K.tick(v, 1) } },
      series: C.map(c => ({ name: c, type: 'bar', stack: 'o', barMaxWidth: 28, data: I.map(i => Math.round(toUsd(day(c, i), c, i) * 10) / 10), itemStyle: { color: K.ccyColor(c) } }))
        .concat([{ name: 'общая', type: 'line', data: I.map(i => Math.round(gross(C.map(c => toUsd(day(c, i), c, i))) * 10) / 10), showSymbol: false, lineStyle: { width: 2 }, color: css('--fg') }]),
    }));
  }

  K.onFilter(render);
  K.on('numfmt', render);
  render();
})();
</script>
</body>
</html>
