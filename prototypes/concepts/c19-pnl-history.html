<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>C19 · PnL за период</title>
<link rel="stylesheet" href="lib/kit.css">
<style>
.ctl { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; }
.ctl label { display:flex; gap:6px; align-items:center; color:var(--fg-2); }
.ctl input, .ctl select { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:5px; padding:5px 6px; min-width:0; max-width:100%; font:inherit; }
.k-panel, .bd { min-width:0; }
#tabs b { font-family:var(--mono); font-size:11px; color:var(--fg-3); font-weight:500; margin-right:6px; }
#tabs button.on b { color:var(--accent); }
#status { padding:4px 0; color:var(--fg-2); }
#status:empty { display:none; }
#main { display:flex; flex-direction:column; gap:12px; min-width:0; }
#main:empty { display:none; }
#anchor[hidden], #coveragePanel[hidden] { display:none; }
#coverage { line-height:1.6; }
.lede { display:flex; gap:4px 12px; align-items:baseline; flex-wrap:wrap; }
.lede h1 { font-size:16px; margin:0; font-weight:650; }
.lede p { margin:0; color:var(--fg-2); max-width:110ch; }
.k-kpis .k-kpi.main { border-color:var(--line-2); background:var(--panel-2); }
.k-kpis .k-kpi.flag { box-shadow:inset 3px 0 0 var(--warn); }
.grid2 { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:12px; }
.grid2e { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.mwrap { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:12px; align-items:start; }
@media (max-width:1100px) { .grid2, .mwrap { grid-template-columns:minmax(0,1fr); } }
@media (max-width:800px) { .grid2e { grid-template-columns:minmax(0,1fr); } }
.ch { width:100%; height:300px; } .ch.tall { height:360px; } .ch.mini { height:150px; }
.tscroll { overflow:auto; max-height:540px; }
.sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px; flex:none; }
.sw.hatch { background-image:repeating-linear-gradient(135deg, transparent 0 2px, rgba(255,255,255,.45) 2px 3px); outline:1px dashed var(--fg-3); }
button.link { background:none; border:0; color:var(--accent); font:inherit; cursor:pointer; text-align:left; padding:0; }
button.link:hover { text-decoration:underline; }
.k-tbl th.n { text-align:right; }
.k-tbl td.stick, .k-tbl th.stick { position:sticky; left:0; z-index:1; background:var(--panel); }
.k-tbl thead th.stick { z-index:3; background:var(--panel-2); }
.k-tbl tr.grp td.stick, .k-tbl tfoot td.stick, .k-tbl tr.tot td.stick { background:var(--bg-2); }
.k-tbl tr.grp td { cursor:default; }
.k-tbl tr.tot td { font-weight:650; background:var(--panel-2); border-top:1px solid var(--line-2); }
.k-tbl th.sortable.sorted { color:var(--fg); box-shadow:inset 0 -2px 0 var(--accent); }
.k-tbl tr.warnrow td:first-child { box-shadow:inset 3px 0 0 var(--warn); }
.k-tbl td.cell { cursor:pointer; }
.k-tbl td.cell.on { outline:2px solid var(--accent); outline-offset:-2px; }
.k-tbl td.kid { padding-left:28px; }
#mt .k-tbl thead th { white-space:normal; min-width:70px; vertical-align:bottom; line-height:1.25; }
#mt .k-tbl thead th.stick { min-width:180px; }
.k-tbl .tw { background:none; border:0; padding:0 4px 0 0; cursor:pointer; color:var(--fg-3); width:16px; }
.contrib { display:grid; grid-template-columns:minmax(0,1fr) auto 92px; gap:3px 8px; align-items:center; font-size:12.5px; }
.contrib h4 { grid-column:1/-1; margin:8px 0 2px; font-size:11px; font-weight:500; color:var(--fg-3); letter-spacing:.06em; text-transform:uppercase; }
.contrib .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.contrib .bars { display:flex; } .contrib .bars.l { justify-content:flex-end; }
.contrib .bar { height:8px; border-radius:2px; }
.contrib .meth { grid-column:1/-1; margin:-3px 0 2px; font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.contrib .more { grid-column:1/-1; font-size:12px; margin-top:4px; }
.contrib button.why { text-align:left; color:inherit; font:inherit; } .contrib button.why[aria-pressed=true] { font-weight:600; text-decoration:underline; }
.hint { color:var(--fg-3); font-size:12px; }
.netbox { display:inline-flex; gap:5px; align-items:center; color:var(--fg-2); font-size:12px; white-space:nowrap; }
.netbox.off { opacity:.45; }
.k-panel > .hd .k-note { white-space:normal; }
.k-top [data-a=repr], .k-top [data-a=ofzview] { display:none; }
/* D · Ставки по кривым */
.grids3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
@media (max-width:1350px) { .grids3 { grid-template-columns:minmax(0,1fr); } }
.k-tbl.hm th, .k-tbl.hm td { padding-left:7px; padding-right:7px; }
.k-tbl tr.critrow td:first-child { box-shadow:inset 3px 0 0 var(--neg); }
.k-tbl tr.sel td { background:var(--accent-bg); }
.sevtxt.warn { color:var(--warn); } .sevtxt.crit { color:var(--neg); }
/* E · Позиция */
.pside { display:grid; grid-template-columns:270px minmax(0,1fr); gap:12px; align-items:start; }
.pmain { display:flex; flex-direction:column; gap:12px; min-width:0; }
@media (max-width:1100px) { .pside { grid-template-columns:minmax(0,1fr); } .plist { max-height:260px; } }
.plist { max-height:760px; overflow:auto; position:relative; }
.plist .g { padding:8px 12px 4px; font-size:11px; color:var(--fg-3); letter-spacing:.06em; text-transform:uppercase; }
.plist button { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 8px; width:100%; background:transparent; border:0; border-left:3px solid transparent; padding:6px 12px; cursor:pointer; text-align:left; color:var(--fg); font:inherit; }
.plist button:hover { background:var(--hover, var(--bg-2)); }
.plist button[aria-current="true"] { background:var(--accent-bg); border-left-color:var(--accent); }
.plist .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.plist .n { font-variant-numeric:tabular-nums; }
.plist .sub { grid-column:1/-1; color:var(--fg-3); font-size:11.5px; }
.phead { display:flex; flex-wrap:wrap; gap:6px 18px; align-items:baseline; }
.phead h2 { margin:0; font-size:18px; font-weight:650; }
.phead > span { color:var(--fg-2); }
.tags { display:flex; gap:6px; flex-wrap:wrap; }
.st { display:inline-flex; gap:4px; align-items:center; font-size:11.5px; padding:1px 8px; border-radius:10px; border:1px solid; white-space:nowrap; }
.st.ok { color:var(--pos); border-color:var(--pos); } .st.info { color:var(--fg-2); border-color:var(--line-2); }
.attrbar { display:flex; height:22px; border-radius:4px; overflow:hidden; gap:2px; }
.attrbar div { min-width:2px; }
.legendrow { display:flex; gap:6px 14px; flex-wrap:wrap; color:var(--fg-2); font-size:12px; align-items:center; margin-top:6px; }
.ch.short { height:200px; }
#pDays td.ev { white-space:normal; min-width:220px; }
.flagtxt { font-size:11.5px; white-space:normal; color:var(--fg-2); }
.flagtxt.warn { color:var(--warn); } .flagtxt.crit { color:var(--neg); }
/* F · Контроль */
.checks { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; }
.check { text-align:left; background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; cursor:pointer; display:flex; flex-direction:column; gap:6px; font:inherit; min-width:0; }
.check:hover { border-color:var(--accent); }
.check[aria-pressed="true"] { border-color:var(--accent); background:var(--accent-bg); }
.check .h { display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap; }
.check .h b { font-weight:600; }
.check .d { color:var(--fg-3); font-size:12px; }
.check .chips { display:flex; gap:4px; flex-wrap:wrap; }
.sev { display:inline-flex; gap:4px; align-items:center; font-size:11.5px; padding:1px 8px; border-radius:10px; border:1px solid; white-space:nowrap; }
.sev.crit { color:var(--neg); border-color:var(--neg); background:var(--neg-bg); }
.sev.warn { color:var(--warn); border-color:var(--warn); }
.sev.info { color:var(--fg-2); border-color:var(--line-2); }
.sev.ok { color:var(--pos); border-color:var(--pos); }
.sev.nd { color:var(--fg-3); border-color:var(--line-2); border-style:dashed; }
.cal { display:flex; flex-wrap:wrap; gap:2px; }
.cal i, .legendrow i { display:inline-block; width:11px; height:16px; border-radius:2px; border:1px solid var(--line); background:var(--pos-bg); }
.legendrow i { height:11px; margin-right:5px; vertical-align:-1px; }
.cal .month { margin-left:8px; }
i.cal-issue { background:var(--neg-bg); border-color:var(--neg); }
i.cal-norun { background:var(--warn); border-color:var(--warn); }
#ckList td.txt { white-space:normal; min-width:260px; }
@media (max-width:650px) { .ctl label { flex-wrap:wrap; } .contrib { grid-template-columns:minmax(0,1fr) auto 50px; } }
</style>
</head>
<body>
<nav class="k-tabs" id="tabs" aria-label="Экраны PnL за период"></nav>
<div class="k-page">
  <div class="k-panel"><div class="bd ctl">
    <span id="preset" aria-label="Период"></span>
    <label>С <input type="date" id="from"></label><label>По <input type="date" id="to"></label>
    <label>Валюта позиции <select id="ccy" aria-label="Валюта позиции"></select></label>
    <label>Тип <select id="assetClass" aria-label="Тип позиции"></select></label>
    <label>Эмитент <select id="issuer" aria-label="Эмитент"></select></label>
    <input type="search" id="search" placeholder="Позиция, инструмент, книга…" aria-label="Поиск по позициям периода">
    <button class="k-btn" id="reset">Сбросить все фильтры</button>
    <span class="k-note" id="pnote">Все суммы в RUB · даты включительно</span>
  </div></div>
  <div id="status" role="status" aria-live="polite"></div>
  <div class="k-panel" id="anchor" hidden><div class="hd"><h3>Выбранный прогон — отдельно от периода</h3></div><div class="bd" id="anchorSummary"></div></div>
  <div id="main"></div>
  <div class="k-panel" id="coveragePanel" hidden><div class="hd"><h3>Доступность и границы метода</h3></div><div class="bd" id="coverage"></div></div>
</div>
<script src="../echarts.min.js"></script>
<script src="lib/boot.js"></script>
<script src="lib/kit.js"></script>
<script src="lib/instr.js"></script>
<script src="lib/pnl-history.js"></script>
<script src="lib/pnl-period.js"></script>
<script src="lib/pnl-period-curves.js"></script>
<script src="lib/pnl-period-position.js"></script>
<script src="lib/pnl-period-control.js"></script>
<script src="lib/pnl-period-page.js"></script>
</body>
</html>
