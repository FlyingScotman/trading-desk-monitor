<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>C13 · Эмитенты</title>
<link rel="stylesheet" href="lib/kit.css">
<style>
.c13-strip { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.c13-main { display: grid; grid-template-columns: minmax(420px, 560px) minmax(0, 1fr); gap: 12px; align-items: start; }
.c13-two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 1250px) { .c13-strip { grid-template-columns: 1fr 1fr; } .c13-strip > :first-child { grid-column: 1 / -1; } }
@media (max-width: 1100px) { .c13-main, .c13-two { grid-template-columns: 1fr; } }
@media (max-width: 720px) { .c13-strip { grid-template-columns: 1fr; } }
.c13-list { position: sticky; top: 52px; }
.k-tbl tr.sel td { background: var(--accent-bg) !important; }
.k-tbl tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.ihd { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.ihd .sw { width: 10px; align-self: stretch; border-radius: 3px; }
.ihd .nm { font-size: 20px; font-weight: 650; line-height: 1.2; }
.ihd .full { color: var(--fg-2); font-size: 12px; }
.ch { height: 270px; }
.chs { height: 230px; }
table.mini { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.mini th { text-align: left; color: var(--fg-2); font-weight: 500; padding: 4px 6px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
table.mini td { padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.mini tr[data-card] { cursor: pointer; }
table.mini tr[data-card]:hover td { background: var(--hover); }
table.mini td.n, table.mini th.n { text-align: right; font-variant-numeric: tabular-nums; }
table.mini tr.put td { background: color-mix(in srgb, var(--warn) 8%, transparent); }
table.mini tr.put td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
.kb { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11px; border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.mtag { font-size: 10.5px; color: var(--fg-3); }
@media (max-width: 720px) { .k-top .brand .tag { display: none; } .k-panel > .hd { flex-wrap: wrap; } }
</style>
</head>
<body>
<div class="k-page">
  <div id="kpis"></div>
  <div class="k-panel">
    <div class="hd"><h3>Концентрация</h3><span class="sp"></span><span id="exmf"></span><span class="k-note">мера:</span><span id="meas"></span></div>
    <div class="bd"><div class="c13-strip">
      <div><div class="k-note" id="paretoNote">топ-15 эмитентов и накопленная доля · щелчок — открыть эмитента</div><div id="pareto" class="chs"></div></div>
      <div><div class="k-note">по секторам · щелчок — из чего</div><div id="sector" class="chs"></div></div>
      <div><div class="k-note">по рейтингам · щелчок — из чего</div><div id="rating" class="chs"></div></div>
    </div></div>
  </div>
  <div class="c13-main">
    <div class="k-panel c13-list"><div class="hd"><h3>Эмитенты в книге</h3><span class="sp"></span><span class="k-note">щелчок по имени — дашборд эмитента</span></div><div class="bd flush" id="list"></div></div>
    <div id="dash" style="display:flex;flex-direction:column;gap:12px;min-width:0"></div>
  </div>
</div>
<script src="../echarts.min.js"></script>
<script src="lib/mock.js"></script>
<script src="lib/kit.js"></script>
<script>
(function () {
  const M = MOCK, K = KIT, f = K.f, U = M.util, esc = K.esc;
  K.top({ title: 'C13 · Эмитенты', tag: 'концентрация, кривая и риск каждого эмитента' });
  const RATING = ['AAA', 'AA+', 'AA', 'AA-', 'A+', 'A', 'A-', 'BBB+', 'BBB', 'BBB-', 'BB+', 'BB', 'B'];
  const KC = { cpn: '#4c9dff', put: '#e3b341', call: '#b48cff', mat: '#3fb67a' };
  const KN = { cpn: 'купон', put: 'пут-оферта', call: 'колл', mat: 'погашение' };
  const MEAS = {
    mv: { t: 'MV', unit: 'mm ₽', val: p => p.mv, fmt: v => f.mn(v, 0), abs: true },
    cs01: { t: 'CS01', unit: 'тыс ₽/бп', val: p => p.cs01, fmt: f.dv, abs: true },
    dv01: { t: 'DV01', unit: 'тыс ₽/бп', val: p => p.dv01, fmt: f.dv, abs: true },
    pnl: { t: 'PnL дня', unit: 'тыс ₽', val: p => p.pnl.total, fmt: f.k },
  };
  const st = { meas: 'mv', sel: null, curve: 'ytm', exMf: true };
  try { Object.assign(st, JSON.parse(localStorage.getItem('c13') || '{}')); } catch (e) { }
  const save = () => { try { localStorage.setItem('c13', JSON.stringify(st)); } catch (e) { } };
  const sumBy = (a, fn) => a.reduce((s, x) => s + fn(x), 0);

  // ---------- агрегаты по эмитентам ----------
  let ISS = [];
  function build() {
    const L = K.list().filter(p => p.group !== 'DER' && p.issuer);
    const g = {};
    L.forEach(p => (g[p.issuer] = g[p.issuer] || []).push(p));
    ISS = Object.entries(g).map(([id, list]) => {
      const i = M.issuer[id];
      const o = { id, name: i.short, full: i.name, sector: i.sector, rating: i.rating, list, n: list.length,
        mv: sumBy(list, p => p.mv), cs01: sumBy(list, p => p.cs01), dv01: sumBy(list, p => p.dv01), basis01: sumBy(list, p => p.basis01),
        pnl: sumBy(list, p => p.pnl.total), carry: sumBy(list, p => p.carryDay), mtd: sumBy(list, p => p.pnlMtd), ytd: sumBy(list, p => p.pnlYtd),
        ccys: [...new Set(list.map(p => p.ccy))].sort((a, b) => M.ccyOrder[a] - M.ccyOrder[b]) };
      o.searchText = (o.name + ' ' + o.full + ' ' + o.sector + ' ' + o.rating + ' ' + o.ccys.join(' ')).toLowerCase();
      return o;
    }).sort((a, b) => b.mv - a.mv);
    if (!ISS.find(x => x.id === st.sel)) st.sel = (ISS.find(x => x.id !== 'MINFIN') || ISS[0] || {}).id || null;
  }

  // ---------- KPI ----------
  function renderKpis() {
    const L = ISS.flatMap(x => x.list), totMv = sumBy(ISS, x => x.mv), totCs = sumBy(ISS, x => x.cs01);
    const corp = ISS.filter(x => x.id !== 'MINFIN'), corpMv = sumBy(corp, x => x.mv);
    const t10 = corp.slice().sort((a, b) => b.mv - a.mv).slice(0, 10), t10cs = corp.slice().sort((a, b) => Math.abs(b.cs01) - Math.abs(a.cs01)).slice(0, 10);
    const top = corp[0];
    const hhi = Math.round(sumBy(corp, x => Math.pow(x.mv / corpMv * 100, 2)));
    const mf = ISS.find(x => x.id === 'MINFIN');
    const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
    document.getElementById('kpis').innerHTML = '<div class="k-kpis">' +
      K.kpi('Эмитентов', String(ISS.length), corp.length + ' без Минфина · ' + L.length + ' бумаг') +
      K.kpi('Топ-10 корп. в MV', K.d({ title: 'Топ-10 эмитентов по MV', unit: 'mm ₽', fmt: v => f.mn(v, 0), list: t10.flatMap(x => x.list), val: 'mv', dim: 'issuer', color: false }, pct(sumBy(t10, x => x.mv), corpMv)), 'от корпоративной MV ' + f.bn(corpMv, 1) + ' bn') +
      K.kpi('Топ-10 в CS01', K.d({ title: 'Топ-10 эмитентов по CS01', unit: 'тыс ₽/бп', list: t10cs.flatMap(x => x.list), val: 'cs01', dim: 'issuer', color: false }, pct(sumBy(t10cs, x => x.cs01), totCs)), 'CS01 всего ' + f.dv(totCs) + ' тыс/бп') +
      K.kpi('Крупнейший корп.', top ? '<span class="dr" data-iss="' + top.id + '" style="color:' + K.issuerColor(top.id) + '">' + esc(top.name) + '</span>' : '—', top ? pct(top.mv, corpMv) + ' корп. MV · ' + f.mn(top.mv, 0) + ' mm' : '') +
      K.kpi('Индекс Херфиндаля', String(hhi), hhi < 1000 ? 'низкая концентрация' : hhi < 1800 ? 'умеренная концентрация' : 'высокая концентрация') +
      K.kpi('Минфин', mf ? K.d({ title: 'Минфин: MV', unit: 'mm ₽', fmt: v => f.mn(v, 0), list: mf.list, val: 'mv', color: false }, pct(mf.mv, totMv)) : '—', mf ? 'доля MV · DV01 ' + f.dv(mf.dv01) + ' тыс/бп' : '') +
      '</div>';
    document.querySelectorAll('[data-iss]').forEach(e => e.onclick = () => select(e.dataset.iss, true));
  }

  // ---------- полоса концентрации ----------
  let stripCharts = [];
  function renderStrip() {
    stripCharts.forEach(c => c.dispose()); stripCharts = [];
    const m = MEAS[st.meas];
    const SRC = st.exMf ? ISS.filter(x => x.id !== 'MINFIN') : ISS;
    const ex = document.getElementById('exmf');
    ex.innerHTML = '<span class="k-chip' + (st.exMf ? ' on' : '') + '">' + (st.exMf ? '☑' : '☐') + ' без Минфина</span>';
    ex.firstChild.onclick = () => { st.exMf = !st.exMf; save(); renderStrip(); };
    // Парето
    const corp = SRC.slice().sort((a, b) => Math.abs(b[st.meas]) - Math.abs(a[st.meas]));
    const top = corp.slice(0, 15), tot = sumBy(corp, x => Math.abs(x[st.meas])) || 1;
    let c = 0; const cum = top.map(x => (c += Math.abs(x[st.meas])) / tot * 100);
    const pc = K.chart(document.getElementById('pareto'), () => ({
      grid: { left: 6, right: 6, top: 12, bottom: 4, containLabel: true },
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: ps => { const x = top[ps[0].dataIndex]; return '<b>' + esc(x.full) + '</b><br>' + m.t + ': <b>' + m.fmt(x[st.meas]) + '</b> ' + m.unit + '<br>доля ' + Math.round(Math.abs(x[st.meas]) / tot * 100) + '% · накопленно ' + Math.round(cum[ps[0].dataIndex]) + '%'; } },
      xAxis: { type: 'category', data: top.map(x => x.name), axisLabel: { rotate: 35, fontSize: 10, interval: 0 } },
      yAxis: [{ type: 'value', axisLabel: { formatter: x => m.fmt(x) } }, { type: 'value', max: 100, min: 0, splitLine: { show: false }, axisLabel: { formatter: '{value}%', color: K.css('--warn') } }],
      series: [{ type: 'bar', barMaxWidth: 28, data: top.map(x => ({ value: m.abs ? Math.abs(x[st.meas]) : x[st.meas], itemStyle: { color: K.issuerColor(x.id), opacity: x.id === st.sel ? 1 : .75, borderColor: x.id === st.sel ? K.css('--fg') : 'transparent', borderWidth: 1.5 } })) },
        { type: 'line', yAxisIndex: 1, data: cum, symbolSize: 4, lineStyle: { type: 'dashed', width: 2, color: K.css('--warn') }, itemStyle: { color: K.css('--warn') } }],
    }));
    pc.on('click', pp => select(top[pp.dataIndex].id, true));
    stripCharts.push(pc);
    // сектора и рейтинги
    const L = SRC.flatMap(x => x.list);
    const agg = keyFn => { const g = {}; L.forEach(p => { const k = keyFn(p); (g[k] = g[k] || []).push(p); }); return g; };
    const sec = agg(p => p.sector), secK = Object.keys(sec).sort((a, b) => Math.abs(sumBy(sec[a], m.val)) - Math.abs(sumBy(sec[b], m.val)));
    const sc = K.chart(document.getElementById('sector'), () => ({
      grid: { left: 6, right: 40, top: 6, bottom: 4, containLabel: true }, tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, valueFormatter: x => m.fmt(x) + ' ' + m.unit },
      xAxis: { type: 'value', axisLabel: { formatter: x => m.fmt(x) } }, yAxis: { type: 'category', data: secK, axisLabel: { fontSize: 10.5 } },
      series: [{ type: 'bar', barMaxWidth: 16, data: secK.map(k => sumBy(sec[k], m.val)), itemStyle: { color: K.css('--accent') }, label: { show: true, position: 'right', fontSize: 10, color: K.css('--fg-2'), formatter: p => m.fmt(p.value) } }],
    }));
    sc.on('click', pp => K.drill({ title: 'Сектор «' + secK[pp.dataIndex] + '» · ' + m.t, unit: m.unit, fmt: m.fmt, list: sec[secK[pp.dataIndex]], val: m.val, dim: 'issuer' }));
    stripCharts.push(sc);
    const rat = agg(p => p.rating), ratK = RATING.filter(r => rat[r]);
    const rc = K.chart(document.getElementById('rating'), () => ({
      grid: { left: 6, right: 6, top: 18, bottom: 4, containLabel: true }, tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, valueFormatter: x => m.fmt(x) + ' ' + m.unit },
      xAxis: { type: 'category', data: ratK }, yAxis: { type: 'value', axisLabel: { formatter: x => m.fmt(x) } },
      series: [{ type: 'bar', barMaxWidth: 30, data: ratK.map((r, i) => ({ value: sumBy(rat[r], m.val), itemStyle: { color: ['#4c9dff', '#22c3d6', '#22c3d6', '#22c3d6', '#3fb67a', '#3fb67a', '#3fb67a', '#e3b341', '#e3b341', '#e3b341', '#f0645a', '#f0645a', '#f0645a'][RATING.indexOf(r)] } })), label: { show: true, position: 'top', fontSize: 10, color: K.css('--fg-2'), formatter: p => m.fmt(p.value) } }],
    }));
    rc.on('click', pp => K.drill({ title: 'Рейтинг ' + ratK[pp.dataIndex] + ' · ' + m.t, unit: m.unit, fmt: m.fmt, list: rat[ratK[pp.dataIndex]], val: m.val, dim: 'issuer' }));
    stripCharts.push(rc);
  }

  // ---------- список эмитентов ----------
  let listApi = null;
  function renderList() {
    const max = Math.max(1, ...ISS.map(x => Math.abs(x.mv)));
    const drillCell = (key, fmt, unit, title) => (v, r) => K.d({ title: r.name + ' · ' + title, unit, fmt, list: r.list, val: key }, fmt(v), key === 'mv' ? '' : null);
    listApi = K.table(document.getElementById('list'), {
      rows: ISS, maxHeight: 'calc(100vh - 140px)', sort: [['mv', -1]], onRow: r => select(r.id, false),
      rowCls: r => r.id === st.sel ? 'sel' : '',
      stripe: r => K.issuerColor(r.id),
      columns: [
        { key: 'name', label: 'Эмитент', fmt: (v, r) => '<b>' + esc(v) + '</b> <span class="mtag">' + r.ccys.join(' ') + '</span>' },
        { key: 'rating', label: 'Рейт.', val: r => RATING.indexOf(r.rating), fmt: (v, r) => '<span class="mut">' + esc(r.rating) + '</span>' },
        { key: 'n', label: 'Бум.', num: true, fmt: v => '<span class="mut">' + v + '</span>' },
        { key: 'mv', label: 'MV, mm', num: true, fmt: drillCell('mv', v => f.mn(v, 0), 'mm ₽', 'MV'), sum: true, drill: false, sumFmt: v => f.mn(v, 0) },
        { key: 'share', label: '', val: r => r.mv, fmt: (v) => K.bar(v, max, true), w: '70px' },
        { key: 'cs01', label: 'CS01', num: true, fmt: drillCell('cs01', f.dv, 'тыс ₽/бп', 'CS01'), sum: true, drill: false, sumFmt: f.dv },
        { key: 'dv01', label: 'DV01', num: true, fmt: drillCell('dv01', f.dv, 'тыс ₽/бп', 'DV01'), sum: true, drill: false, sumFmt: f.dv },
        { key: 'pnl', label: 'PnL', num: true, fmt: (v, r) => K.d({ title: r.name + ' · PnL дня', unit: 'тыс ₽', fmt: f.k, list: r.list, val: p => p.pnl.total }), sum: true, drill: false, sumFmt: f.k },
      ],
    });
  }

  // ---------- дашборд эмитента ----------
  let dashCharts = [], curRs = null;
  // в узкой панели легенда K.riskStack наезжает на подпись правой оси: прячем подпись и опускаем сетку (и после смены темы)
  const fixRs = () => curRs && curRs.setOption({ grid: { top: 52 }, yAxis: [{}, { name: '' }] });
  K.on('theme', fixRs);
  function panel(title, extra) { const p = K.h('div', 'k-panel'); p.innerHTML = '<div class="hd"><h3>' + title + '</h3><span class="sp"></span>' + (extra || '') + '</div><div class="bd"></div>'; return p; }
  function renderDash() {
    dashCharts.forEach(c => c.dispose()); dashCharts = [];
    const dash = document.getElementById('dash'); dash.innerHTML = '';
    const x = ISS.find(i => i.id === st.sel);
    if (!x) { dash.innerHTML = '<div class="k-panel"><div class="k-empty">нет эмитентов под фильтром</div></div>'; return; }
    const L = x.list, col = K.issuerColor(x.id), totMv = sumBy(ISS, i => i.mv);
    const wavg = (fn) => { const a = L.filter(p => fn(p) != null); const w = sumBy(a, p => Math.abs(p.mv)); return w ? sumBy(a, p => fn(p) * Math.abs(p.mv)) / w : null; };
    const D = (title, val, fmt, unit, cls) => K.d({ title: x.name + ' · ' + title, unit, fmt, list: L, val }, null, cls);
    const nFlt = L.filter(p => p.cpn && p.cpn.type === 'float').length;
    // шапка
    const hp = K.h('div', 'k-panel'); dash.appendChild(hp);
    hp.innerHTML = '<div class="bd"><div class="ihd"><span class="sw" style="background:' + col + '"></span><div style="flex:1;min-width:220px"><div class="nm">' + esc(x.full) + '</div><div class="full">' + esc(x.sector) + ' · рейтинг ' + esc(x.rating) + ' · ' + x.n + ' бумаг (' + (x.n - nFlt) + ' фикс, ' + nFlt + ' флоатеры) · ' + x.ccys.map(K.ccyTag).join(' ') + '</div></div>' +
      '<div class="k-tags">' + [...new Set(L.map(p => p.book))].map(b => '<span class="k-tag">' + esc(b) + '</span>').join('') + '</div></div>' +
      '<div class="k-fields" style="margin-top:10px">' + [
        ['MV', D('MV', 'mv', v => f.mn(v, 0), 'mm ₽', '') + ' <small>mm ₽ · ' + Math.round(x.mv / totMv * 100) + '% книги</small>'],
        ['CS01', D('CS01', 'cs01', f.dv, 'тыс ₽/бп') + ' <small>тыс ₽/бп</small>'],
        ['DV01 ставки', D('DV01', 'dv01', f.dv, 'тыс ₽/бп') + ' <small>тыс ₽/бп</small>'],
        ['Базис ОФЗ01', x.basis01 ? D('Базис ОФЗ01', 'basis01', f.dv, 'тыс ₽/бп') : '—'],
        ['PnL дня', D('PnL дня', p => p.pnl.total, f.k, 'тыс ₽') + ' <small>тыс ₽</small>'],
        ['Кэрри / день', D('Кэрри', 'carryDay', f.k, 'тыс ₽') + ' <small>тыс ₽</small>'],
        ['PnL MTD', D('PnL MTD', 'pnlMtd', v => f.mn(v, 1), 'mm ₽') + ' <small>mm ₽</small>'],
        ['PnL YTD', D('PnL YTD', 'pnlYtd', v => f.mn(v, 1), 'mm ₽') + ' <small>mm ₽</small>'],
        ['Ср. спред (по MV)', f.bp(wavg(p => p.zspread)) + ' <small>б.п.</small>'],
        ['Ср. дюрация', f.n(wavg(p => p.mdur), 2)],
        ['Ср. срок до события', f.yrs(wavg(p => p.tenor))],
        ['Ближайшее событие', (() => { const p = L.slice().sort((a, b) => a.event.date.localeCompare(b.event.date))[0]; return '<span data-card="' + p.id + '" class="dr">' + f.date(p.event.date) + '</span> <small>' + ({ put: 'пут', call: 'колл', mat: 'погаш.' }[p.event.kind]) + '</small>'; })()],
      ].map(([l, v]) => '<div><div class="l">' + l + '</div><div class="v">' + v + '</div></div>').join('') + '</div></div>';
    // кривая + риск
    const two = K.h('div', 'c13-two'); dash.appendChild(two);
    const cp = panel('Кривая эмитента', '<span class="cm"></span>'); two.appendChild(cp);
    const cel = K.h('div', 'ch'); cp.querySelector('.bd').appendChild(cel);
    const uni = M.universeFx.filter(b => b.issuer === x.id && !b.held);
    let curveChart = null;
    const drawCurve = () => {
      if (curveChart) { curveChart.dispose(); dashCharts = dashCharts.filter(c => c !== curveChart); }
      const isY = st.curve === 'ytm';
      const ours = L.filter(p => (isY ? p.ytm != null && p.kind !== 'IN' : p.zspread != null));
      const ccys = [...new Set(ours.map(p => p.ccy))];
      const mx = Math.max(1, ...ours.map(p => Math.abs(p.mv)));
      const series = ccys.map(c => ({
        name: c + ' наши', type: 'scatter', data: ours.filter(p => p.ccy === c).map(p => ({ value: [p.tenor, isY ? p.ytm : p.zspread], id: p.id, name: p.name, p })),
        symbolSize: (val, prm) => 8 + 18 * Math.sqrt(Math.abs(prm && prm.data && prm.data.p ? prm.data.p.mv : 0) / mx), symbol: 'circle', itemStyle: { color: K.ccyColor(c), opacity: .85 },
        label: { show: ours.length <= 10, position: 'right', fontSize: 10, color: K.css('--fg-2'), formatter: d => d.data.name.replace(x.full, '').replace(x.name, '').trim().slice(0, 18) },
      }));
      if (isY && uni.length) ['USD', 'EUR', 'CNY'].forEach(c => { const a = uni.filter(b => b.ccy === c); if (a.length) series.push({ name: c + ' рынок', type: 'scatter', symbol: 'diamond', symbolSize: 9, data: a.map(b => ({ value: [b.tenor, b.ytm], name: b.name })), itemStyle: { color: 'transparent', borderColor: K.ccyColor(c), borderWidth: 1.5 } }); });
      if (isY && ccys.includes('RUB')) series.push({ name: 'ОФЗ (КБД)', type: 'line', showSymbol: false, data: M.pillars.map((t, i) => [t, M.ofzCurve[i]]), lineStyle: { type: 'dashed', width: 1.2, color: K.css('--fg-3') }, itemStyle: { color: K.css('--fg-3') } });
      if (isY && ccys.includes('RUB')) series.push({ name: 'RUONIA OIS', type: 'line', showSymbol: false, data: M.pillars.map((t, i) => [t, M.curve['RUB RUONIA'].pts[i]]), lineStyle: { type: 'dotted', width: 1.2, color: K.curveColors['RUB RUONIA'] }, itemStyle: { color: K.curveColors['RUB RUONIA'] } });
      const maxT = Math.max(2, ...ours.map(p => p.tenor), ...(isY ? uni.map(b => b.tenor) : [])) * 1.08;
      curveChart = K.chart(cel, () => ({
        grid: { left: 6, right: 16, top: 34, bottom: 18, containLabel: true }, legend: { top: 0, left: 0, type: 'scroll' },
        tooltip: { trigger: 'item', formatter: d => Array.isArray(d.value) ? '<b>' + esc(d.data.name || d.seriesName) + '</b><br>срок ' + f.yrs(d.value[0]) + ' · ' + (isY ? f.pct(d.value[1]) : f.bp(d.value[1]) + ' б.п.') + (d.data.p ? '<br>MV ' + f.mn(d.data.p.mv, 0) + ' mm · щелчок — карточка' : '') : '' },
        xAxis: { type: 'value', name: 'лет до оферты / погашения', nameLocation: 'middle', nameGap: 22, max: Math.ceil(maxT), axisLabel: { formatter: '{value}' } },
        yAxis: { type: 'value', scale: true, axisLabel: { formatter: isY ? '{value}%' : '{value}' } },
        series,
      }));
      curveChart.on('click', d => { if (d.data && d.data.id) K.card(d.data.id); });
      dashCharts.push(curveChart);
    };
    K.seg(cp.querySelector('.cm'), [['ytm', 'доходность'], ['spr', 'спред']], st.curve, v => { st.curve = v; save(); drawCurve(); });
    drawCurve();
    const rp = panel('Риск по бакетам', '<span class="k-note">тыс ₽/бп</span>'); two.appendChild(rp);
    const rel = K.h('div', 'ch'); rp.querySelector('.bd').appendChild(rel);
    const cids = M.curves.filter(c => L.some(p => p.risk[c.id].some(v => Math.abs(v) > 1))).map(c => c.id);
    const sel = x.id;
    const rs = K.riskStack(rel, { curves: cids.concat(L.some(p => p.cs01) ? ['CS01'] : []), list: () => K.list().filter(p => p.issuer === sel && p.group !== 'DER'), labels: false });
    curRs = rs; fixRs();
    dashCharts.push(rs);
    // наши бумаги
    const bp = panel('Наши бумаги эмитента', '<span class="k-note">валюта → фикс / флоатеры · по сроку до оферты</span>'); dash.appendChild(bp);
    bp.querySelector('.bd').classList.add('flush');
    K.table(bp.querySelector('.bd'), {
      rows: L, search: L.length > 8, sort: [['tenor', 1]], stripe: p => K.kindColor[p.kind],
      groupBy: [{ key: p => p.ccy + ' · ' + (p.cpn.type === 'float' ? 'флоатеры' : p.cpn.type === 'linker' ? 'линкеры' : 'фикс'), order: (a, b) => (M.ccyOrder[a.slice(0, 3)] - M.ccyOrder[b.slice(0, 3)]) || a.localeCompare(b, 'ru'), label: k => K.ccyTag(k.slice(0, 3)) + ' ' + esc(k.slice(6)), span: 2 }],
      columns: K.cols(['name', 'book', 'coupon', 'event', 'tenor', 'notional', 'price', 'ytm', 'spread', 'dur', 'cs01', 'dv01', 'pnl', 'mv']),
    });
    // события + PnL
    const two2 = K.h('div', 'c13-two'); dash.appendChild(two2);
    const ep = panel('Ближайшие события, 12 мес.'); two2.appendChild(ep);
    ep.querySelector('.bd').classList.add('flush', 'scroll'); ep.querySelector('.bd').style.maxHeight = '300px';
    const ids = new Set(L.map(p => p.id)), endD = U.addMonths(M.asOf, 12);
    const ev = M.cashflows.filter(c => ids.has(c.pos) && c.date > M.asOf && c.date <= endD);
    ep.querySelector('.bd').innerHTML = ev.length ? '<table class="mini"><thead><tr><th>Дата</th><th>Событие</th><th>Бумага</th><th class="n">Сумма</th><th class="n">≈ mm ₽</th></tr></thead><tbody>' +
      ev.map(c => '<tr data-card="' + c.pos + '" class="' + (c.kind === 'put' ? 'put' : '') + '"><td>' + f.date(c.date) + '</td><td><span class="kb" style="--c:' + KC[c.kind] + '">' + KN[c.kind] + '</span>' + (c.est ? ' <span class="mut3">прогноз</span>' : '') + '</td><td>' + esc(M.pos[c.pos].name) + '</td><td class="n">' + f.mn(c.amount, 1) + ' <span class="mut3">' + c.ccy + '</span></td><td class="n">' + f.mn(c.amountRub, 1) + '</td></tr>').join('') + '</tbody></table>' : '<div class="k-empty">нет событий</div>';
    const hp2 = panel('PnL эмитента за год', '<span class="k-note">оценка по ценам + кэрри, mm ₽</span>'); two2.appendChild(hp2);
    const hel = K.h('div', 'ch'); hp2.querySelector('.bd').appendChild(hel);
    const Hs = L.map(p => ({ p, h: M.posHistory(p.id) })), dates = Hs[0].h.dates;
    const daily = dates.map((_, i) => i === 0 ? 0 : sumBy(Hs, ({ p, h }) => { const n = h.notional[i - 1], fx = M.toRepr[p.ccy]; const dp = h.price[i] != null && h.price[i - 1] != null ? h.price[i] - h.price[i - 1] : 0; return n * dp / 100 * fx * (p.indexation || 1) + (p.notional ? p.carryDay * n / p.notional : 0); }));
    let cs = 0; const cum = daily.map(v => (cs += v));
    dashCharts.push(K.chart(hel, () => ({
      grid: { left: 6, right: 10, top: 28, bottom: 4, containLabel: true }, legend: { top: 0, left: 0 },
      tooltip: { trigger: 'axis', valueFormatter: v => f.mns(v, 2) + ' mm' },
      xAxis: { type: 'category', data: dates, axisLabel: { formatter: f.dshort } },
      yAxis: [{ type: 'value', axisLabel: { formatter: v => f.mn(v, 0) } }, { type: 'value', splitLine: { show: false }, axisLabel: { formatter: v => f.mn(v, 0), color: col } }],
      dataZoom: [{ type: 'inside' }],
      series: [{ name: 'за день', type: 'bar', data: daily.map(v => ({ value: v, itemStyle: { color: v >= 0 ? K.css('--pos') : K.css('--neg'), opacity: .55 } })) },
        { name: 'накопленный', type: 'line', yAxisIndex: 1, showSymbol: false, data: cum, lineStyle: { width: 2, color: col }, itemStyle: { color: col } }],
    })));
  }

  // ---------- выбор и перерисовка ----------
  function select(id, scroll) {
    if (!id) return;
    st.sel = id; save();
    listApi && listApi.redraw();
    renderStrip(); renderDash();
    if (scroll) document.getElementById('dash').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function renderAll() { build(); renderKpis(); K.seg(document.getElementById('meas'), Object.keys(MEAS).map(k => [k, MEAS[k].t]), st.meas, v => { st.meas = v; save(); renderStrip(); }); renderStrip(); renderList(); renderDash(); }
  K.onFilter(renderAll);
  K.commands(M.issuers.map(i => ({ label: 'Эмитент: ' + i.name, hint: i.sector, run: () => { if (ISS.find(x => x.id === i.id)) select(i.id, true); } })));
  renderAll();
})();
</script>
</body>
