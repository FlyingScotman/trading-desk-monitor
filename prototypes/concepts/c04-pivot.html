<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>C04 · Агрегатор в один клик</title>
<link rel="stylesheet" href="lib/kit.css">
<style>
.c4-presets { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 14px 8px; border-bottom: 1px solid var(--line); background: var(--bg); }
.c4-presets .lb, .c4-ctrl .lb { color: var(--fg-3); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; align-self: center; margin-right: 2px; }
.c4-presets .k-chip { border-radius: 6px; padding: 4px 10px; }
.c4-presets .k-chip b { font-weight: 600; }
.c4-presets .k-chip.on b { color: var(--accent); }
.c4-ctrl { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--bg-2); }
.c4-ctrl .grp { display: inline-flex; gap: 5px; align-items: center; flex-wrap: wrap; max-width: 100%; }  /* узкий экран (#263): группа переносится */
.c4-ctrl .pick { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--panel); cursor: pointer; font-size: 12px; white-space: nowrap; }
.c4-ctrl .pick:hover { border-color: var(--accent); }
.c4-ctrl .pick.m { border-color: var(--accent); background: var(--accent-bg); font-weight: 600; }
.c4-ctrl .pick .x { color: var(--fg-3); margin-left: 2px; }
.c4-ctrl .arrow { color: var(--fg-3); }
.c4-ctrl .sp { flex: 1; }
.c4-sum { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c4-sum .mut { font-weight: 400; }
.c4-warn { color: var(--warn); font-size: 11.5px; }
.c4-view { overflow: auto; max-height: calc(100vh - 250px); }
.c4-view .k-tbl td, .c4-view .k-tbl th { padding: 4px 9px; }
.c4-view .k-tbl tr.r1 td { font-weight: 600; background: var(--bg-2); cursor: pointer; }
.c4-view .k-tbl tr.r1 td.lbl .tw { display: inline-block; width: 12px; color: var(--fg-3); }
.c4-view .k-tbl tr.r2 td.lbl { padding-left: 26px; }
.c4-view .k-tbl td.tot { font-weight: 600; border-left: 1px solid var(--line-2); }
.c4-view .k-tbl th.tot { border-left: 1px solid var(--line-2); }
.c4-view .k-tbl tfoot td { font-weight: 650; }
.c4-view .k-tbl td.zero { color: var(--fg-3); }
.c4-chart { height: calc(100vh - 270px); min-height: 380px; }
@media (max-width: 720px) { .c4-view { max-height: none; } .c4-chart { height: 480px; } }
</style>
</head>
<body>
<div class="c4-presets" id="presets"></div>
<div class="c4-ctrl" id="ctrl"></div>
<div class="k-page">
  <div class="k-panel">
    <div class="hd"><div class="c4-sum" id="sum"></div><span class="sp"></span><span id="warn" class="c4-warn"></span><span class="k-note">щелчок по любой цифре — из каких позиций</span></div>
    <div class="bd flush" id="out"></div>
  </div>
</div>
<script src="../echarts.min.js"></script>
<script src="lib/boot.js"></script>
<script src="lib/kit.js"></script>
<script src="lib/instr.js"></script>
<script>
(function () {
  const M = MOCK, K = KIT, f = K.f, esc = K.esc;
  K.top({ title: 'C04 · Агрегатор в один клик', tag: 'пресеты + строки × колонки × мера' });

  // ---------- измерения ----------
  const TBO = ['< 6м', '6м–1г', '1–2г', '2–3г', '3–5г', '5–7г', '7–10г', '10г+'];
  const RAT = ['AAA', 'AA+', 'AA', 'AA-', 'A+', 'A', 'A-', 'BBB+', 'BBB', 'BBB-', 'BB+', 'BB', 'B', '—'];
  const MON = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  const horizon = M.util.addMonths(M.asOf, 24).slice(0, 7);
  const idxOrder = arr => (a, b) => { const i = x => { const j = arr.indexOf(x); return j < 0 ? 999 : j; }; return i(a) - i(b) || String(a).localeCompare(String(b), 'ru'); };
  const FACT = K.PNL_FACTORS;  // кэрри (без фондирования), фондирование (#168), ставки, спред, FX, сделки, прочее
  const FCOL = K.PNL_COLORS;
  const nearestBucket = t => { let b = 0, d = 1e9; M.pillars.forEach((x, i) => { const e = Math.abs(Math.log((t || 0.01) / x)); if (e < d) { d = e; b = i; } }); return M.buckets[b]; };
  const DIMS = {
    none: { label: '—' },
    ccy: { label: 'Валюта', key: p => p.ccy, lbl: k => K.ccyTag(k), order: idxOrder(M.ccys), color: k => K.ccyColor(k) },
    group: { label: 'Класс', key: p => p.groupLabel, order: idxOrder(['Гос', 'Корп', 'Деривативы']) },
    type: { label: 'Тип инструмента', key: p => p.group + '.' + p.kind, lbl: k => { const t = M.typeRows.find(x => x.id === k); return '<b style="color:' + K.kindColor[t.kind] + '">●</b> ' + esc(M.groupLabel[t.group] + ' · ' + t.label); }, txt: k => { const t = M.typeRows.find(x => x.id === k); return M.groupLabel[t.group] + ' · ' + t.label; }, order: idxOrder(M.typeRows.map(t => t.id)), color: k => K.kindColor[k.split('.')[1]] },
    issuer: { label: 'Эмитент', key: p => p.group === 'DER' ? 'Деривативы' : p.issuerName, lbl: (k, p) => '<b style="color:' + K.issuerColor(p && p.issuer) + '">●</b> ' + esc(k), order: K.issuerOrder, color: (k, p) => K.issuerColor(p && p.issuer) },
    book: { label: 'Книга', key: p => p.book, lbl: k => esc(k) + ' <span class="mut3" style="font-weight:400">' + esc(M.book[k].name) + '</span>', txt: k => k + ' · ' + M.book[k].name, order: idxOrder(M.books.map(b => b.id)) },
    desk: { label: 'Деск', key: p => p.desk, order: idxOrder(['Rates', 'Credit', 'FX', 'ALM']) },
    entity: { label: 'Юрлицо', key: p => p.entity, lbl: k => esc(M.entities.find(e => e.id === k).name), txt: k => M.entities.find(e => e.id === k).name },
    rating: { label: 'Рейтинг', key: p => p.rating, order: idxOrder(RAT) },
    sector: { label: 'Сектор', key: p => p.sector },
    cpn: { label: 'Тип купона', key: p => p.group === 'DER' ? 'дериватив' : ({ fix: 'фикс', float: 'флоатер', linker: 'линкер' })[K.cpnType(p)] || 'без купона', order: idxOrder(['фикс', 'флоатер', 'линкер', 'дериватив', 'без купона']) },
    tenor: { label: 'Срок до события', key: p => K.tenorBucket(p.tenor), order: idxOrder(TBO) },
    evmonth: { label: 'Месяц события', key: p => { const m = p.event.date.slice(0, 7); return m <= horizon ? m : 'позже'; }, txt: k => k === 'позже' ? 'позже 24 мес.' : MON[+k.slice(5) - 1] + ' ' + k.slice(2, 4), order: (a, b) => a === 'позже' ? 1 : b === 'позже' ? -1 : a.localeCompare(b) },
    evkind: { label: 'Вид события', key: p => ({ put: 'пут-оферта', call: 'колл', mat: 'погашение' })[p.event.kind], order: idxOrder(['пут-оферта', 'колл', 'погашение']), color: k => ({ 'пут-оферта': '#e3b341', 'колл': '#b48cff', 'погашение': '#4c9dff' })[k] },
    curve: { label: 'Кривая', part: 'curve', key: (p, x) => x.curve || '—', txt: k => k === 'CS01' ? 'CS01 (спред)' : k === '—' ? '—' : M.curve[k].short, lbl: k => k === '—' ? '—' : '<b style="color:' + K.curveColors[k] + '">■</b> ' + esc(k === 'CS01' ? 'CS01 (спред)' : M.curve[k].short) + (k !== 'CS01' && M.curve[k].kind === 'basis' ? ' <span class="mut3" style="font-weight:400">базис</span>' : ''), order: idxOrder(M.curves.map(c => c.id).concat(['CS01', '—'])), color: k => K.curveColors[k] },
    bucket: { label: 'Бакет кривой', part: 'bucket', key: (p, x) => x.bucket != null ? M.buckets[x.bucket] : nearestBucket(p.tenor), order: idxOrder(M.buckets) },
    factor: { label: 'Фактор PnL', part: 'factor', key: (p, x) => x.factor || '—', txt: k => (FACT.find(x => x[0] === k) || [k, '—'])[1], order: idxOrder(FACT.map(x => x[0]).concat(['—'])), color: k => FCOL[k] },
  };
  const dimTxt = (d, k) => DIMS[d].txt ? DIMS[d].txt(k) : String(k);
  const dimLbl = (d, k, p) => DIMS[d].lbl ? DIMS[d].lbl(k, p) : esc(dimTxt(d, k));

  // ---------- меры: каждая позиция даёт «части» (кривая × бакет, фактор …) ----------
  const rateIds = M.curves.filter(c => c.kind === 'rate').map(c => c.id);
  const curveParts = ids => p => { const out = []; ids.forEach(id => p.risk[id].forEach((v, k) => { if (v) out.push({ curve: id, bucket: k, v }); })); return out; };
  const one = fn => p => [{ v: fn(p) }];
  // фондирование (#168): настоящий 0 — «·», не посчитано ни у одной позиции ячейки — «—» (keep: ноль не отбрасывается)
  const nulPart = (v, x) => [Object.assign(v == null ? { v: 0, keep: true, nul: true } : { v, keep: true }, x || {})];
  // sc — масштаб fmt для делений оси (K.tick, #321), int — счётная мера: деления только целые
  const MEAS = {
    dv01: { label: 'DV01 ставки', unit: 'тыс ₽/бп', fmt: f.dv, sc: 1e3, kind: 'risk', parts: curveParts(rateIds) },
    dvall: { label: M.ofzView === 'kbd' ? 'DV01 все кривые' : 'DV01 + базис ОФЗ', unit: 'тыс ₽/бп', fmt: f.dv, sc: 1e3, kind: 'risk', parts: curveParts(M.curves.map(c => c.id)) },
    ruonia: { label: 'DV01 RUONIA', unit: 'тыс ₽/бп', fmt: f.dv, sc: 1e3, kind: 'risk', parts: curveParts(['RUB RUONIA']) },
    key: { label: 'DV01 КС', unit: 'тыс ₽/бп', fmt: f.dv, sc: 1e3, kind: 'risk', parts: curveParts(['RUB KEY']) },
    // в виде «КБД» (#32) риск кривой «RUB OFZ» — DV01 КБД, а не базис
    basis01: { label: M.ofzView === 'kbd' ? 'DV01 КБД (ОФЗ)' : 'Базис ОФЗ01', unit: 'тыс ₽/бп', fmt: f.dv, sc: 1e3, kind: 'risk', parts: curveParts(['RUB OFZ']) },
    ofzSpr01: { label: 'Спред ОФЗ к КБД01', unit: 'тыс ₽/бп', fmt: f.dv, sc: 1e3, kind: 'risk', parts: p => (p.ofzSprb || []).map((v, k) => ({ curve: 'RUB OFZ', bucket: k, v })).filter(x => x.v) },
    cs01: { label: 'CS01', unit: 'тыс ₽/бп', fmt: f.dv, sc: 1e3, kind: 'risk', parts: p => p.cs01b.map((v, k) => ({ curve: 'CS01', bucket: k, v })).filter(x => x.v) },
    mv: { label: 'MV облигаций', unit: 'mm ₽', fmt: v => f.mn(v, 0), sc: 1e6, kind: 'size', parts: one(p => p.group === 'DER' ? 0 : p.mv) },
    notional: { label: 'Номинал', unit: 'mm ₽', fmt: v => f.mn(v, 0), sc: 1e6, kind: 'size', parts: one(p => p.notionalRub) },
    carry: { label: 'Кэрри / день', unit: 'тыс ₽', fmt: f.k, sc: 1e3, kind: 'pnl', parts: one(p => p.carryDay) },  // без фондирования (#168)
    funding: { label: 'Фондирование / день', unit: 'тыс ₽', fmt: f.k, sc: 1e3, kind: 'pnl', parts: p => nulPart(p.fundingDay) },
    pnl: { label: 'PnL дня', unit: 'тыс ₽', fmt: f.k, sc: 1e3, kind: 'pnl', parts: p => FACT.map(([k]) => k === 'funding' ? nulPart(p.pnl[k], { factor: k })[0] : { factor: k, v: p.pnl[k] }).filter(x => x.keep || x.v) },
    pnlMtd: { label: 'PnL MTD', unit: 'mm ₽', fmt: v => f.mn(v, 1), sc: 1e6, kind: 'pnl', parts: one(p => p.pnlMtd) },
    count: { label: 'Кол-во позиций', unit: 'шт', fmt: v => f.n(v), sc: 1, int: true, kind: 'size', parts: one(() => 1) },
  };
  FACT.forEach(([k, t]) => MEAS['pnl_' + k] = { label: 'PnL: ' + t, unit: 'тыс ₽', fmt: f.k, sc: 1e3, kind: 'pnl', parts: p => k === 'funding' ? nulPart(p.pnl[k], { factor: k }) : [{ factor: k, v: p.pnl[k] }] });

  // ---------- пресеты ----------
  const PRESETS = [
    { id: 'risk-ccy-type', t: 'Риск: валюта × тип', s: 'DV01 по кривым', r: ['ccy', 'type'], c: 'curve', m: 'dvall', v: 'heat' },
    { id: 'curve-bucket', t: 'Риск: кривая × бакет', s: 'лестница', r: ['curve'], c: 'bucket', m: 'dvall', v: 'heat' },
    { id: 'book-curve', t: 'Книги × кривые', s: 'кто держит риск', r: ['desk', 'book'], c: 'curve', m: 'dvall', v: 'heat' },
    { id: 'cs-iss-ten', t: 'CS01: эмитент × срок', s: 'кредитный риск', r: ['issuer'], c: 'tenor', m: 'cs01', v: 'heat', rs: 'abs' },
    { id: 'basis', t: 'Базис ОФЗ: тип × бакет', s: 'ОФЗ − RUONIA', r: ['type'], c: 'bucket', m: 'basis01', v: 'heat' },
    { id: 'mv-rat-ccy', t: 'MV: рейтинг × валюта', s: 'качество', r: ['rating'], c: 'ccy', m: 'mv', v: 'heat' },
    { id: 'mv-sector', t: 'MV: сектор × рейтинг', s: 'карта', r: ['sector', 'rating'], c: 'none', m: 'mv', v: 'treemap' },
    { id: 'iss-map', t: 'Эмитенты: карта MV', s: 'валюта → эмитент', r: ['ccy', 'issuer'], c: 'none', m: 'mv', v: 'treemap' },
    { id: 'pnl-book', t: 'PnL: книга × фактор', s: 'explain', r: ['book'], c: 'factor', m: 'pnl', v: 'heat' },
    { id: 'pnl-type', t: 'PnL: тип × фактор', s: 'explain', r: ['ccy', 'type'], c: 'factor', m: 'pnl', v: 'heat' },
    { id: 'carry-iss', t: 'Кэрри по эмитентам', s: 'тыс ₽ в день', r: ['issuer'], c: 'ccy', m: 'carry', v: 'bar', rs: 'abs' },
    { id: 'events', t: 'Оферты и погашения по месяцам', s: '24 мес.', r: ['evmonth'], c: 'evkind', m: 'notional', v: 'bar', fg: ['GOV', 'SUB', 'CORP'] },
    { id: 'count', t: 'Сколько чего', s: 'тип × валюта', r: ['type'], c: 'ccy', m: 'count', v: 'table' },
  ];

  // ---------- состояние + адрес ----------
  const st = { p: null, r: ['ccy', 'type'], c: 'curve', m: 'dvall', v: 'heat', rs: 'dim', fc: [], fg: [], col: {} };
  function applyPreset(pr) { Object.assign(st, { p: pr.id, r: pr.r.slice(), c: pr.c, m: pr.m, v: pr.v, rs: pr.rs || 'dim', fc: (pr.fc || []).slice(), fg: (pr.fg || []).slice(), col: {} }); }
  function samePreset() { const pr = PRESETS.find(x => x.id === st.p); if (!pr) return false; return pr.r.join() === st.r.join() && pr.c === st.c && pr.m === st.m && pr.v === st.v && (pr.rs || 'dim') === st.rs && (pr.fc || []).join() === st.fc.join() && (pr.fg || []).join() === st.fg.join(); }
  function toHash() {
    const h = samePreset() ? 'p=' + st.p : ['r=' + st.r.join(','), 'c=' + st.c, 'm=' + st.m, 'v=' + st.v, 'rs=' + st.rs, st.fc.length ? 'fc=' + st.fc.join('.') : '', st.fg.length ? 'fg=' + st.fg.join('.') : ''].filter(Boolean).join('&');
    if (location.hash.slice(1) !== h) history.replaceState(null, '', '#' + h);
  }
  function fromHash() {
    const q = {}; location.hash.slice(1).split('&').forEach(x => { const i = x.indexOf('='); if (i > 0) q[x.slice(0, i)] = decodeURIComponent(x.slice(i + 1)); });
    if (q.p && PRESETS.find(x => x.id === q.p)) { applyPreset(PRESETS.find(x => x.id === q.p)); return true; }
    if (q.r) {
      st.p = null; st.r = q.r.split(',').filter(d => DIMS[d] && d !== 'none').slice(0, 2); if (!st.r.length) st.r = ['ccy'];
      st.c = DIMS[q.c] ? q.c : 'none'; st.m = MEAS[q.m] ? q.m : 'dv01'; st.v = ['table', 'heat', 'bar', 'treemap'].includes(q.v) ? q.v : 'heat'; st.rs = q.rs === 'abs' ? 'abs' : 'dim';
      st.fc = q.fc ? q.fc.split('.').filter(c => M.ccys.includes(c)) : []; st.fg = q.fg ? q.fg.split('.').filter(g => M.groupLabel[g]) : []; st.col = {};
      return true;
    }
    return false;
  }
  if (!fromHash()) applyPreset(PRESETS[0]);
  window.addEventListener('hashchange', () => { if (fromHash()) render(); });

  // ---------- агрегация ----------
  const SEP = '\u0001', ALL = '*';
  function aggregate() {
    let L = K.list();
    if (st.fc.length) L = L.filter(p => st.fc.includes(p.ccy));
    if (st.fg.length) L = L.filter(p => st.fg.includes(p.group));
    const meas = MEAS[st.m], [d1, d2] = st.r, dc = st.c;
    const cells = new Map(), rep = new Map(); // rep: ключ измерения → пример позиции (цвет эмитента)
    const add = (k, p, v, nul) => { let a = cells.get(k); if (!a) cells.set(k, a = { v: 0, pos: new Map(), n: 0, nul: 0 }); a.v += v; if (nul) a.nul++; else a.n++; a.pos.set(p.id, (a.pos.get(p.id) || 0) + v); };
    const keys = { r1: new Set(), r2: {}, c: new Set() };
    L.forEach(p => meas.parts(p).forEach(x => {
      if (st.m !== 'count' && !x.keep && Math.abs(x.v) < 1e-9) return;
      const k1 = DIMS[d1].key(p, x), k2 = d2 ? DIMS[d2].key(p, x) : ALL, kc = dc !== 'none' ? DIMS[dc].key(p, x) : ALL;
      keys.r1.add(k1); (keys.r2[k1] = keys.r2[k1] || new Set()).add(k2); keys.c.add(kc);
      if (!rep.has(d1 + k1)) rep.set(d1 + k1, p); if (d2 && !rep.has(d2 + k2)) rep.set(d2 + k2, p); if (dc !== 'none' && !rep.has(dc + kc)) rep.set(dc + kc, p);
      // без 2-го уровня или колонок часть ключей совпадает — каждую ячейку пополняем один раз
      new Set([[k1, k2, kc], [k1, k2, ALL], [k1, ALL, kc], [k1, ALL, ALL], [ALL, ALL, kc], [ALL, ALL, ALL]].map(t => t.join(SEP))).forEach(k => add(k, p, x.v, x.nul));
    }));
    const get = (a, b, c) => cells.get([a, b, c].join(SEP));
    const absOf = (a, b) => { const x = get(a, b, ALL); return x ? Math.abs(x.v) : 0; };
    let r1 = [...keys.r1]; r1.sort(st.rs === 'abs' ? (a, b) => absOf(b, ALL) - absOf(a, ALL) : (DIMS[d1].order || ((a, b) => String(a).localeCompare(String(b), 'ru'))));
    const r2 = {}; r1.forEach(k => { const arr = [...(keys.r2[k] || [])]; arr.sort(st.rs === 'abs' ? (a, b) => absOf(k, b) - absOf(k, a) : (d2 && DIMS[d2].order) || ((a, b) => String(a).localeCompare(String(b), 'ru'))); r2[k] = arr; });
    const cols = [...keys.c]; if (dc !== 'none') cols.sort(DIMS[dc].order || ((a, b) => String(a).localeCompare(String(b), 'ru')));
    return { L, get, r1, r2, cols, rep, meas, d1, d2, dc };
  }
  const drillRows = a => a ? [...a.pos].map(([id, v]) => ({ p: M.pos[id], v })) : [];
  function cellHtml(A, a, title, heat, max, cls) {
    if (a && a.nul && !a.n) return '<td class="n zero ' + (cls || '') + '" title="не посчитано">—</td>';  // фондирование не посчитано (#168)
    if (!a || (Math.abs(a.v) < 1e-9 && st.m !== 'count')) return '<td class="n zero ' + (cls || '') + '">·</td>';
    const meas = A.meas;
    let style = '';
    if (heat === 'tot') style = K.HEAT_PLAIN;  // итог тепловой карты: без фона, красный того же оттенка (#265)
    else if (heat) style = meas.kind === 'risk' ? K.heatRisk(a.v, max) : meas.kind === 'pnl' ? K.heat(a.v, max) : K.heatMono(a.v, max);
    return '<td class="n ' + (cls || '') + '" style="' + style + '">' + K.d({ title, unit: meas.unit, fmt: meas.fmt, sc: meas.sc, int: meas.int, rows: drillRows(a) }, meas.fmt(a.v), meas.kind === 'pnl' ? null : '') + '</td>';
  }

  // ---------- вывод ----------
  const out = document.getElementById('out');
  let charts = [];
  function disposeCharts() { charts.forEach(c => c.dispose()); charts = []; }
  function title(A, k1, k2, kc) {
    const t = [A.meas.label];
    if (k1 !== ALL) t.push(dimTxt(A.d1, k1)); if (A.d2 && k2 !== ALL) t.push(dimTxt(A.d2, k2)); if (A.dc !== 'none' && kc !== ALL) t.push(dimTxt(A.dc, kc));
    return t.join(' · ');
  }
  function renderTable(A, heat) {
    const C = A.dc === 'none' ? [ALL] : A.cols;
    let max = 1; A.r1.forEach(k1 => (A.d2 ? A.r2[k1] : [ALL]).forEach(k2 => C.forEach(c => { const a = A.get(k1, k2, c); if (a) max = Math.max(max, Math.abs(a.v)); })));
    const totMax = Math.max(1, ...A.r1.map(k => { const a = A.get(k, ALL, ALL); return a ? Math.abs(a.v) : 0; }));
    const head = '<thead><tr><th>' + esc(DIMS[A.d1].label) + (A.d2 ? ' → ' + esc(DIMS[A.d2].label) : '') + '</th>' +
      (A.dc === 'none' ? '' : C.map(c => '<th class="n">' + dimLbl(A.dc, c, A.rep.get(A.dc + c)) + '</th>').join('')) +
      '<th class="n tot">' + (A.dc === 'none' ? esc(A.meas.label) : 'Итого') + '</th><th style="width:110px"></th></tr></thead>';
    let body = '';
    A.r1.forEach(k1 => {
      const col = !!st.col[k1], p1 = A.rep.get(A.d1 + k1);
      const rowCells = (k2, cls) => (A.dc === 'none' ? '' : C.map(c => cellHtml(A, A.get(k1, k2, c), title(A, k1, k2, c), heat, max)).join('')) + cellHtml(A, A.get(k1, k2, ALL), title(A, k1, k2, ALL), heat && 'tot', 1, 'tot');
      const tv = (A.get(k1, ALL, ALL) || { v: 0 }).v;
      body += '<tr class="' + (A.d2 ? 'r1' : '') + '" data-k="' + esc(k1) + '"><td class="lbl">' + (A.d2 ? '<span class="tw">' + (col ? '▸' : '▾') + '</span>' : '') + dimLbl(A.d1, k1, p1) + (A.d2 ? ' <span class="mut3" style="font-weight:400">' + A.r2[k1].length + '</span>' : '') + '</td>' + rowCells(ALL) + '<td>' + K.bar(tv, totMax, A.meas.kind === 'size') + '</td></tr>';
      if (A.d2 && !col) A.r2[k1].forEach(k2 => {
        const v2 = (A.get(k1, k2, ALL) || { v: 0 }).v;
        body += '<tr class="r2"><td class="lbl">' + dimLbl(A.d2, k2, A.rep.get(A.d2 + k2)) + '</td>' + rowCells(k2) + '<td>' + K.bar(v2, totMax, A.meas.kind === 'size') + '</td></tr>';
      });
    });
    const foot = '<tfoot><tr><td>Итого</td>' + (A.dc === 'none' ? '' : C.map(c => cellHtml(A, A.get(ALL, ALL, c), title(A, ALL, ALL, c), heat && 'tot', 1)).join('')) + cellHtml(A, A.get(ALL, ALL, ALL), title(A, ALL, ALL, ALL), heat && 'tot', 1, 'tot') + '<td></td></tr></tfoot>';
    out.innerHTML = '<div class="c4-view"><table class="k-tbl" data-vk="c04-pivot" data-title="Сводная таблица">' + head + '<tbody>' + (body || '<tr><td colspan="99" class="k-empty">пусто</td></tr>') + '</tbody>' + foot + '</table></div>';
    K.tableToolsAll(out);
    out.querySelectorAll('tr.r1').forEach(tr => tr.onclick = e => { if (e.target.closest('[data-dr]')) return; st.col[tr.dataset.k] = !st.col[tr.dataset.k]; render(); });
  }
  function seriesColor(A, c, i) {
    const d = DIMS[A.dc]; const col = d && d.color ? d.color(c, A.rep.get(A.dc + c)) : null;
    return col || K.PAL[i % K.PAL.length];
  }
  function renderBar(A) {
    const rowsK = []; A.r1.forEach(k1 => { if (A.d1 === 'evmonth' && k1 === 'позже') return; if (A.d2) A.r2[k1].forEach(k2 => rowsK.push([k1, k2])); else rowsK.push([k1, ALL]); });
    const R = rowsK.slice(0, 60);
    const label = ([k1, k2]) => (dimTxt(A.d1, k1) + (A.d2 ? ' · ' + dimTxt(A.d2, k2) : '')).replace(/<[^>]+>/g, '');
    const C = A.dc === 'none' ? [ALL] : A.cols;
    const el = K.h('div', 'c4-chart'); el.style.height = Math.max(380, R.length * 24 + 80) + 'px'; el.style.minHeight = '0';
    out.innerHTML = ''; const wrap = K.h('div', 'c4-view'); wrap.style.padding = '8px 10px'; wrap.appendChild(el); out.appendChild(wrap);
    const Rr = R.slice().reverse();
    const ch = K.chart(el, () => ({
      grid: { left: 8, right: 30, top: C.length > 1 ? 30 : 10, bottom: 10, containLabel: true },
      legend: C.length > 1 ? { top: 0, left: 0, type: 'scroll' } : undefined,
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, valueFormatter: v => A.meas.fmt(v) + ' ' + A.meas.unit },
      xAxis: { type: 'value', unit: A.meas.unit, minInterval: A.meas.int ? 1 : 0, axisLabel: { formatter: v => K.tick(v, A.meas.sc), hideOverlap: true } },
      yAxis: { type: 'category', data: Rr.map(r => { const s = label(r); return s.length > 38 ? s.slice(0, 37) + '…' : s; }) },
      series: C.map((c, i) => ({
        name: c === ALL ? A.meas.label : dimTxt(A.dc, c), type: 'bar', stack: 's', barMaxWidth: 22,
        data: Rr.map(([k1, k2]) => { const a = A.get(k1, k2, c); const v = a ? a.v : 0; return C.length === 1 && A.meas.kind !== 'size' ? { value: v, itemStyle: { color: A.meas.kind === 'risk' ? (v < 0 ? '#4c9dff' : '#e3a03c') : (v >= 0 ? K.css('--pos') : K.css('--neg')) } } : v; }),
        itemStyle: C.length > 1 ? { color: seriesColor(A, c, i) } : (A.meas.kind === 'size' ? { color: K.css('--accent') } : undefined),
      })),
    }));
    ch.on('click', pp => { const [k1, k2] = Rr[pp.dataIndex]; const c = C[pp.seriesIndex]; K.drill({ title: title(A, k1, k2, c), unit: A.meas.unit, fmt: A.meas.fmt, sc: A.meas.sc, int: A.meas.int, rows: drillRows(A.get(k1, k2, c)) }); });
    charts.push(ch);
  }
  function renderTree(A) {
    const C = A.dc === 'none' ? [ALL] : A.cols;
    const leafMax = []; const reg = [];
    const node = (k1, k2, c) => { const a = A.get(k1, k2, c); if (!a || Math.abs(a.v) < 1e-9) return null; reg.push({ k1, k2, c, a }); leafMax.push(Math.abs(a.v)); return { a, did: reg.length - 1 }; };
    const data = [];
    A.r1.forEach((k1, i) => {
      const kids = [];
      (A.d2 ? A.r2[k1] : [ALL]).forEach(k2 => {
        const leaves = C.map(c => { const n = node(k1, k2, c); return n ? { name: c === ALL ? (k2 === ALL ? dimTxt(A.d1, k1) : dimTxt(A.d2, k2)) : dimTxt(A.dc, c), value: Math.abs(n.a.v), raw: n.a.v, did: n.did } : null; }).filter(Boolean);
        if (!leaves.length) return;
        if (C.length === 1) kids.push(leaves[0]); else kids.push({ name: k2 === ALL ? dimTxt(A.d1, k1) : dimTxt(A.d2, k2), children: leaves });
      });
      if (!kids.length) return;
      const base = DIMS[A.d1].color ? DIMS[A.d1].color(k1, A.rep.get(A.d1 + k1)) : K.PAL[i % K.PAL.length];
      if (!A.d2 && C.length === 1) data.push(Object.assign(kids[0], { name: dimTxt(A.d1, k1), base }));
      else if (!A.d2) data.push({ name: dimTxt(A.d1, k1), children: kids[0].children, base });
      else data.push({ name: dimTxt(A.d1, k1), children: kids, base });
    });
    const max = Math.max(1, ...leafMax);
    const paint = (n, base) => {
      const b = n.base || base;
      if (n.children) { n.children.forEach(x => paint(x, b)); return; }
      const a = Math.min(1, Math.abs(n.raw) / max), al = 0.35 + 0.6 * Math.pow(a, 0.6);
      const col = A.meas.kind === 'risk' ? (n.raw < 0 ? '76,157,255' : '227,160,60') : A.meas.kind === 'pnl' ? (n.raw >= 0 ? '63,182,122' : '240,100,90') : null;
      n.itemStyle = { color: col ? 'rgba(' + col + ',' + al.toFixed(2) + ')' : b };
    };
    data.forEach(n => paint(n, n.base));
    out.innerHTML = ''; const el = K.h('div', 'c4-chart'); el.style.margin = '8px 10px'; out.appendChild(el);
    const ch = K.chart(el, () => ({
      tooltip: { formatter: p => { const d = p.data; return esc(p.treePathInfo.slice(1).map(x => x.name).join(' · ')) + '<br><b>' + A.meas.fmt(d.raw != null ? d.raw : p.value) + '</b> ' + A.meas.unit; } },
      series: [{ type: 'treemap', data, roam: false, nodeClick: false, breadcrumb: { show: false }, width: '100%', height: '100%', top: 0, left: 0,
        label: { show: true, formatter: p => p.name + '\n' + A.meas.fmt(p.data.raw != null ? p.data.raw : p.value), color: '#fff', fontSize: 11, lineHeight: 14, overflow: 'truncate' },
        upperLabel: { show: true, height: 18, color: K.css('--fg'), fontSize: 11, fontWeight: 600 },
        itemStyle: { borderColor: K.css('--panel'), borderWidth: 1, gapWidth: 1 },
        levels: [{ itemStyle: { borderColor: K.css('--line-2'), borderWidth: 3, gapWidth: 3 } }, { itemStyle: { borderColor: K.css('--panel'), borderWidth: 1, gapWidth: 1 } }],
      }],
    }));
    ch.on('click', pp => { const d = pp.data; if (d && d.did != null) { const x = reg[d.did]; K.drill({ title: title(A, x.k1, x.k2, x.c), unit: A.meas.unit, fmt: A.meas.fmt, sc: A.meas.sc, int: A.meas.int, rows: drillRows(x.a) }); } });
    charts.push(ch);
  }

  // ---------- панели управления ----------
  const presetsEl = document.getElementById('presets'), ctrl = document.getElementById('ctrl');
  function renderPresets() {
    presetsEl.innerHTML = '<span class="lb">Пресеты</span>' + PRESETS.map(p => '<span class="k-chip' + (st.p === p.id && samePreset() ? ' on' : '') + '" data-p="' + p.id + '"><b>' + esc(p.t) + '</b><span class="mut3">' + esc(p.s) + '</span></span>').join('');
    presetsEl.querySelectorAll('[data-p]').forEach(ch => ch.onclick = () => { applyPreset(PRESETS.find(x => x.id === ch.dataset.p)); render(); });
  }
  const dimItems = (allowNone) => (allowNone ? [{ v: 'none', t: '— нет' }] : []).concat(Object.keys(DIMS).filter(d => d !== 'none').map(d => ({ v: d, t: DIMS[d].label, sub: DIMS[d].part ? 'раскладывает меру' : '' })));
  function renderCtrl() {
    const pick = (a, label, cls) => '<span class="pick ' + (cls || '') + '" data-a="' + a + '">' + label + ' ▾</span>';
    ctrl.innerHTML =
      '<span class="grp"><span class="lb">Строки</span>' + pick('r0', esc(DIMS[st.r[0]].label)) + '<span class="arrow">→</span>' + (st.r[1] ? pick('r1', esc(DIMS[st.r[1]].label)) + '<span class="pick" data-a="r1x" title="убрать уровень">✕</span>' : '<span class="pick" data-a="r1">+ уровень</span>') + '</span>' +
      '<span class="pick" data-a="swap" title="строки ⇄ колонки">⇄</span>' +
      '<span class="grp"><span class="lb">Колонки</span>' + pick('c', esc(DIMS[st.c].label)) + '</span>' +
      '<span class="grp"><span class="lb">Мера</span>' + pick('m', esc(MEAS[st.m].label), 'm') + '</span>' +
      '<span class="grp"><span class="lb">Фильтр</span>' + M.ccys.map(c => '<span class="k-chip' + (st.fc.includes(c) ? ' on' : '') + '" data-fc="' + c + '">' + c + '</span>').join('') +
      K.GROUPS.filter(g => g === 'GOV' || g === 'CORP' || g === 'DER' || M.positions.some(p => p.group === g)).map(g => '<span class="k-chip' + (st.fg.includes(g) ? ' on' : '') + '" data-fg="' + g + '">' + M.groupLabel[g] + '</span>').join('') + '</span>' +
      '<span class="sp"></span><span class="grp"><span class="lb">Строки по</span><span id="rsSeg"></span></span><span class="grp"><span class="lb">Вид</span><span id="vSeg"></span></span>';
    const on = (a, fn) => { const e = ctrl.querySelector('[data-a=' + a + ']'); if (e) e.onclick = ev => { ev.stopPropagation(); fn(e); }; };
    on('r0', e => K.menu(e, dimItems(false), st.r[0], v => { st.r[0] = v; if (st.r[1] === v) st.r.length = 1; st.col = {}; render(); }));
    on('r1', e => K.menu(e, dimItems(true), st.r[1] || 'none', v => { if (v === 'none' || v === st.r[0]) st.r.length = 1; else st.r[1] = v; st.col = {}; render(); }));
    on('r1x', () => { st.r.length = 1; render(); });
    on('c', e => K.menu(e, dimItems(true), st.c, v => { st.c = v; render(); }));
    on('m', e => K.menu(e, Object.keys(MEAS).map(k => ({ v: k, t: MEAS[k].label, sub: MEAS[k].unit })), st.m, v => { st.m = v; render(); }));
    on('swap', () => { if (st.c === 'none') return; const c = st.c; st.c = st.r[0]; st.r = [c].concat(st.r[1] && st.r[1] !== c ? [st.r[1]] : []); st.col = {}; render(); });
    ctrl.querySelectorAll('[data-fc]').forEach(e => e.onclick = () => { const c = e.dataset.fc; st.fc = st.fc.includes(c) ? st.fc.filter(x => x !== c) : st.fc.concat([c]); render(); });
    ctrl.querySelectorAll('[data-fg]').forEach(e => e.onclick = () => { const g = e.dataset.fg; st.fg = st.fg.includes(g) ? st.fg.filter(x => x !== g) : st.fg.concat([g]); render(); });
    K.seg(ctrl.querySelector('#rsSeg'), [['dim', 'порядку'], ['abs', 'величине']], st.rs, v => { st.rs = v; render(); });
    K.seg(ctrl.querySelector('#vSeg'), [['table', 'таблица'], ['heat', 'тепловая'], ['bar', 'бары'], ['treemap', 'treemap']], st.v, v => { st.v = v; render(); });
  }
  function render() {
    renderPresets(); renderCtrl(); toHash();
    disposeCharts();
    const A = aggregate();
    const meas = A.meas;
    const tot = A.get(ALL, ALL, ALL);
    document.getElementById('sum').innerHTML = esc(meas.label) + ' <span class="mut">по</span> ' + esc(DIMS[A.d1].label) + (A.d2 ? ' → ' + esc(DIMS[A.d2].label) : '') + (A.dc !== 'none' ? ' <span class="mut">×</span> ' + esc(DIMS[A.dc].label) : '') +
      ' <span class="mut">· итого</span> ' + (tot && !(tot.nul && !tot.n) ? K.d({ title: meas.label, unit: meas.unit, fmt: meas.fmt, sc: meas.sc, int: meas.int, rows: drillRows(tot) }, meas.fmt(tot.v), meas.kind === 'pnl' ? null : '') : '—') + ' <span class="mut">' + esc(meas.unit) + ' · ' + A.L.length + ' поз.</span>';
    const used = [A.d1, A.d2, A.dc].filter(Boolean);
    const warn = [];
    if (used.includes('curve') && !['risk'].includes(meas.kind)) warn.push('«Кривая» раскладывает только меры риска — здесь всё в «—»');
    if (used.includes('factor') && !/^pnl$|^pnl_/.test(st.m)) warn.push('«Фактор PnL» раскладывает только PnL дня');
    if (used.includes('bucket') && meas.kind !== 'risk') warn.push('«Бакет» для этой меры — по сроку до события');
    if (A.d1 === 'evmonth' && st.v === 'bar' && A.r1.includes('позже')) warn.push('события позже 24 мес. скрыты на графике — они в таблице');
    document.getElementById('warn').textContent = warn.join(' · ');
    if (!A.r1.length) { out.innerHTML = '<div class="k-empty">нет данных при этом фильтре</div>'; return; }
    if (st.v === 'bar') renderBar(A); else if (st.v === 'treemap') renderTree(A); else renderTable(A, st.v === 'heat');
  }
  K.commands(PRESETS.map(p => ({ label: 'Пресет: ' + p.t, hint: p.s, run: () => { applyPreset(p); render(); } })));
  K.onFilter(render);
  K.on('theme', render);
  render();
})();
</script>
</body>
</html>
