<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>C16 · ОВП</title>
<link rel="stylesheet" href="lib/kit.css">
<style>
.c16-sum { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); gap: 8px; }
.c16-sum .k-kpi.tot { border-color: var(--accent); }
.c16-sum .k-kpi .l .c { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.c16-chart { height: 300px; }
.c16-badge { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--warn); color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); white-space: nowrap; margin-left: 8px; }
.c16-msg { padding: 24px; text-align: center; color: var(--fg-2); }
.c16-scope { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-bottom: 10px; font-size: 12px; }
.c16-scope .lb { color: var(--fg-2); }
.c16-scope .k-note { flex: 1 1 320px; min-width: 0; font-size: 12px; color: var(--fg-2); }
.c16-scope .k-note b { font-weight: 600; color: var(--fg); }
.k-tbl tr.tot td { font-weight: 650; border-top: 1px solid var(--line-2); background: var(--panel-2); }
.k-tbl .c16-src { font-size: 11px; color: var(--fg-3); margin-left: 2px; }
@media (max-width: 720px) { .k-panel > .hd { flex-wrap: wrap; } }
/* разбор строки книги (TDM#603) */
.k-tbl tr[data-ocp-i] { cursor: pointer; }
.c16-dr .tools { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-bottom: 8px; font-size: 12px; }
.c16-dr table.k-tbl { width: 100%; table-layout: fixed; font-size: 12px; }
.c16-dr td { white-space: normal; overflow-wrap: anywhere; vertical-align: top; }
.c16-dr td.n, .c16-dr th.n { width: 108px; white-space: nowrap; }
.c16-dr tr.pt td { font-weight: 600; background: var(--panel-2); }
.c16-dr tr.it td:first-child { padding-left: 22px; color: var(--fg-2); }
.c16-dr tr.sum td { font-weight: 650; border-top: 1px solid var(--line-2); }
.c16-dr .warn { color: var(--warn); }
.c16-dr .k-note { font-size: 12px; color: var(--fg-2); margin: 6px 0; }
@media (max-width: 520px) { .c16-dr td.n, .c16-dr th.n { width: 66px; } .c16-dr th.n { white-space: normal; } }
</style>
</head>
<body>
<div class="k-page">
  <div id="view"><div class="c16-msg">загрузка…</div></div>
</div>
<script src="../echarts.min.js"></script>
<script src="lib/boot.js"></script>
<script src="lib/kit.js"></script>
<script src="lib/instr.js"></script>
<script src="lib/inbox-why.js"></script>
<script>
(function () {
  'use strict';
  // «ОВП» (TDM#446, макет согласован владельцем 29.10.2026): ОВП книг своего выбора экрана (TDM#533) по валютам —
  // в валюте или в USD-эквиваленте по выбранному курсу (рыночный прогона: MOEX 19:00, иначе 14:00, закрытие CETS,
  // ЦБ; или ЦБ на дату); общая ОВП в USD — нетто (владелец, 30.10.2026); книги × валюты; история по дням. Валюта без
  // курса прогона — по курсу из отчёта ОВП (reportFx), с пометкой «курса нет». Рублей нет, лимитов, дат расчётов, сверки
  // и переноса нет.
  // Источник — публикуемая ОВП прогонов (TDM#416: отчёт ОВП организации + слагаемые вне отчёта из позиций, книги без
  // отчёта — из позиций): GET ../api/v1/history/ocp (backend desk/api/ocp_history.py) — по дням, из сохранённых
  // прогонов, без пересчёта; последний день — прогон страницы. Часть отчёта по юрлицу (без книги) — своей строкой, по
  // книгам не делится; под выбором книг — только целиком (K.ocpScope). В демо — вымышленный ответ той же формы.
  // Книги — свой выбор экрана (TDM#533): юрлицо, тип книги (TDM#556: по настройкам книг, и у книг ОВП без позиций) и
  // книги, по умолчанию все книги юрлица вместе с HTM; фильтр шапки
  // (деск, книги, портфели) к C16 не применяется, об этом — строка над итогом. Выбор — в слое вида (K.viewStore,
  // 'c16:books'), отдельно от фильтра шапки; действует на итог, таблицу и график.
  // Щелчок по строке книги (по сумме валюты — только она) — разбор ОВП строки за день (TDM#603, drill): GET
  // ../api/v1/runs/{run_id дня}/ocp, слагаемые и вклады, строки отчёта, исключённые как деривативы.
  // Отчёта ОВП нет (no_report) — почему, по журналу входящих (TDM#445): GET ../api/v1/inbox/datasets/ocp, lib/inbox-why.js.
  const M = MOCK, K = KIT, f = K.f, esc = K.esc, h = K.h;
  const bar = K.top({ title: 'C16 · ОВП' });
  ['[data-a=ofzview]', '[data-a=repr]'].forEach(s => { const e = bar && bar.querySelector(s); if (e) e.style.display = 'none'; });
  // фильтр шапки здесь не действует (TDM#533): чипы шапки приглушены, причина — в подсказке
  { const fl = bar && bar.querySelector('.filters'); if (fl) { fl.style.opacity = '.55'; fl.title = 'Фильтр шапки к ОВП не применяется: у экрана свой выбор книг'; } }
  const server = K.source === 'real';
  const view = document.getElementById('view');
  const RATES = {
    market: { name: 'MOEX 19:00', title: 'рыночный курс прогона: индикативный MOEX 19:00 (нет — 14:00, закрытие CETS, ЦБ)' },
    cbr: { name: 'ЦБ', title: 'официальный курс ЦБ, действующий на дату' },
  };
  const PERIODS = [['w2', '2 нед'], ['m1', 'месяц'], ['m3', '3 мес']];
  const NO_OCP = { not_computed: 'прогон без расчёта ОВП', failed: 'ошибка расчёта ОВП' };
  const SRC = { derived: 'из позиций', derived_stale_report: 'отчёт устарел, из позиций' };
  const S = { unit: 'ccy', rate: 'market', period: 'm1' };
  let H = null;  // ответ /api/v1/history/ocp; смена выбора книг, курса, формата перерисовывает его без нового запроса
  let chart = null;
  // свой выбор книг (TDM#533): юрлицо (null — все), снятые книги (off) и выбранные (on). Первый раз — юрлицо шапки и
  // все книги, дальше — своё, отдельно от шапки
  // TDM#604: выбор один для всех дней ответа (график за 3 месяца — те же книги, что таблица). Пока в списке книг ничего
  // не снято — входят все, новая книга тоже. Сужен (снята хоть одна книга списка) — входят только выбранные явно (on):
  // книга, которой при выборе не было (только в старых днях, новый код), — снята
  const SEL_KEY = 'c16:books';
  const SEL = (() => {
    const s = K.viewStore.get(SEL_KEY), str = a => a.filter(x => typeof x === 'string');
    // type (TDM#556) — тип книги справочника (TRADING, HTM, …), null — все; нет в запомненном — все
    if (s && typeof s === 'object') return Object.assign({ entity: typeof s.entity === 'string' ? s.entity : null, off: Array.isArray(s.off) ? str(s.off) : [] }, typeof s.type === 'string' ? { type: s.type } : {}, Array.isArray(s.on) ? { on: str(s.on) } : {});
    const x = { entity: K.filter.entity || null, off: [] }; K.viewStore.set(SEL_KEY, x); return x;
  })();
  // снятые и выбранные книги хранятся как есть, без чистки по ответу: книга, которой в ответе нет (демо, другой прогон,
  // ушла из истории), выбор не сужает (scopeFilter), а выбранное в рабочем прогоне не теряется
  const setSel = patch => { Object.assign(SEL, patch); K.viewStore.set(SEL_KEY, SEL); render(); };
  // выбор, запомненный до TDM#604 (только снятые), если он сужен: выбранными считаются книги дня таблицы, кроме снятых
  // (то, что пользователь видел, когда снимал), — запоминается один раз; книга только старых дней — снята
  function migrateSel(d) {
    if (Array.isArray(SEL.on) || !narrowed(bookList(null, null))) return;
    // день таблицы без строк (не посчитан, ошибка) — последний день ответа со строками; таких нет — не переносим
    const src = (d && (d.lines || []).length) ? d : [...(H.days || [])].reverse().find(x => (x.lines || []).length);
    if (!src) return;
    const today = new Set((src.lines || []).flatMap(x => x.book ? [x.book] : x.books || []));
    SEL.on = bookList(null, null).map(b => b.id).filter(b => today.has(b) && !SEL.off.includes(b)); K.viewStore.set(SEL_KEY, SEL);
  }
  // книги списка L, что входят: ничего в L не снято — все; иначе — выбранные явно
  const narrowed = L => L.some(b => SEL.off.includes(b.id));
  const onOf = L => narrowed(L) ? L.filter(b => !SEL.off.includes(b.id) && (!Array.isArray(SEL.on) || SEL.on.includes(b.id))) : L;
  // выбор по списку L: каждая книга списка — явно выбрана или снята, книги вне списка — как были
  // Первое сужение (по всему ответу ничего не было снято) берёт за основу все книги ответа без снятых, а не только
  // список на экране: книги другого юрлица или типа, которых пользователь не снимал, остаются выбранными (ревью #608)
  function choose(L, inc) {
    const ids = L.map(b => b.id), all = bookList(null, null).map(b => b.id);
    const base = narrowed(bookList(null, null)) && Array.isArray(SEL.on) ? SEL.on : all.filter(b => !SEL.off.includes(b));
    setSel({ on: base.filter(b => !ids.includes(b)).concat(ids.filter(b => inc.has(b))), off: SEL.off.filter(b => !ids.includes(b)).concat(ids.filter(b => !inc.has(b))) });
  }
  const menuOpt = {};  // строка поиска меню книг между переоткрытиями

  // Общая ОВП — нетто: сумма USD-эквивалентов валют со знаком (владелец, 30.10.2026; правило — здесь)
  const overall = usd => usd.reduce((a, v) => a + v, 0);
  // ОВП строки книги: null, если у одной из её валют нет USD-эквивалента (курса) — неполная цифра не выглядит полной
  // (итог и линия по дням — по валютам с курсом, без курса — названы)
  const total = usd => usd.some(v => v == null) ? null : overall(usd);
  const mm = v => v == null ? null : v / 1e6;
  const fmt = v => v == null ? '<span class="mut3">—</span>' : '<span class="' + f.cls(Math.round(v * 10)) + '">' + f.s(v, 1) + '</span>';
  // курс валюты, ₽ за единицу, выбранного источника на день; из отчёта ОВП (reportFx; старые прогоны — нет)
  const rate = (d, c) => { const x = (d.fx || {})[c]; return x ? x[S.rate] : null; };
  const repRate = (d, c) => (d.reportFx || {})[c] || null;
  // USD-эквивалент через рубль (null — курса нет): курс валюты и курс USD — прогона, нет его — из отчёта ОВП
  // (владелец, 30.10.2026)
  const toUsd = (v, c, d) => {
    if (v == null) return null; if (c === 'USD') return v;
    const a = rate(d, c) || repRate(d, c), u = rate(d, 'USD') || repRate(d, 'USD');
    return a && u ? v * a / u : null;
  };
  // валюта без курса прогона, пересчитанная по курсу отчёта ОВП (пометка «курса нет» — только у неё)
  const byReport = (c, d) => c !== 'USD' && !rate(d, c) && toUsd(1, c, d) != null;
  const REP = 'Пересчитано по курсу из отчёта ОВП';
  const unitOf = c => 'mm ' + (S.unit === 'usd' ? 'USD' : c);
  const shown = (v, c, d) => S.unit === 'usd' ? toUsd(v, c, d) : v;
  const ccyOrder = (a, b) => ((M.ccyOrder || {})[a] ?? 99) - ((M.ccyOrder || {})[b] ?? 99) || a.localeCompare(b);
  const entityName = e => ((M.entities || []).find(x => x.id === e) || {}).name || e;
  const bookName = id => ((M.book || {})[id] || (H.books || {})[id] || {}).name || id;
  // справочник книги — по тому же правилу, что K.ocpScope (K.ocpBook): юрлицо книги — из справочника, не из строки
  const bookMeta = id => K.ocpBook(id, H.books || {});
  // юрлица ответа; юрлицо выбора — запомненное, если оно есть в ответе, иначе все (подмена не сохраняется: другой
  // прогон или демо на том же адресе не стирают выбор). EN — на перерисовку
  const entsOf = () => [...new Set((H.days || []).flatMap(d => (d.lines || []).map(x => x.entity)).filter(Boolean))].sort((a, z) => entityName(a).localeCompare(entityName(z), 'ru'));
  let EN = null, TY = null;
  // типы книг ответа юрлица ent по справочнику (TDM#556: и книг ОВП без позиций, как их задал владелец)
  const typesOf = ent => [...new Set(bookList(ent, null).map(b => bookMeta(b.id).type).filter(t => t && t !== '—'))].sort();
  // книги ОВП юрлица ent (null — всех) типа ty (null — всех) за все дни ответа: книги строк и книги частей отчёта
  function bookList(ent, ty) {
    const m = new Map();
    (H.days || []).forEach(d => (d.lines || []).forEach(x => (x.book ? [x.book] : x.books || []).forEach(b => {
      const e = bookMeta(b).entity;
      if (!m.has(b) && (!ent || e === ent) && (!ty || bookMeta(b).type === ty)) m.set(b, e);
    })));
    return [...m].map(([id, entity]) => ({ id, entity })).sort((a, z) => bookName(a.id).localeCompare(bookName(z.id), 'ru') || a.id.localeCompare(z.id));
  }
  // фильтр для K.ocpScope из выбора экрана; null — не выбрано ни одной книги. Список — книги юрлица и типа за все дни
  // ответа: снятая книга, которой нет (ушла из истории, другое юрлицо), выбор не сужает. Под суженным выбором часть
  // отчёта по юрлицу без книг не входит ни в один день (K.ocpScope, TDM#604). SF — на перерисовку
  let SF = null;
  function scopeFilter() {
    const L = bookList(EN, TY), on = onOf(L).map(b => b.id);
    if (on.length === L.length) return { entity: EN, type: TY, books: null };
    return on.length ? { entity: EN, type: TY, books: on } : null;
  }
  // суммы дня под выбором книг экрана: по валютам и по строкам (книга или часть отчёта)
  function slice(d) {
    const meta = Object.assign({}, H.books, d.books);
    const sc = (SF && K.ocpScope(d.lines || [], meta, SF)) || { lines: [], notes: [], partial: false };
    // TDM#604: книги дня юрлица и типа выбора — сколько вошло, сколько нет; часть отчёта по юрлицу без книг, что не вошла
    const own = x => x.book ? [x.book] : x.books || [], day = new Set(), got = new Set(sc.lines.flatMap(own));
    (d.lines || []).forEach(x => own(x).forEach(b => { const m = K.ocpBook(b, meta); if ((!EN || m.entity === EN) && (!TY || m.type === TY)) day.add(b); }));
    const lost = [...new Set((d.lines || []).filter(x => !x.book && !(x.books || []).length && (!EN || x.entity === EN) && !sc.lines.includes(x)).map(x => x.entity))];
    const by = {}, rows = new Map();
    let withDer = false;
    sc.lines.forEach(x => {
      if (x.ccy === 'RUB' || x.amount == null) return;
      by[x.ccy] = (by[x.ccy] || 0) + x.amount;
      const k = x.book ? 'b|' + x.book : 'e|' + x.entity + '|' + (x.books || []).join(',');
      const r = rows.get(k) || { x, v: {}, src: new Set(), by: {}, valid: null };
      r.v[x.ccy] = (r.v[x.ccy] || 0) + x.amount; r.src.add(x.source); (r.by[x.source] = r.by[x.source] || []).push(x.ccy);
      // «база отчёта + день» (TDM#531): база — отчёт за прошлый рабочий день, это норма — дата только в подсказке;
      // «отчёт от» — только у базы старше прошлого рабочего дня (baseOlder: сервер считает по календарю прогона).
      // Книга без строк в отчёте — «нет в отчёте»
      if (d.basis === 'report_base_plus_day') {
        if (x.baseDate) { if (x.baseOlder) r.valid = x.baseDate; else r.base = x.baseDate; }
        if (x.baseKind === 'book_absent') r.absent = true;
        if (x.baseKind === 'with_derivatives') { r.withDer = true; withDer = true; }  // TDM#567 (D24): отчёт ещё с деривативами, PV не добавлен
      } else if (x.validDate && x.validDate < d.date) r.valid = x.validDate;
      rows.set(k, r);
    });
    return { by, rows: [...rows.values()], withDer, notes: sc.notes, partial: !!sc.partial, ccys: Object.keys(by).sort(ccyOrder),
      books: { day: day.size, in: [...day].filter(b => got.has(b)).length }, lost };
  }
  // подпись методики дня: по basis report_base_plus_day — только если в срезе есть строка с отчётом ещё с деривативами
  const methodOf = (d, T) => d && d.methodNote && (d.basis !== 'report_base_plus_day' || (T && T.withDer)) ? d.methodNote : null;
  const usable = d => !!(d && d.basis && !NO_OCP[d.state]);
  const noOcp = d => 'ОВП нет: ' + (NO_OCP[d.state] || 'прогон до публикуемой ОВП');
  const portName = v => v === '—' ? 'без портфеля' : v;

  // строка выбора книг над итогом: юрлицо, книги (меню с поиском) и пометка, что фильтр шапки здесь не действует
  function scopeBar() {
    const sb = h('div', 'c16-scope'); sb.setAttribute('data-c16-scope', '');
    const ents = entsOf();
    const L = bookList(EN, TY), inc = onOf(L), off = L.filter(b => !inc.includes(b)), n = inc.length, types = typesOf(EN);
    const blbl = !off.length ? 'все книги · ' + L.length : n ? 'книги: ' + n + ' из ' + L.length : 'книги не выбраны';
    const hf = K.filter, ports = (hf.portsOff || []).filter(Boolean);
    const head = [hf.entity && entityName(hf.entity), hf.desk, hf.ccy && 'валюта ' + hf.ccy, hf.books && hf.books.length && (hf.books.length === 1 ? bookName(hf.books[0]) : hf.books.length + ' книг'), ports.length && 'без ' + ports.map(portName).join(', ')].filter(Boolean);
    sb.innerHTML = '<span class="lb">Книги ОВП:</span>' +
      '<span class="k-chip' + (EN ? ' on' : '') + '" data-c16="entity">' + esc(EN ? entityName(EN) : 'все юрлица') + ' ▾</span>' +
      (types.length ? '<span class="k-chip' + (TY ? ' on' : '') + '" data-c16="type" title="тип книги из настроек книг; «выведен» — в настройках не задан, выводится по облигациям периода">' + esc(TY ? 'тип: ' + TY : 'все типы книг') + ' ▾</span>' : '') +
      '<span class="k-chip' + (off.length ? ' on' : '') + '" data-c16="books" title="' + esc(off.length ? 'сняты: ' + off.map(b => bookName(b.id)).join(', ') : 'все книги юрлица, HTM входит') + '">' + esc(blbl) + ' ▾</span>' +
      '<span class="k-note" data-c16-note><b>Фильтр шапки здесь не действует</b>' + (head.length ? ' (в шапке: ' + esc(head.join(' · ')) + ')' : '') +
      ': ОВП считается по книгам целиком, портфели' + (ports.length ? ' (' + esc(ports.map(portName).join(', ')) + ')' : '') + ' не исключаются — свой выбор книг экрана.</span>';
    sb.querySelectorAll('[data-c16]').forEach(ch => ch.onclick = ev => {
      ev.stopPropagation();
      if (ch.dataset.c16 === 'entity') {
        K.menu(ch, [{ v: null, t: 'все юрлица' }].concat(ents.map(e => ({ v: e, t: entityName(e) }))), EN, v => setSel({ entity: v }));
        return;
      }
      if (ch.dataset.c16 === 'type') {

        return;
      }
      const reopen = () => { const c = document.querySelector('[data-c16=books]'); if (c) c.click(); };
      const items = L.map(b => { const m = bookMeta(b.id), t = [b.id, m.desk && m.desk !== '—' ? m.desk : '', m.type && m.type !== '—' ? m.type + (m.typeDerived ? ' (выведен)' : '') : '', EN || !b.entity ? '' : entityName(b.entity), m.ocpOnly ? 'только ОВП' : ''].filter(Boolean); return { v: b.id, t: bookName(b.id), sub: t.join(' · '), multi: true }; });
      const cur = () => new Set(inc.map(b => b.id));
      K.menu(ch, items, inc.map(b => b.id), v => { const c = cur(); if (c.has(v)) c.delete(v); else c.add(v); choose(L, c); }, 'c16-books',
        Object.assign(menuOpt, { reopen, all: ids => choose(L, new Set([...cur(), ...ids])), none: ids => { const c = cur(); ids.forEach(b => c.delete(b)); choose(L, c); } }));
    });
    return sb;
  }

  function panel(title) { const p = h('div', 'k-panel'); p.innerHTML = '<div class="hd"><h3>' + title + '</h3><span class="sp"></span><span class="m"></span></div><div class="bd"></div>'; return p; }
  function msg(t) { H = null; if (chart) { chart.dispose(); chart = null; } view.innerHTML = '<div class="k-panel"><div class="c16-msg">' + t + '</div></div>'; }

  // нет отчёта ОВП (no_report): почему — по журналу входящих сейчас (TDM#445; lib/inbox-why.js над
  // ../api/v1/inbox/datasets/ocp?on=<дата прогона>); ответ помнится на дату: перерисовка его не спрашивает снова
  let why = null;
  function whyPanel(on) {
    const p = panel('Почему отчёта ОВП нет');
    const bd = p.querySelector('.bd');
    const c14 = 'c14-day-status.html' + (on ? '?on=' + encodeURIComponent(on) : '');
    const show = w => {
      bd.innerHTML = w.x ? INBOX_WHY.html(w.x, { on }) : '<div class="mut">Причина не загрузилась (' + esc(w.err) + ') — файлы дня в <a href="' + c14 + '">C14</a></div>';
    };
    if (why && why.on === on) show(why);
    else if (!server) show({ x: DEMO_WHY(on) });
    else {
      bd.innerHTML = '<div class="mut">загрузка…</div>';
      fetch('../api/v1/inbox/datasets/ocp' + (on ? '?on=' + encodeURIComponent(on) : ''), { cache: 'no-store' }).then(r => {
        if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
        return r.json();
      }).then(x => ({ on, x }), e => ({ on, err: e.message })).then(w => { why = w; show(w); });
    }
    return p;
  }

  function load() {
    why = null;
    if (!server) { H = DEMO(); render(); return; }
    fetch('../api/v1/history/ocp' + (M.run.id != null ? '?run_id=' + encodeURIComponent(M.run.id) : ''), { cache: 'no-store' }).then(r => {
      if (r.status === 401 || r.status === 403) throw Object.assign(new Error('forbidden'), { forbidden: true });
      if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
      return r.json();
    }).then(x => { H = x; render(); }).catch(e => e.forbidden ? msg('Нужно войти в монитор.') : msg('Не удалось загрузить ОВП прогона #' + esc(M.run.id) + ': ' + esc(e.message)));
  }

  function render() {
    if (!H) return;
    if (chart) { chart.dispose(); chart = null; }
    const days = H.days || [], last = days[days.length - 1];
    const d = last && last.date === H.asOf ? last : { date: H.asOf, state: 'not_computed', basis: null, fx: {}, lines: [] };
    const ents = entsOf(); EN = SEL.entity && ents.includes(SEL.entity) ? SEL.entity : null;
    TY = SEL.type && typesOf(EN).includes(SEL.type) ? SEL.type : null;  // как юрлицо: нет в ответе — все (не сохраняется)

        C.map((c, k) => '<div class="k-kpi" data-ocp-ccy="' + esc(c) + '"><div class="l"><i class="c" style="background:' + K.ccyColor(c) + '"></i>' + esc(c) + '</div><div class="v">' + fmt(mm(shown(T.by[c], c, d))) + ' <span class="u">' + unitOf(c) + '</span></div><div class="s">' +
          (c === 'USD' ? '&nbsp;' : usd[k] == null ? 'курса нет' : (S.unit === 'usd' ? f.s(mm(T.by[c]), 1) + ' mm ' + esc(c) : '≈ ' + f.s(mm(usd[k]), 1) + ' mm USD') +
            (viaRep.includes(c) ? ' · <span title="' + REP + '">курса нет</span>' : '')) + '</div></div>').join('') + '</div>';
    }
    wrap.appendChild(sp);
    if (d.state === 'no_report') wrap.appendChild(whyPanel(d.date));
    // TDM#672: строки кросс-пары без условий сделки, у которых валюта строки не первая валюта пары, в ОВП не входят — сервер называет их (unconfirmed)
    if (d.unconfirmed && (d.unconfirmed.items || []).length) {
      const up = panel('Не вошло в ОВП: единица номинала не подтверждена');
      up.querySelector('.bd').innerHTML = '<div class="k-note" style="color:var(--warn)" data-c16-unconfirmed>' + esc(d.unconfirmed.text) + '</div>' +
        '<div class="k-note">Позиции: ' + d.unconfirmed.items.map(posLink).join(', ') + '</div>';
      wrap.appendChild(up);
    }

    // книги × валюты; часть отчёта по юрлицу — своей строкой (по книгам отчёт её не делит)
    const bp = panel('По книгам');
    bp.querySelector('.bd').classList.add('flush', 'scroll');
    if (C.length) {
      const rows = T.rows.map(r => Object.assign(r, { g: total(Object.keys(r.v).map(c => toUsd(r.v[c], c, d))) })).sort((a, z) => Math.abs(z.g || 0) - Math.abs(a.g || 0));
      const cell = (v, c) => '<td class="n">' + (v == null ? '<span class="mut3">—</span>' : fmt(mm(shown(v, c, d)))) + '</td>';
      // источник строки — только когда в таблице есть и отчёт, и не отчёт (иначе его говорит шапка или он один)
      const mixed = rows.some(r => r.src.has('report')) && rows.some(r => [...r.src].some(s => s !== 'report'));
      const label = r => {
        const x = r.x, src = mixed ? [...r.src].filter(s => s !== 'report') : [];
        const tag = (src.length ? ' <span class="c16-src" title="' + esc(src.map(s => (SRC[s] || s) + ': ' + r.by[s].join(', ')).join('; ')) + '">' + esc(src.map(s => SRC[s] || s).join(', ')) + '</span>' : '') + (r.valid ? ' <span class="c16-src">отчёт от ' + f.date(r.valid) + '</span>' : '') + (r.withDer ? ' <span class="c16-src" style="color:var(--warn)" data-c16-wd title="не по текущей методике: отчёт ещё с деривативами, их PV не добавлен">отчёт с деривативами</span>' : '') + (r.absent ? ' <span class="c16-src" title="книги нет в отчёте ОВП на дату базы: база 0, к ней PV деривативов и изменения дня">нет в отчёте</span>' : '');
        const base = r.base ? ' · база ' + r.base.slice(8, 10) + '.' + r.base.slice(5, 7) : '';
        return x.book ? '<span title="' + esc(x.book + base) + '">' + esc(bookName(x.book)) + '</span>' + tag
          : '<span title="книги: ' + esc(((x.books || []).map(bookName).join(', ') || '—') + base) + '">' + esc(entityName(x.entity)) + ' <span class="mut3">часть отчёта</span></span>' + tag;
      };
      bp.querySelector('.bd').innerHTML = '<table class="k-tbl" data-vk="c16-books" data-title="ОВП по книгам"><thead><tr><th>Книга</th>' +
        C.map(c => '<th class="n"' + (byReport(c, d) ? ' title="Курса нет. ' + REP + '"' : '') + '>' + esc(c) + '<span class="k-thu">' + unitOf(c) + '</span></th>').join('') + '<th class="n" title="сумма USD-эквивалентов валют строки со знаком">ОВП книги<span class="k-thu">mm USD</span></th></tr></thead><tbody>' +
        rows.map((r, i) => '<tr data-ocp-row="' + esc(r.x.book || r.x.entity) + '" data-ocp-i="' + i + '" title="щелчок — из чего складывается ОВП строки"><td>' + label(r) + '</td>' + C.map(c => cell(r.v[c], c).replace('<td class="n">', '<td class="n" data-ocp-c="' + esc(c) + '">')).join('') + '<td class="n"' + (r.g == null ? ' title="нет курса одной из валют строки"' : '') + '>' + fmt(mm(r.g)) + '</td></tr>').join('') +
        '<tr class="tot"><td>Итого</td>' + C.map(c => cell(T.by[c], c)).join('') + '<td></td></tr></tbody></table>';
      // TDM#603: щелчок по строке — разбор ОВП строки за день таблицы, по сумме валюты — только этой валюты
      bp.querySelector('.bd').onclick = ev => {
        const tr = ev.target.closest('tr[data-ocp-i]'); if (!tr || ev.target.closest('a')) return;
        const td = ev.target.closest('td[data-ocp-c]');
        drill(rows[+tr.dataset.ocpI], td ? td.dataset.ocpC : null, d.date);
      };
    } else bp.querySelector('.bd').innerHTML = EMPTY;
    wrap.appendChild(bp);

    // по дням: столбцы по валютам (USD-эквивалент), линия — общая ОВП по валютам с курсом (без курса — названы в
    // подсказке, как в итоге; TDM#534); день без публикуемой ОВП — пусто, причина — в подсказке
    const hp = panel('По дням');
    K.seg(hp.querySelector('.m'), PERIODS, S.period, v => { S.period = v; render(); });
    hp.querySelector('.bd').innerHTML = '<div class="c16-chart"></div>';
    wrap.appendChild(hp);
    view.appendChild(wrap);
    K.tableToolsAll(wrap);

    const D = days.filter(x => x.date > since(H.asOf, S.period));
    const sl = D.map(x => usable(x) ? slice(x) : null);
    const HC = [...new Set(sl.flatMap(s => s ? s.ccys : []))].sort(ccyOrder);
    if (!HC.length) { hp.querySelector('.bd').innerHTML = '<div class="k-empty">Нет данных за период</div>'; return; }
    const usdOf = (s, c, x) => s && s.by[c] != null ? mm(toUsd(s.by[c], c, x)) : null;
    // общая ОВП дня: сумма валют с USD-эквивалентом; null — нет ни одной; без курса — названы в подсказке
    const usdDay = D.map((x, i) => sl[i] ? sl[i].ccys.map(c => toUsd(sl[i].by[c], c, x)) : []);
    const line = usdDay.map(u => u.some(v => v != null) ? mm(overall(u.filter(v => v != null))) : null);
    const tip = D.map((x, i) => {
      if (!sl[i]) return noOcp(x);
      if (!sl[i].ccys.length) return 'нет валютной позиции';
      const no = sl[i].ccys.filter((c, k) => usdDay[i][k] == null);
      return no.length ? 'Общая — без ' + no.join(', ') + ': курса нет' : '';
    });
    // TDM#567 (D11, D24): день не по текущей методике (подпись сервера, ocp_line.method_note) — звёздочка на оси,
    // бледные столбцы и строка в подсказке; пересчёта истории нет
    const meth = D.map((x, i) => usable(x) ? methodOf(x, sl[i]) : null);
    if (meth.some(Boolean)) hp.querySelector('.m').insertAdjacentHTML('afterbegin', '<span class="mut3" data-c16-method-legend title="' + esc([...new Set(meth.filter(Boolean))].join('; ')) + '">* бледные столбцы — день не по текущей методике</span> ');
    const pale = (v, i, col) => meth[i] && v != null ? { value: v, itemStyle: { color: col, opacity: 0.45 } } : v;
    const css = K.css;
    chart = K.chart(hp.querySelector('.c16-chart'), () => ({
      animation: false, grid: { left: 6, right: 10, top: 30, bottom: 4, containLabel: true }, legend: { top: 0, left: 0 },
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: ps => {
        const i = (ps[0] || {}).dataIndex; if (i == null || !D[i]) return '';
        // валюта дня без курса — «—»; валюты, которой в этот день нет, — не строкой
        const rows = ps.filter(p => p.value != null || (sl[i] && sl[i].ccys.includes(p.seriesName)));
        return '<b>' + esc(f.date(D[i].date)) + '</b>' + rows.map(p => '<br>' + p.marker + esc(p.seriesName) + ': <b>' + (p.value == null ? '—' : f.s(p.value, 1) + ' mm USD') + '</b>').join('') +
          (tip[i] ? '<br><span style="color:var(--warn)" data-c16-tip>' + esc(tip[i]) + '</span>' : '') +
          (sl[i] && sl[i].books.day ? '<br><span class="mut3" data-c16-books>' + esc(booksTip(sl[i])) + '</span>' : '') +
          (sl[i] && sl[i].lost.length ? '<br><span style="color:var(--warn)" data-c16-lost>' + esc('часть отчёта по юрлицу ' + sl[i].lost.map(entityName).join(', ') + ' без книг не учтена: под выбором книг её не разделить по книгам') + '</span>' : '') +
          (meth[i] ? '<br><span style="color:var(--warn)" data-c16-method>' + esc(meth[i]) + '</span>' : '');
      } },
      xAxis: { type: 'category', data: D.map(x => f.dshort(x.date)), axisLabel: { formatter: (v, i) => meth[i] ? v + '*' : v } },
      yAxis: { type: 'value', unit: 'mm USD', axisLabel: { formatter: v => K.tick(v, 1) } },
      series: HC.map(c => ({ name: c, type: 'bar', stack: 'o', barMaxWidth: 28, data: D.map((x, i) => pale(usdOf(sl[i], c, x), i, K.ccyColor(c))), itemStyle: { color: K.ccyColor(c) } }))
        // точка без соседей (дни вокруг без ОВП) — кружком, иначе одиночную дату линии не видно; showAllSymbol — чтобы
        // ECharts не прореживал точки (3 мес, узкий экран) и кружок не пропадал
        .concat([{ name: 'Общая', type: 'line', data: line, symbol: 'circle', showAllSymbol: true, symbolSize: (v, p) => line[p.dataIndex - 1] == null && line[p.dataIndex + 1] == null ? 5 : 0, lineStyle: { width: 2 }, color: css('--fg') }]),
    }));
  }
  // ---------- разбор строки (TDM#603): из чего складывается ОВП книги за день ----------
  // Источник — блок ОВП прогона дня: GET ../api/v1/runs/{run_id дня}/ocp (published.by_book: parts и ограниченные
  // contributions, excluded, derivative_types; история их не несёт). В демо — вымышленный ответ той же формы (DEMO_OCP).
  const KIND = { fx_forward: 'валютные форварды', fx_swap: 'валютные свопы', fx_future: 'валютные фьючерсы', ndf: 'NDF', fx_option: 'валютные опционы', swap: 'процентные и валютно-процентные свопы', other: 'прочие деривативы' };
  const PART = { base: 'база: отчёт ОВП без деривативов', balances: 'остатки по счетам: книги нет в отчёте ОВП', derivatives: 'PV деривативов из позиций', bonds: 'переоценка облигаций', trades: 'сделки после базы', outside: 'вне отчёта (из позиций)' };
  const ASSET = { fx: 'валюта', bond: 'облигация' }, LEG = { fx: 'валюта', cash: 'деньги', security: 'бумага' };
  const RUNS = {};  // ответ /ocp по прогону (демо — по дате): повторный щелчок не спрашивает сервер снова
  function runOcp(day) {
    const id = day.runId != null ? day.runId : day.date === H.asOf ? (M.run || {}).id : null;
    const key = server ? 'r' + id : 'd' + day.date;
    if (RUNS[key]) return RUNS[key];
    if (!server) return (RUNS[key] = Promise.resolve(DEMO_OCP(day)));
    if (id == null) return Promise.reject(new Error('у дня нет прогона'));
    const url = '../api/v1/runs/' + encodeURIComponent(id) + '/ocp';
    return (RUNS[key] = fetch(url, { cache: 'no-store' }).then(r => {
      if (r.ok) return r.json();
      // какой запрос, код ответа и что сказал сервер (номер запроса — тот же, что в журнале монитора)
      return r.text().then(t => {
        let j = null; try { j = JSON.parse(t); } catch (_) { /* не JSON */ }
        throw new Error('сервер ответил ' + r.status + (r.statusText ? ' ' + r.statusText : '') + ' на запрос блока ОВП прогона #' + id +
          ' (GET ' + url.replace('../', '/') + ')' + (j && j.message ? ': ' + j.message : '') +
          (j && j.request_id ? '; номер запроса ' + j.request_id + ' — по нему ошибка найдётся в журнале монитора' : ''));
      });
    }, e => { throw new Error('запрос блока ОВП прогона #' + id + ' не дошёл до сервера: ' + e.message); })
      .catch(e => { delete RUNS[key]; throw e; }));
  }
  // строка таблицы ↔ строка блока (snake_case) и строка истории (camelCase): книга или часть отчёта по юрлицу с теми же книгами
  const rowKey = (book, entity, books) => book ? 'b|' + book : 'e|' + entity + '|' + (books || []).slice().sort().join(',');
  const keyOf = r => rowKey(r.x.book, r.x.entity, r.x.books);
  const mm2 = v => '<span class="' + f.cls(Math.round((v || 0) / 1e4)) + '">' + f.mns(v, 2) + '</span>';
  const dl = (h, t) => '<a href="' + esc(h) + '">' + esc(t) + '</a>';
  const posLink = id => id ? dl('c03-blotter.html?pos=' + encodeURIComponent(id), id) : '—';
  function item(p, i, line) {
    const bits = [];
    if (i.kind === 'report') bits.push('отчёт ОВП от ' + esc(f.date(i.valid_date)) + (i.file ? ', файл ' + esc(i.file) : '') + (i.rows ? ', строк: ' + esc(i.rows) : ''));
    else if (i.kind === 'report_part') bits.push(esc(i.note || 'часть отчёта') + (i.book_id ? ' (' + esc(bookName(i.book_id)) + ')' : ''));

  function DEMO() {

    const dates = []; for (let x = new Date(asOf + 'T00:00:00Z'), lim = since(asOf, 'm3'); x.toISOString().slice(0, 10) > lim; x.setUTCDate(x.getUTCDate() - 1)) if (x.getUTCDay() % 6) dates.unshift(x.toISOString().slice(0, 10));
    // ОВП строки на дату, mm в валюте; книги — демо-набора шапки; часть отчёта по юрлицу AM — без деления по книгам;
    // CHF — без курса прогона, по курсу отчёта ОВП
    const TODAY = [['BANK', 'FXCR-USD', null, 'USD', 12], ['BANK', 'FXCR-CNY', null, 'CNY', 150], ['BANK', 'FXB', null, 'CNY', -5],
      ['BANK', 'FXB-SWAP', null, 'USD', -8], ['BANK', 'FXB-SWAP', null, 'EUR', 3], ['BANK', 'FXB-SWAP', null, 'CNY', -60],
      ['BANK', 'FXB-FWD', null, 'USD', -2.5], ['BANK', 'FXB-FWD', null, 'EUR', -1], ['BANK', 'FXB-FWD', null, 'CNY', 20],
      ['BANK', 'FXB-SWAP', null, 'CHF', 0.8], ['BANK', 'HTM', null, 'EUR', 2], ['IC', 'IC-BND', null, 'USD', 1.5, 'derived'], ['AM', null, ['AM-BOND', 'AM-CNY'], 'CNY', 40]];
    let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const walk = TODAY.map(([, , , , v]) => { const a = new Array(dates.length); a[a.length - 1] = v; for (let i = a.length - 2; i >= 0; i--) a[i] = Math.round((a[i + 1] + v * 0.08 * (rnd() * 2 - 1)) * 10) / 10; return a; });
    const cbr = { USD: 79.9, EUR: 95.9, CNY: 11.05, CHF: 99.2 };
    const w = (i, c) => 1 + 0.004 * Math.sin(i / 5 + c.length + (c === 'CNY' ? 2 : 0));
    const fx = i => Object.fromEntries(['USD', 'EUR', 'CNY'].map(c => [c, { market: Math.round(M.fx[c] * w(i, c) * 1e4) / 1e4, cbr: Math.round(cbr[c] * w(i, c) * 1e4) / 1e4, source: 'demo' }]));
    const reportFx = i => Object.fromEntries(Object.keys(cbr).map(c => [c, Math.round(cbr[c] * w(i, c) * 1e4) / 1e4]));
    // TDM#604: дни двух видов — старые (первые полтора месяца) ещё с частью отчёта по юрлицу BANK без книг и книгой
    // FXB-OLD, которой в новых днях нет; под суженным выбором книг они не входят ни в один день
    const oldUntil = dates[Math.floor(dates.length / 2)];
    return { runId: null, asOf, from: dates[0], to: asOf, books: { 'FXB-OLD': { name: 'FX: прежняя книга', entity: 'BANK', desk: 'FX', type: 'TRADING', ocpOnly: true } },
      days: dates.map((date, i) => {
        const today = i === dates.length - 1, nr = today && noReport, old = date < oldUntil;
        return { date, runId: null, runType: 'EOD', state: nr ? 'no_report' : 'computed', basis: old ? 'report_plus_outside' : 'report_base_plus_day', fx: fx(i), reportFx: nr ? {} : reportFx(i),
          lines: TODAY.map(([entity, book, books, ccy, , src], k) => ({ entity, book, books: books || [book], ccy, amount: walk[k][i] * 1e6 * (nr ? 1.03 : 1), source: nr ? 'derived' : src || 'report', reported: null, validDate: null }))
            .concat(old ? [{ entity: 'BANK', book: null, books: [], ccy: 'USD', amount: 6e6, source: 'report', reported: null, validDate: null },
              { entity: 'BANK', book: 'FXB-OLD', books: ['FXB-OLD'], ccy: 'USD', amount: 4e6, source: 'report', reported: null, validDate: null }] : []) };
      }) };
  }
  // демо разбора (TDM#603): вымышленный ответ /api/v1/runs/{id}/ocp той же формы по строкам дня истории — база отчёта,
  // PV деривативов, сделки, вне отчёта; у FXB-FWD в USD из отчёта вынесено как деривативы больше, чем добавлено из позиций
  // (тип строки отчёта без пары в позициях), у FXB-SWAP в CNY разбор обрезан (показаны 10 из 14). Метки типов строк — вымышленные
  function DEMO_OCP(day) {
    const prev = s => { const t = new Date(s + 'T00:00:00Z'); do t.setUTCDate(t.getUTCDate() - 1); while (!(t.getUTCDay() % 6)); return t.toISOString().slice(0, 10); };
    const next2 = s => { const t = new Date(s + 'T00:00:00Z'); for (let n = 0; n < 2;) { t.setUTCDate(t.getUTCDate() + 1); if (t.getUTCDay() % 6) n++; } return t.toISOString().slice(0, 10); };
    const B = prev(day.date), r2 = v => Math.round(v);
    const bounded = items => { items.sort((a, z) => Math.abs(z.amount) - Math.abs(a.amount)); const head = items.slice(0, 10), rest = items.slice(10); return { items: head, rest: rest.length ? { count: rest.length, amount: rest.reduce((a, x) => a + x.amount, 0) } : null }; };
    const by = (day.lines || []).map((x, k) => {
      const a = x.amount, book = x.book;
      const L = { entity: x.entity, book_id: x.book, books: x.books || [], ccy: x.ccy, amount: a, source: x.source, components: [], outside: {}, reported: null, valid_date: B };
      if (x.source !== 'report') return L;
      if (!book) return Object.assign(L, { reported: a, base_date: B, set_id: 900 + k, base_kind: 'without_derivatives', parts: { base: a, derivatives: 0, bonds: 0, trades: 0, outside: 0 },
        contributions: { base: { items: [{ kind: 'report', set_id: 900 + k, valid_date: B, file: 'ocp_demo.csv', book_id: null, rows: 2, amount: a }], rest: null } }, excluded: [], derivative_types: [] });
      const many = book === 'FXB-SWAP' && x.ccy === 'CNY', spot = book === 'FXB-FWD' && x.ccy === 'USD';
      const der = r2(a * 0.35), trd = r2(a * 0.08), out = k % 3 ? 0 : r2(a * 0.04), base = a - der - trd - out;
      const dItems = many ? Array.from({ length: 14 }, (_, j) => ({ kind: 'position', position_id: book + '|SWP-' + (j + 1), book_id: book, derivative: 'fx_swap', component: 'fx_legs', basis: 'spot_equivalent', last_flow: next2(next2(day.date)), amount: 0 }))
        : [{ kind: 'position', position_id: book + '|FWD-1', book_id: book, derivative: 'fx_forward', component: 'fx_legs', basis: 'spot_equivalent', last_flow: '2026-12-16', amount: spot ? der : r2(der * 0.7) },
          ...(spot ? [] : [{ kind: 'position', position_id: book + '|SWP-2', book_id: book, derivative: 'fx_swap', component: 'fx_legs', basis: 'spot_equivalent', last_flow: '2027-01-20', amount: der - r2(der * 0.7) }])];
      if (many) { let left = der; dItems.forEach((it, j) => { it.amount = j === dItems.length - 1 ? left : r2(der * (1 + (j % 3 - 1) * 0.3) / 14); left -= it.amount; }); }
      const kinds = [...new Set(dItems.map(i => i.derivative))];
      const excluded = kinds.map(kd => { const add = dItems.filter(i => i.derivative === kd).reduce((s0, i) => s0 + i.amount, 0), nom = spot ? add + 9e6 : r2(add * 1.01);
        return { kind: kd, component: 'fx_legs', nominal: nom, added: add, outside: 0, positions: dItems.filter(i => i.derivative === kd).length, fallback: false, diff: nom - add }; });
      const types = spot ? [{ type: 'Тип строки A', kind: 'fx_forward', kept: false, lines: 2, amount: der }, { type: 'Тип строки B', kind: 'fx_forward', kept: false, lines: 1, amount: 9e6 }, { type: 'Тип строки C', kind: 'fx_forward', kept: true, lines: 1, amount: 1.5e6 }] : [];
      const C = { base: bounded([{ kind: 'report', set_id: 900 + k, valid_date: B, file: 'ocp_demo.csv', book_id: book, rows: 3, amount: base }]), derivatives: bounded(dItems),
        trades: bounded([{ kind: 'trade', trade_id: 'D' + (100 + k), book_id: book, leg: 'fx', trade_date: day.date, amount: trd, asset: 'fx', value_date: next2(day.date) }]) };
      if (out) C.outside = bounded([{ kind: 'position', position_id: book + '|OPT-1', book_id: book, component: 'options', amount: out }]);
      return Object.assign(L, { reported: base, base_date: B, set_id: 900 + k, base_kind: 'without_derivatives', components: out ? ['options'] : [], outside: out ? { options: out } : {},
        parts: { base, derivatives: der, bonds: 0, trades: trd, outside: out }, contributions: C, split_kinds: kinds, fallback: [], partial_pv: [], no_pv: [], excluded, derivative_types: types,
        spot_future: spot ? { out: [{ value_date: '2026-12-22', pair: 'EUR/USD', src: 'R5', amount: 2e6, book_id: book, position_id: book + '|FWD-1', trade_ids: ['D-1001'], days: 2, others: [] }], unmatched: [{ value_date: '2027-01-15', pair: 'EUR/USD', src: 'R6', amount: 3e5, book_id: book, why: 'no_deal' }], df1: [{ position_id: book + '|FWD-1', trade_ids: ['D-1001'], amount: 2e6, note: 'нет кривой EUR: дисконт-фактор 1' }] } : undefined });
    });
    return { run_id: null, state: 'computed', as_of: day.date, components: Object.entries({ cash: 'кэш и к расчёту', fx_legs: 'PV валютных ног', options: 'опционы', bonds: 'облигации', other: 'прочее' }).map(([key, name]) => ({ key, name })),
      parts: [], published: { basis: 'report_base_plus_day', base_date: B, by_book: by },
      // разбивка «из позиций» (TDM#713): набор позиций перенесён с прошлой даты, остаток старше; вымышленные позиция и счёт
      origins: by.filter(x => x.source !== 'report').map(x => {
        const set = { set_id: 1, valid_date: B, carried: true, age_days: 1, source: 'demo', file_name: 'positions_demo.csv', report_date: null };
        const pos = Math.round(x.amount * 0.6), cash = x.amount - pos;
        const items = [{ kind: 'position', key: x.book_id + '|P-1', position_id: x.book_id + '|P-1', book_id: x.book_id, component: 'fx_legs', basis: 'spot_equivalent', amount: pos, pv: null, note: '', name: 'Демо-позиция', set },
          { kind: 'cash', key: 'CASH|' + x.book_id + '|' + x.ccy, position_id: null, book_id: x.book_id, component: 'cash', basis: 'balance', amount: cash, pv: null, note: '', restored: true,
            accounts: [{ account_id: 'ACC-DEMO', account_kind: null, ledger: null, balance_ccy: cash }], sets: [{ set_id: 2, valid_date: '2026-10-01', carried: true, age_days: 20, source: 'demo', file_name: 'cash_demo.csv', report_date: null }] }];
        return { entity: x.entity, book_id: x.book_id, books: x.books, ccy: x.ccy, source: x.source, amount: x.amount, sum: x.amount, matches: true, items, rest: null, sets: [{ book_id: x.book_id, set }] };
      }) };
  }
  // демо «почему отчёта нет» (форма ответа /api/v1/inbox/datasets/ocp): вымышленные файл и коды
  const DEMO_WHY = on => ({ dataset: 'ocp', name: 'ОВП', on, adapter: 'ok demo 1.0 000000000000', sources: ['ocp_demo'], in_force: null,
    files: { total: 1, by_status: { rejected: 1 }, status_text: { rejected: 'отклонён' }, later: { total: 0, by_status: {}, first_date: null } },
    latest: { file: '000000000000', name: 'ocp_demo.csv', status: 'rejected', status_text: 'отклонён', source: 'ocp_demo', report_date: on, valid_date: on,
      after: false, units: { rejected: 2 }, reason: 'книги нет в справочнике', issues: [{ severity: 'error', code: 'unknown_book', count: 2, text: 'книги нет в справочнике' }] },
    unread: { ignored: 3, too_old: 0 }, lookback_days: 35, folders: { count: 1, scanned: 1, missing: 0 }, settings_link: true,
    last_scan: { at: on + 'T07:00:00Z', files: { rejected: 1 }, skipped: {} } });

  K.commands && K.commands([{ label: 'ОВП: обновить', run: load }]);
  // фильтр шапки (к ОВП не применяется — меняется только пометка «в шапке: …») и формат отрицательных «(1) / −1»
  // (#153, #262): перерисовать из последнего ответа
  K.onFilter(render);
  K.on('numfmt', render);
  load();
})();
