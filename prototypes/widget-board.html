<!doctype html>
<!-- DEPRECATED (22.10.2026): ранний экран, основной набор теперь — мониторы (concepts/; замена: C06 Плиточная доска).
     Из интерфейса (строка навигации, главная, мониторы) не открывается; файл оставлен, открывается по прямому
     адресу. README.md, «Устаревшие экраны». -->
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Desk Widget Board</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  /* Layout: a 12-column launchpad grid of crisp, square-cornered panels on a slate-blue workspace; 148px row unit */
  --font-sans:"IBM Plex Sans",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-cond:"IBM Plex Sans Condensed","IBM Plex Sans","Arial Narrow",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --row:148px; --gap:10px;
  color-scheme:dark;
  --bg:#151c28; --dot:rgba(143,176,255,.07); --panel:#1e2737; --panel-2:#263145; --line:#2d394d; --line-2:#435270;
  --fg:#e5eaf2; --fg-2:#b8c2d3; --muted:#8996ac; --accent:#8fb0ff; --accent-ink:#0f1830; --focus:#b9ccff;
  --chart-grid:#2a3446; --track:#2f3a4f; --scrim:rgba(6,10,18,.62); --shadow:0 12px 32px rgba(3,8,18,.5);
  --pos:#3987e5; --neg:#e66767; --mid:#3a4457; --total:#c3ccdb;
  --ok:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#e6eaf0; --dot:rgba(40,62,110,.08); --panel:#ffffff; --panel-2:#f1f4f8; --line:#d4dae4; --line-2:#b4bece;
    --fg:#141c2a; --fg-2:#38445a; --muted:#5b687e; --accent:#2c4fc4; --accent-ink:#ffffff; --focus:#2c4fc4;
    --chart-grid:#e9edf3; --track:#e1e6ee; --scrim:rgba(20,28,42,.42); --shadow:0 12px 30px rgba(20,30,50,.18);
    --pos:#2a78d6; --neg:#e34948; --mid:#e4e7ed; --total:#3a4558;
    --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948;
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#e6eaf0; --dot:rgba(40,62,110,.08); --panel:#ffffff; --panel-2:#f1f4f8; --line:#d4dae4; --line-2:#b4bece;
  --fg:#141c2a; --fg-2:#38445a; --muted:#5b687e; --accent:#2c4fc4; --accent-ink:#ffffff; --focus:#2c4fc4;
  --chart-grid:#e9edf3; --track:#e1e6ee; --scrim:rgba(20,28,42,.42); --shadow:0 12px 30px rgba(20,30,50,.18);
  --pos:#2a78d6; --neg:#e34948; --mid:#e4e7ed; --total:#3a4558;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:18px 18px;color:var(--fg);font:13px/1.4 var(--font-sans);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:1720px;margin:0 auto;padding-inline:20px;padding-block:0 40px}

/* ---------- top ---------- */
.top{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding-block:12px 8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand b{font:600 16px var(--font-sans);letter-spacing:-.01em}
.brand span{font:500 12px var(--font-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:12px var(--font-mono);color:var(--fg-2)}
.top .actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{height:28px;padding:0 10px;border:1px solid var(--line-2);background:var(--panel);color:var(--fg);border-radius:3px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font:500 12px var(--font-sans);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary,.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.armed{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 18%,var(--panel))}
.btn svg{flex:none}

/* ---------- dock: tabs + edit bar + filter ---------- */
.dock{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-20px;padding-inline:20px}
.tabsrow{display:flex;align-items:flex-end;gap:8px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:thin}
.tab{flex:none;border:0;background:transparent;color:var(--fg-2);padding:9px 14px 8px;border-bottom:2px solid transparent;cursor:pointer;font:500 13px var(--font-sans);display:inline-flex;gap:7px;align-items:baseline;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .cnt{font:11px var(--font-mono);color:var(--muted)}
.tab.add{color:var(--muted)}
.tabsrow .reset{flex:none;margin-bottom:5px}
.editbar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-top:8px;padding:7px 10px;border:1px dashed var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--bg));border-radius:3px}
.editbar label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-2)}
.editbar input{height:28px;width:220px;max-width:100%}
.editbar .hint{font-size:12px;color:var(--fg-2);flex:1 1 220px;min-width:0}
.filterbar{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;min-height:36px;padding-block:6px}
.filterbar .lbl{font:500 10.5px var(--font-cond);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.filterbar .hint{font-size:12px;color:var(--muted)}
.fchip{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 8px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--fg);border-radius:2px;cursor:pointer;font-size:12px}
.fchip small{color:var(--fg-2);font-size:11px}
.fchip .x{font:12px var(--font-mono);color:var(--fg-2)}
.fchip:hover .x{color:var(--fg)}
.linkbtn{border:0;background:none;color:var(--fg-2);text-decoration:underline dotted;cursor:pointer;font-size:12px;padding:0 2px}

/* ---------- grid ---------- */
.grid{position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:var(--row);gap:var(--gap);margin-top:4px}
.guides{position:absolute;inset:0;display:none;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap);pointer-events:none;z-index:0}
.editing .guides{display:grid}
.guides span{background:color-mix(in srgb,var(--accent) 5%,transparent);border-inline:1px dashed color-mix(in srgb,var(--accent) 28%,transparent)}
.wg{grid-column:span var(--w);grid-row:span var(--h);position:relative;z-index:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.editing .wg{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.wg.dragging{opacity:.38;outline:2px dashed var(--accent);outline-offset:-2px}
.wg.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.wg-h{display:flex;align-items:center;gap:8px;height:32px;flex:none;padding:0 4px 0 10px;border-bottom:1px solid var(--line)}
.wg-t{font:600 12px var(--font-cond);letter-spacing:.04em;text-transform:uppercase;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.wg-s{font:11px var(--font-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 0}
.wg-tools{display:flex;gap:2px;flex:none}
.ib{width:26px;height:26px;border:1px solid transparent;background:transparent;color:var(--fg-2);border-radius:2px;cursor:pointer;display:inline-grid;place-items:center;padding:0}
.ib:hover{background:var(--panel-2);border-color:var(--line-2);color:var(--fg)}
.handle{cursor:grab;touch-action:none;margin-left:-6px}
.handle:active{cursor:grabbing}
.app:not(.editing) .edit-only{display:none!important}
.wg-b{flex:1;min-height:0;position:relative;container-type:inline-size}
.editing .wg-b{margin-bottom:31px}
.editing .wg[data-h="1"] .kpi-s,.editing .wg[data-h="1"] .kpi-x{display:none}
.wg-e{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:5px 6px;background:color-mix(in srgb,var(--panel-2) 95%,transparent);border-top:1px dashed var(--line-2)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:2px;overflow:hidden}
.seg button{font:500 10.5px var(--font-mono);padding:2px 6px;border:0;background:transparent;color:var(--fg-2);cursor:pointer;min-width:22px}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.wg-e .lab{font:10px var(--font-cond);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dragghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;background:var(--panel-2);border:1px solid var(--accent);box-shadow:var(--shadow);opacity:.94;padding:9px 12px;font:600 12px var(--font-cond);letter-spacing:.04em;text-transform:uppercase;border-radius:3px}
.dragghost small{display:block;font:11px var(--font-mono);color:var(--muted);text-transform:none;letter-spacing:0;margin-top:4px}
.empty-board{grid-column:1/-1;grid-row:span 2;display:grid;place-content:center;justify-items:center;gap:10px;border:1px dashed var(--line-2);border-radius:3px;color:var(--fg-2);text-align:center;padding:16px;z-index:1;background:color-mix(in srgb,var(--panel) 60%,transparent)}
.empty{position:absolute;inset:0;display:grid;place-content:center;color:var(--muted);font-size:12px;text-align:center;padding:10px}

/* chart hosts */
.ch{position:absolute;inset:4px 6px 4px 4px}
.col{position:absolute;inset:0;display:flex;flex-direction:column}
.chf{flex:1;min-height:0;position:relative}
.foot{flex:none;padding:4px 10px 6px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--fg-2)}
.foot .sw{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.foot i{width:9px;height:9px;display:inline-block;flex:none}
.foot b{font:500 11.5px var(--font-mono);color:var(--fg)}

/* KPI */
.kpi{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,44%);grid-template-rows:auto auto 1fr auto;grid-template-areas:"v sp" "s sp" "x sp" "l l";gap:2px 10px;padding:8px 10px 9px}
.kpi.nosp{grid-template-columns:minmax(0,1fr);grid-template-areas:"v" "s" "x" "l"}
.kpi-v{grid-area:v;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;min-width:0}
.kpi-v .num{font:500 25px/1.05 var(--font-mono);letter-spacing:-.02em;white-space:nowrap}
.kpi-v .u{font-size:11px;color:var(--muted);white-space:nowrap}
.kpi-s{grid-area:s;font:11px var(--font-mono);color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-sp{grid-area:sp;position:relative;min-height:0}
.kpi-x{grid-area:x;align-self:end;display:flex;flex-wrap:wrap;gap:0 10px;font:10.5px var(--font-mono);color:var(--muted);min-width:0}
.kpi-x b{font-weight:500;color:var(--fg-2)}
.kpi-l{grid-area:l;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi-l .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font:10.5px var(--font-mono);color:var(--fg-2);white-space:nowrap;min-width:0}
.kpi-l .row span:first-child{overflow:hidden;text-overflow:ellipsis}
@container (max-width:250px){.kpi-v .num{font-size:21px}.kpi{grid-template-columns:minmax(0,1fr) 34%}}
.st{--s:var(--ok);display:inline-flex;align-items:center;gap:4px;font:500 10.5px var(--font-sans);padding:1px 6px 1px 4px;border-radius:2px;color:var(--fg);background:color-mix(in srgb,var(--s) 17%,transparent);white-space:nowrap;line-height:16px}
.st b{color:var(--s);font-weight:700;width:11px;text-align:center}
.st-ok{--s:var(--ok)}.st-warn{--s:var(--warn)}.st-serious{--s:var(--serious)}.st-crit{--s:var(--crit)}
.s-ok{--s:var(--ok)}.s-warn{--s:var(--warn)}.s-serious{--s:var(--serious)}.s-crit{--s:var(--crit)}

/* tables */
.tw{position:absolute;inset:0;overflow:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{position:sticky;top:0;z-index:1;background:var(--panel);font:500 10.5px var(--font-sans);color:var(--muted);text-align:left;padding:6px 8px 5px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl th.n{text-align:right}
.tbl td{padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:hover td{background:var(--panel-2)}
.tbl .n{text-align:right;font:11.5px var(--font-mono)}
.tbl .m{color:var(--muted);font-size:11px}
.tbl .grp td{font:600 10px var(--font-cond);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--panel);padding-top:8px}
.tbl .dim td{opacity:.4}
.tbl .n.neg{color:var(--neg)}.tbl tr.sel td{background:var(--panel-2);box-shadow:inset 0 -1px 0 var(--accent)}.tbl tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent),inset 0 -1px 0 var(--accent)}
.sortb{all:unset;cursor:pointer;display:inline-flex;gap:3px;align-items:center}
.sortb:hover{color:var(--fg)}
.sortb:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.xf{all:unset;cursor:pointer;color:var(--fg);border-bottom:1px dotted var(--muted)}
.xf:hover{color:var(--accent);border-bottom-color:var(--accent)}
.xf:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.tag{display:inline-block;font:500 9.5px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;padding:0 4px;border-radius:2px;border:1px solid var(--line-2);color:var(--fg-2);margin-left:6px;vertical-align:1px}
.tag.brk{border-color:var(--warn);color:var(--fg)}
/* PnL не посчитан (R10): прочерк с причиной в подсказке; «частично: N из M позиций» */
.na{color:var(--muted);cursor:help;text-decoration:underline dotted;text-underline-offset:3px}
.part{font:10.5px var(--font-sans);color:var(--fg-2);border:1px dashed var(--warn);border-radius:2px;padding:0 5px;cursor:help;white-space:nowrap}

/* tooltips (ECharts html) */
.ttr{display:flex;align-items:center;gap:6px;font-size:12px;line-height:18px}
.ttr i{width:8px;height:8px;display:inline-block;flex:none}
.ttr b{margin-left:auto;padding-left:14px;font:500 12px var(--font-mono)}
.tth{font:600 11px var(--font-cond);letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px}
.ttn{font-size:11px;opacity:.8;max-width:280px;white-space:normal;margin-top:4px}

/* overlay: gallery + drawer */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 24px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line-2);width:min(1040px,100%);box-shadow:var(--shadow);border-radius:4px}
.mh{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font:600 15px var(--font-sans)}
.mh p{margin:0;color:var(--muted);font-size:12px;flex:1}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;padding:14px}
.gcard{text-align:left;display:grid;grid-template-columns:46px minmax(0,1fr);gap:3px 12px;padding:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);border-radius:3px;cursor:pointer}
.gcard:hover{border-color:var(--accent)}
.gcard svg{grid-row:span 3;color:var(--accent);width:46px;height:34px}
.gcard b{font:600 12.5px var(--font-sans)}
.gcard span{font-size:11.5px;color:var(--fg-2);line-height:1.35}
.gcard small{font:10.5px var(--font-mono);color:var(--muted)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(370px,100%);z-index:45;background:var(--panel);border-left:1px solid var(--line-2);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer .mh h2{font-size:14px}
.dbody{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>label,.fld>.fl{font:500 10.5px var(--font-cond);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fld .help{font-size:11px;color:var(--muted)}
select,input[type="text"],input[type="search"]{font:13px var(--font-sans);background:var(--panel-2);color:var(--fg);border:1px solid var(--line-2);border-radius:3px;height:30px;padding:0 8px;width:100%}
.chk{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:3px;max-height:320px;overflow:auto;padding:3px}
.chk label{display:flex;gap:8px;align-items:center;padding:3px 5px;font-size:12px;cursor:pointer;border-radius:2px}
.chk label:hover{background:var(--panel-2)}
.chk .h{font:600 10px var(--font-cond);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:6px 5px 2px}
input[type="checkbox"]{accent-color:var(--accent);margin:0}
.dfoot{padding:10px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--panel-2);border:1px solid var(--line-2);box-shadow:var(--shadow);padding:8px 10px 8px 14px;border-radius:3px;display:flex;gap:12px;align-items:center;font-size:12.5px;max-width:calc(100vw - 32px)}

@media (max-width:1100px){
  .grid{grid-template-columns:repeat(6,minmax(0,1fr))}
  .wg[data-w="3"],.wg[data-w="4"]{grid-column:span 3}
  .wg[data-w="6"],.wg[data-w="8"],.wg[data-w="12"]{grid-column:span 6}
  .guides{grid-template-columns:repeat(6,minmax(0,1fr))}
  .guides span:nth-child(n+7){display:none}
}
@media (max-width:640px){
  .app{padding-inline:16px}
  .dock{position:static;margin-inline:-16px;padding-inline:16px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .wg[data-w]{grid-column:1/-1}
  .editing .guides{display:none}
  .top .actions{margin-left:0}
  .tabsrow{flex-wrap:wrap}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="11" height="7" fill="var(--accent)"/><rect x="14" y="1" width="11" height="7" fill="none" stroke="var(--fg-2)" stroke-width="1.2"/><rect x="1" y="10" width="7" height="15" fill="none" stroke="var(--fg-2)" stroke-width="1.2"/><rect x="10" y="10" width="15" height="15" fill="none" stroke="var(--fg-2)" stroke-width="1.2"/></svg>
      <b>Widget Board</b><span>FI-деск</span>
    </div>
    <div class="meta"><span id="asof"></span></div>

/* ---------------- scoping ---------------- */
const on = v => v && v !== 'all';
function ccyMatch(x, c) { if (!on(c)) return true; return c === 'nonRUB' ? x.ccy !== 'RUB' : x.ccy === c; }
function scope(cfg) {
  cfg = cfg || {}; const f = bf();
  return D.positions.filter(p => (!f.book || p.book === f.book) && (!f.issuer || p.issuerGroup === f.issuer) && (!f.ccy || p.ccy === f.ccy) &&
    (!on(cfg.book) || p.book === cfg.book) && (!on(cfg.segment) || p.segment === cfg.segment) && ccyMatch(p, cfg.ccy));
}
function fscope(cfg) {
  cfg = cfg || {}; const f = bf();
  if (f.issuer) return [];
  if (on(cfg.segment)) return [];
  return D.funding.filter(x => (!f.book || x.book === f.book) && (!f.ccy || x.ccy === f.ccy) && (!on(cfg.book) || x.book === cfg.book) && ccyMatch(x, cfg.ccy));
}
const effBook = cfg => bf().book || (on(cfg.book) ? cfg.book : null);
const anyBoardFilter = () => Object.keys(bf()).length > 0;
const isFiltered = cfg => anyBoardFilter() || on(cfg.book) || on(cfg.segment) || on(cfg.ccy);
function tags(cfg) {
  const t = [];
  if (on(cfg.book)) t.push(D.BOOKS[cfg.book].name);
  if (on(cfg.segment)) t.push(cfg.segment);
  if (on(cfg.ccy)) t.push(cfg.ccy === 'nonRUB' ? 'валютные' : cfg.ccy);
  return t;
}
function ocpParts(l, fl, c) {
  const g = t => sum(l.filter(p => p.instrType === t && !p.ocpTransfer), p => p.fxDelta[c] || 0);
  return { bonds: g('BOND'), derivs: g('XCCY'), fx: g('FX') + sum(l.filter(p => p.ocpTransfer), p => p.fxDelta[c] || 0), funding: sum(fl, f => f.fxDelta[c] || 0) };
}
function issuerExposure(l, measure) {
  const m = {};

    if (!p.issuerGroup) return;
    let v;
    if (measure === 'jtd') v = p.jtd; else if (measure === 'cs01') v = p.cs01;
    else v = p.instrType === 'CDS' ? (p.side === 'SELL' ? 1 : -1) * p.notional : p.mvRub;
    m[p.issuerGroup] = (m[p.issuerGroup] || 0) + v;

}
// фондирование уровня книги в фильтре: кэрри остатков ДС и РЕПО + их FX-переоценка.
// Фондирование облигаций уже в PnL самих бумаг (компоненты funding и fx).
function fundPnl(cfg) {
  const fl = fscope(cfg).filter(f => !f.pnl.inPosition), carry = sum(fl, f => f.pnl.carry);
  let fx = 0;
  if (!bf().issuer && !bf().ccy && !on(cfg.segment) && !on(cfg.ccy)) {
    const b = effBook(cfg);
    fx = sum(b ? [b] : BK, k => (D.fundingPnlByBook[k] && D.fundingPnlByBook[k].fx) || 0);
  }
  return { carry, fx, total: carry + fx };
}

const hv = (x, k = 1) => x == null || !isFinite(x) ? null : x / k;

      } else {
        const v = U.pnlSum(l, p => p.pnl.explained) + fund;
        const off = offReady() ? U.pnlSum(l, p => p.pnl.official || 0) + fund : null, un = offReady() ? U.pnlSum(l, p => p.pnl.unexplained) : null;
        val = mln(v, 1, true); unit = 'млн ₽ · флэш';
        sub = (pc.partial ? U.pnlPartHtml(pc) + ' ' : '') + `фондирование ${mln(U.pnlSum(l, p => p.pnl.funding || 0) + fund, 1, true)} млн` + (bf().issuer ? ' (книжное не учтено)' : '');
        extra = off == null ? `<span title="${esc(OFF_WAIT)}">офиц. (ЦБ) <b>—</b> ожидается T+1</span>`
          : `<span>офиц. (ЦБ) <b>${mln(off, 1, true)}</b></span><span>необъясн. <b>${mln(un, 1, true)}</b></span>`;
      }
      if (!filt) { sp = H.map(h => hv(h.pnlOfficial)); spKind = 'bar'; spFmt = x => x == null ? 'PnL не посчитан' : mln(x, 1, true) + ' млн ₽'; }
      else extra += '<span>история — по деску</span>';
    } else if (m === 'mv') {
      const v = sum(l, p => p.mvRub), g = sum(l, p => Math.abs(p.mvRub));
      val = bln(v, 1, true); unit = 'млрд ₽'; sub = `брутто ${bln(g, 1)} млрд · ${l.length} поз.`;
      const bySeg = U.groupBy(l, 'segment');
      extra = SEGS.filter(s => bySeg[s]).map(s => `<span>${s} <b>${pct(sum(bySeg[s], p => Math.abs(p.mvRub)) / (g || 1))}</b></span>`).join('');
    }
    if (!l.length) { b.innerHTML = '<div class="empty">Нет позиций под фильтр</div>'; return 'нет данных'; }
    b.innerHTML = `<div class="kpi${sp ? '' : ' nosp'}"><div class="kpi-v"><span class="num">${val}</span><span class="u">${unit}</span></div>
      <div class="kpi-s">${sub}</div>${sp ? '<div class="kpi-sp"></div>' : ''}<div class="kpi-x">${extra}</div></div>`;
    if (sp) sparkline(b.querySelector('.kpi-sp'), w.id, sp, spKind, spFmt);
    return tags(cfg).join(' · ') || (anyBoardFilter() ? 'фильтр доски' : 'деск');
  }
};
function sparkline(el, wid, data, kind, fmt) {
  const dates = H.map(h => ddmm(h.date)), last = data.length - 1;
  mk(el, wid, base({
    grid: { left: 2, right: 6, top: 6, bottom: 4, containLabel: false },
    tooltip: axisTT({ axisPointer: { type: kind === 'bar' ? 'shadow' : 'line', lineStyle: { color: TK.line2 } }, formatter: ps => `<div class="tth">${ps[0].axisValue}</div><b style="font-family:${TK.mono}">${fmt(ps[0].value)}</b>` }),
    xAxis: { type: 'category', data: dates, show: false, boundaryGap: kind === 'bar' },
    yAxis: { type: 'value', show: false, scale: kind !== 'bar' },
    series: [kind === 'bar'
      ? { type: 'bar', data: data.map(v => ({ value: v, itemStyle: { color: v == null ? TK.muted : signCol(v), opacity: .85 } })), barWidth: '62%' }
      : { type: 'line', data, showSymbol: false, symbol: 'circle', lineStyle: { width: 1.5, color: TK.accent }, itemStyle: { color: TK.accent },
          areaStyle: { color: TK.accent, opacity: .1 },

  }));
}

/* ---- scenario impact ---- */
function scenarioByBook(sc, l, fl) {
  const r = U.runScenario(sc, l), byId = new Map(l.map(p => [p.id, p])), agg = {};
  r.byPosition.forEach(x => { const bk = byId.get(x.id).book; agg[bk] = (agg[bk] || 0) + x.total; });
  // нераспределённый FX-остаток фондирования — только если фильтр не режет по эмитенту/сегменту/валюте
  if (fl.length && !bf().ccy) Object.entries(r.fundingFxByBook || {}).forEach(([bk, v]) => { if (fl.some(f => f.book === bk)) agg[bk] = (agg[bk] || 0) + v; });
  return agg;
}

  const title = (w.cfg.title && w.cfg.title.trim()) || t.title(w.cfg);

  el.setAttribute('aria-label', title);
  let sub = '';
  try { sub = t.render(body, w.cfg, w) || ''; } catch (err) { console.error(err); body.innerHTML = `<div class="empty">Не удалось построить виджет: ${esc(err.message)}</div>`; }
  const s = el.querySelector('.wg-s'); s.textContent = sub; s.title = sub;
}
function renderBodies() { board().widgets.forEach(renderWidget); }
function renderBoard() {
  [...charts.keys()].forEach(disposeW);
  grid.innerHTML = '<div class="guides" aria-hidden="true">' + '<span></span>'.repeat(12) + '</div>';
  const b = board();
  if (!b.widgets.length) {
    const e = document.createElement('div'); e.className = 'empty-board';
    e.innerHTML = `<b>На доске «${esc(b.name)}» пока нет виджетов</b><span>Соберите её из галереи: KPI, лестницы DV01, сценарии, блоттер и другие.</span><button class="btn primary" type="button" data-act="gallery">+ Виджет</button>`;
    grid.appendChild(e);
  }
  b.widgets.forEach(w => grid.appendChild(buildWidget(w)));
  renderBodies();
  $('#boardName').value = b.name;
}
function renderTabs() {
  const t = $('#tabs');
  t.innerHTML = state.boards.map(b => `<button class="tab" role="tab" type="button" data-board="${esc(b.id)}" aria-selected="${b.id === state.active}">${esc(b.name)}<span class="cnt">${b.widgets.length}</span></button>`).join('') +
    '<button class="tab add" type="button" id="addBoard">+ Доска</button>';
}
function renderFilterBar() {
  const f = bf(), keys = Object.keys(f), fb = $('#filterbar');
  fb.innerHTML = '<span class="lbl">Фильтр доски</span>' + (keys.length
    ? keys.map(k => `<button class="fchip" type="button" data-clear="${k}" title="Снять фильтр"><small>${DIM_LABEL[k]}</small>${esc(dimValLabel(k, f[k]))}<span class="x" aria-hidden="true">✕</span></button>`).join('') + (keys.length > 1 ? '<button class="linkbtn" type="button" data-clear="*">снять все</button>' : '')
    : '<span class="hint">нет — кликните книгу, эмитента или валюту в любом виджете, чтобы отфильтровать всю доску</span>');
}
function switchBoard(id) {
  if (id === state.active) return;
  closeDrawer();
  state.active = id; save(); renderTabs(); renderFilterBar(); renderBoard();
  live('Доска ' + board().name);
}
function setEdit(on) {
  ui.edit = on;
  $('#app').classList.toggle('editing', on);
  const b = $('#editBtn'); b.setAttribute('aria-pressed', String(on));
  b.querySelector('span').textContent = on ? 'Завершить правку' : 'Редактировать доску';
  if (!on) closeDrawer();
  live(on ? 'Режим редактирования доски' : 'Правка завершена');
}

/* ---------- grid interactions ---------- */
grid.addEventListener('click', e => {
  const xf = e.target.closest('[data-xf]');
  if (xf) { setXf(xf.dataset.xf, xf.dataset.v); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'gallery') { openGallery(); return; }
  const el = a.closest('.wg'); if (!el) return;
  const w = board().widgets.find(x => x.id === el.dataset.id); if (!w) return;
  if (act === 'w' || act === 'h') {
    w[act] = +a.dataset.v; el.dataset[act] = w[act]; el.style.setProperty('--' + act, w[act]);
    el.querySelectorAll(`[data-act="${act}"]`).forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.v === w[act])));
    save(); requestAnimationFrame(() => renderWidget(w));
  } else if (act === 'gear') openDrawer(w);
  else if (act === 'remove') removeWidget(w);
});
function removeWidget(w) {
  const b = board(), i = b.widgets.indexOf(w);
  b.widgets.splice(i, 1); disposeW(w.id);
  const el = grid.querySelector(`.wg[data-id="${w.id}"]`); if (el) el.remove();
  if (ui.cfgOpen === w.id) closeDrawer();
  if (!b.widgets.length) renderBoard();
  save(); renderTabs();
  toast(`Виджет «${(w.cfg.title || WT[w.type].title(w.cfg))}» удалён`, 'Вернуть', () => {
    if (!state.boards.includes(b)) return;
    b.widgets.splice(Math.min(i, b.widgets.length), 0, w); save(); renderTabs();
    if (state.active === b.id) renderBoard();
  });
}
function moveBy(id, d) {
  const ws = board().widgets, i = ws.findIndex(x => x.id === id), j = i + d;
  if (j < 0 || j >= ws.length) return;
  const [w] = ws.splice(i, 1); ws.splice(j, 0, w); save();
  const el = grid.querySelector(`.wg[data-id="${id}"]`), sib = grid.querySelector(`.wg[data-id="${ws[d > 0 ? j - 1 : j + 1].id}"]`);
  grid.insertBefore(el, d > 0 ? sib.nextSibling : sib);
  el.querySelector('.handle').focus();
  live(`Виджет перемещён на позицию ${j + 1} из ${ws.length}`);
}

/* ---------- pointer drag & drop ---------- */
let drag = null;
function dragStart(e) {
  if (!ui.edit || e.button !== 0) return;
  const wg = e.currentTarget.closest('.wg'), r = wg.getBoundingClientRect();
  e.preventDefault();
  const g = document.createElement('div'); g.className = 'dragghost';
  g.style.width = Math.min(r.width, 420) + 'px';
  g.innerHTML = `${esc(wg.querySelector('.wg-t').textContent)}<small>${wg.dataset.w} кол. × ${wg.dataset.h} ряд.</small>`;
  document.body.appendChild(g);
  drag = { wg, g, dx: Math.min(e.clientX - r.left, Math.min(r.width, 420) - 20), dy: e.clientY - r.top > 40 ? 16 : e.clientY - r.top, last: 0, handle: e.currentTarget, moved: false };
  wg.classList.add('dragging');
  try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
  // слушаем window: перенос узла в DOM снимает pointer capture с ручки
  window.addEventListener('pointermove', dragMove);
  window.addEventListener('pointerup', dragEnd);
  window.addEventListener('pointercancel', dragEnd);
  placeGhost(e);
}
function placeGhost(e) { drag.g.style.transform = `translate(${e.clientX - drag.dx}px, ${e.clientY - drag.dy}px)`; }
function dragMove(e) {
  if (!drag) return;
  placeGhost(e);
  if (e.clientY < 60) window.scrollBy(0, -16); else if (e.clientY > innerHeight - 50) window.scrollBy(0, 16);
  const now = performance.now(); if (now - drag.last < 110) return;
  const hit = document.elementFromPoint(e.clientX, e.clientY), t = hit && hit.closest('.wg');
  if (!t || t === drag.wg || t.parentNode !== grid) return;
  const r = t.getBoundingClientRect(), before = e.clientX < r.left + r.width / 2;
  if (before ? t.previousElementSibling === drag.wg : t.nextElementSibling === drag.wg) return;
  grid.insertBefore(drag.wg, before ? t : t.nextElementSibling);
  drag.last = now; drag.moved = true;
}
function dragEnd() {
  if (!drag) return;
  const { wg, g, handle, moved } = drag; drag = null;
  window.removeEventListener('pointermove', dragMove); window.removeEventListener('pointerup', dragEnd); window.removeEventListener('pointercancel', dragEnd);
  g.remove(); wg.classList.remove('dragging');
  try { handle.focus({ preventScroll: true }); } catch (_) {}
  if (moved) {
    const order = [...grid.querySelectorAll(':scope > .wg')].map(n => n.dataset.id), b = board();
    b.widgets.sort((a, z) => order.indexOf(a.id) - order.indexOf(z.id)); save();
    live(`Виджет перемещён на позицию ${order.indexOf(wg.dataset.id) + 1}`);
  }
}

/* ---------- gallery ---------- */
let overlay = null;
function openGallery() {
  closeGallery();
  overlay = document.createElement('div'); overlay.className = 'overlay';
  overlay.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="galT"><div class="mh"><h2 id="galT">Галерея виджетов</h2><p>Выберите тип — виджет появится в конце доски «${esc(board().name)}». Настройки — через шестерёнку.</p><button class="ib" type="button" data-close aria-label="Закрыть">${ICON.x}</button></div>
    <div class="gal">${GALLERY_ORDER.map(k => { const t = WT[k]; return `<button class="gcard" type="button" data-type="${k}">${GLY[t.glyph]}<b>${t.name}</b><span>${t.desc}</span><small>по умолчанию ${t.def.w}×${t.def.h}</small></button>`; }).join('')}</div></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => {
    if (e.target === overlay || e.target.closest('[data-close]')) { closeGallery(); return; }
    const c = e.target.closest('[data-type]'); if (!c) return;
    const t = WT[c.dataset.type], w = W(c.dataset.type, t.def.w, t.def.h);
    const b = board(); b.widgets.push(w); save(); closeGallery();
    if (b.widgets.length === 1) renderBoard(); else { grid.appendChild(buildWidget(w)); renderWidget(w); }
    renderTabs();
    const el = grid.querySelector(`.wg[data-id="${w.id}"]`);
    el.classList.add('flash'); el.scrollIntoView({ block: 'nearest', behavior: RM.matches ? 'auto' : 'smooth' });
    setTimeout(() => el.classList.remove('flash'), 1500);
    live(`Добавлен виджет ${t.name}`);
  });
  overlay.querySelector('.gcard').focus();
}
function closeGallery() { if (overlay) { overlay.remove(); overlay = null; $('#addWBtn').focus({ preventScroll: true }); } }

/* ---------- config drawer ---------- */
let drawer = null;
function pickOptions() {
  const groups = [...new Set(D.positions.map(p => p.issuerGroup).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ru'));
  return { groups, positions: D.positions.map(p => p.name) };
}
function openDrawer(w) {
  closeDrawer();
  ui.cfgOpen = w.id;
  const t = WT[w.type];
  drawer = document.createElement('aside'); drawer.className = 'drawer'; drawer.setAttribute('aria-label', 'Настройки виджета');
  const fields = [{ key: 'title', label: 'Заголовок', type: 'text' }].concat(t.fields);
  drawer.innerHTML = `<div class="mh"><h2>${esc(t.name)}</h2><p></p><button class="ib" type="button" data-close aria-label="Закрыть">${ICON.x}</button></div>
    <div class="dbody">${fields.map(f => fieldHtml(f, w)).join('')}<p class="help" style="font-size:11.5px;color:var(--muted);margin:0">Изменения применяются сразу и сохраняются в этом браузере. Фильтры виджета действуют вместе с фильтром доски.</p></div>
    <div class="dfoot"><button class="btn ghost" type="button" data-reset>Настройки по умолчанию</button><button class="btn primary" type="button" data-close>Готово</button></div>`;
  document.body.appendChild(drawer);
  const apply = () => { save(); renderWidget(w); };
  drawer.addEventListener('change', e => {
    const el = e.target, key = el.dataset.key; if (!key) return;
    const f = fields.find(x => x.key === key);
    if (f.type === 'multi' || f.type === 'pick') w.cfg[key] = [...drawer.querySelectorAll(`input[data-key="${key}"]:checked`)].map(x => x.value);
    else w.cfg[key] = el.value;
    apply();
  });
  drawer.addEventListener('input', e => {
    if (e.target.dataset.key === 'title') { w.cfg.title = e.target.value; apply(); }
    if (e.target.dataset.search != null) { const q = e.target.value.trim().toLowerCase(); drawer.querySelectorAll('.chk label').forEach(lb => { lb.hidden = q && !lb.textContent.toLowerCase().includes(q); }); }
  });
  drawer.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) closeDrawer();
    if (e.target.closest('[data-reset]')) { w.cfg = clone(t.def.cfg); apply(); openDrawer(w); }
  });
  const first = drawer.querySelector('.dbody input, .dbody select'); if (first) first.focus();
}
function fieldHtml(f, w) {
  const id = `cfg-${f.key}`, v = w.cfg[f.key];
  if (f.type === 'text') return `<div class="fld"><label for="${id}">${f.label}</label><input type="text" id="${id}" data-key="${f.key}" value="${esc(v || '')}" placeholder="${esc(WT[w.type].title(w.cfg))}"></div>`;
  if (f.type === 'select') return `<div class="fld"><label for="${id}">${f.label}</label><select id="${id}" data-key="${f.key}">${f.opts().map(([k, n]) => `<option value="${esc(k)}"${String(v) === String(k) ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select></div>`;
  if (f.type === 'multi') return `<div class="fld"><span class="fl">${f.label}</span><div class="chk">${f.opts().map(([k, n], i) => `<label><input type="checkbox" id="${id}-${i}" data-key="${f.key}" value="${esc(k)}"${(v || []).includes(k) ? ' checked' : ''}>${esc(n)}</label>`).join('')}</div></div>`;
  if (f.type === 'pick') { const o = pickOptions(), sel = new Set(v || []);
    return `<div class="fld"><label for="${id}-q">${f.label}</label><input type="search" id="${id}-q" data-search placeholder="Поиск эмитента или позиции"><div class="chk"><div class="h">Группы эмитентов</div>${o.groups.map((g, i) => `<label><input type="checkbox" id="${id}-g${i}" data-key="${f.key}" value="g:${esc(g)}"${sel.has('g:' + g) ? ' checked' : ''}>${esc(g)}</label>`).join('')}<div class="h">Позиции</div>${o.positions.map((n, i) => `<label><input type="checkbox" id="${id}-p${i}" data-key="${f.key}" value="p:${esc(n)}"${sel.has('p:' + n) ? ' checked' : ''}>${esc(n)}</label>`).join('')}</div><span class="help">Отмечено: ${sel.size}</span></div>`; }
  return '';
}
function closeDrawer() { if (drawer) { drawer.remove(); drawer = null; ui.cfgOpen = null; } }

/* ---------- toast ---------- */
let toastEl = null, toastT = 0;
function toast(msg, actLabel, act) {
  if (toastEl) toastEl.remove(); clearTimeout(toastT);
  toastEl = document.createElement('div'); toastEl.className = 'toast'; toastEl.setAttribute('role', 'status');
  toastEl.innerHTML = `<span>${esc(msg)}</span>${actLabel ? `<button class="btn" type="button">${esc(actLabel)}</button>` : ''}`;
  document.body.appendChild(toastEl);
  if (actLabel) toastEl.querySelector('button').addEventListener('click', () => { act(); toastEl.remove(); toastEl = null; });
  toastT = setTimeout(() => { if (toastEl) { toastEl.remove(); toastEl = null; } }, 6500);
}

/* ---------- two-step confirm buttons ---------- */
function armed(btn, label, armedLabel, fn) {
  let t = 0;
  btn.addEventListener('click', () => {
    if (btn.classList.contains('armed')) { clearTimeout(t); btn.classList.remove('armed'); btn.textContent = label; fn(); return; }
    btn.classList.add('armed'); btn.textContent = armedLabel;
    t = setTimeout(() => { btn.classList.remove('armed'); btn.textContent = label; }, 4000);
  });
}

/* ---------- chrome wiring ---------- */
$('#tabs').addEventListener('click', e => {
  if (e.target.closest('#addBoard')) {
    const id = 'b' + Date.now().toString(36);
    state.boards.push({ id, name: 'Новая доска ' + (state.boards.length + 1), widgets: [] });
    switchBoard(id); setEdit(true);
    const inp = $('#boardName'); inp.focus(); inp.select();
    return;
  }
  const t = e.target.closest('[data-board]'); if (t) switchBoard(t.dataset.board);
});
$('#tabs').addEventListener('keydown', e => {
  const d = { ArrowLeft: -1, ArrowRight: 1 }[e.key]; if (!d || !e.target.dataset.board) return;
  const i = state.boards.findIndex(b => b.id === e.target.dataset.board), n = state.boards[(i + d + state.boards.length) % state.boards.length];
  switchBoard(n.id); $(`#tabs [data-board="${n.id}"]`).focus();
});
$('#filterbar').addEventListener('click', e => {
  const c = e.target.closest('[data-clear]'); if (!c) return;
  const f = bf();
  if (c.dataset.clear === '*') Object.keys(f).forEach(k => delete f[k]); else delete f[c.dataset.clear];
  renderFilterBar(); renderBodies(); live('Фильтр снят');
});
$('#editBtn').addEventListener('click', () => setEdit(!ui.edit));
$('#doneBtn').addEventListener('click', () => setEdit(false));
$('#addWBtn').addEventListener('click', openGallery);
$('#boardName').addEventListener('input', e => { board().name = e.target.value.trim() || 'Без названия'; save(); renderTabs(); });
armed($('#delBoardBtn'), 'Удалить доску', 'Нажмите ещё раз — удалить', () => {
  if (state.boards.length < 2) { toast('Нельзя удалить единственную доску'); return; }
  const b = board(); state.boards = state.boards.filter(x => x !== b); delete filters[b.id];
  state.active = state.boards[0].id; save(); renderTabs(); renderFilterBar(); renderBoard();
  toast(`Доска «${b.name}» удалена`);
});
armed($('#resetBtn'), 'Сбросить к стандартным', 'Подтвердить сброс досок', () => {
  closeDrawer(); state = defaults(); Object.keys(filters).forEach(k => delete filters[k]);
  try { localStorage.removeItem(LS); } catch (e) {}
  renderTabs(); renderFilterBar(); renderBoard(); toast('Доски сброшены к стандартному набору');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (overlay) closeGallery(); else if (drawer) closeDrawer(); } });

/* ---------- theme ---------- */
function applyThemePref() { try { const t = localStorage.getItem(LS_THEME); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {} }
$('#themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem(LS_THEME, next); } catch (e) {}
});
let themeT = 0;
const rethemeSoon = () => { clearTimeout(themeT); themeT = setTimeout(() => { readTK(); renderBodies(); }, 30); };
new MutationObserver(rethemeSoon).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
const mq = matchMedia('(prefers-color-scheme: dark)');
if (mq.addEventListener) mq.addEventListener('change', rethemeSoon); else if (mq.addListener) mq.addListener(rethemeSoon);

/* ---------- boot ---------- */
applyThemePref();
readTK();
state = load();
renderTabs(); renderFilterBar(); renderBoard();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { readTK(); renderBodies(); });
})();
</script>
