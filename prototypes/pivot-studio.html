<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Risk Pivot Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --font-ui: "Onest", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#f7f8fa; --surface-3:#eceff4;
  --line:#e0e4eb; --line-strong:#c8cfda; --grid:#eceff3;
  --text:#141c28; --text-2:#465265; --muted:#717c8e;
  --accent:#24459e; --accent-hover:#1b3780; --accent-soft:#e7ecf8; --accent-line:#b9c6e8; --on-accent:#ffffff;
  --focus:#2f5bd3;
  --div-neg:#d03b3b; --div-mid:#eceef1; --div-pos:#2a78d6; --seq:#24459e;
  --cat1:#2a78d6; --cat2:#eb6834; --cat3:#1baf7a; --cat4:#eda100; --cat5:#e87ba4; --cat6:#008300; --cat7:#6250d6; --cat8:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --badge-bg:#fff4dc; --badge-text:#7a5200; --badge-line:#f0d394;
  --scrim:rgba(16,22,32,.28);
  --shadow:0 10px 40px rgba(16,24,40,.16), 0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0c1118; --surface:#131922; --surface-2:#171e29; --surface-3:#1f2734;
    --line:#252f3d; --line-strong:#344152; --grid:#1e2632;
    --text:#e3e8ef; --text-2:#aab4c3; --muted:#7e8a9c;
    --accent:#8ea8f2; --accent-hover:#a8bdf6; --accent-soft:#1b2744; --accent-line:#34497e; --on-accent:#0c1118;
    --focus:#8ea8f2;
    --div-neg:#e66767; --div-mid:#262d38; --div-pos:#3987e5; --seq:#5577d8;
    --cat1:#3987e5; --cat2:#d95926; --cat3:#199e70; --cat4:#c98500; --cat5:#d55181; --cat6:#008300; --cat7:#9085e9; --cat8:#e66767;
    --badge-bg:#33280f; --badge-text:#f1c96b; --badge-line:#5a4618;
    --scrim:rgba(0,0,0,.5);
    --shadow:0 10px 40px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0c1118; --surface:#131922; --surface-2:#171e29; --surface-3:#1f2734;
  --line:#252f3d; --line-strong:#344152; --grid:#1e2632;
  --text:#e3e8ef; --text-2:#aab4c3; --muted:#7e8a9c;
  --accent:#8ea8f2; --accent-hover:#a8bdf6; --accent-soft:#1b2744; --accent-line:#34497e; --on-accent:#0c1118;
  --focus:#8ea8f2;
  --div-neg:#e66767; --div-mid:#262d38; --div-pos:#3987e5; --seq:#5577d8;
  --cat1:#3987e5; --cat2:#d95926; --cat3:#199e70; --cat4:#c98500; --cat5:#d55181; --cat6:#008300; --cat7:#9085e9; --cat8:#e66767;
  --badge-bg:#33280f; --badge-text:#f1c96b; --badge-line:#5a4618;
  --scrim:rgba(0,0,0,.5);
  --shadow:0 10px 40px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-radius:3px}
.num,.mono{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:18px;height:52px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand-mark{width:22px;height:22px;color:var(--accent)}
.brand-mark svg{width:22px;height:22px;display:block}
.test-badge{font-size:11px;font-weight:500;padding:2px 7px;border-radius:3px;background:var(--badge-bg);color:var(--badge-text);border:1px solid var(--badge-line);white-space:nowrap}
.asof{color:var(--muted);white-space:nowrap}
.kpis{display:flex;gap:22px;margin-left:auto;align-items:center}
.kpi{display:flex;flex-direction:column;line-height:1.15}
.kpi span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-weight:500;font-size:13px}
.kpi small{color:var(--muted);font-family:var(--font-ui);font-size:11px;font-weight:400}
.theme-btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);color:var(--text-2);font-size:12px;white-space:nowrap}
.theme-btn:hover{color:var(--text);border-color:var(--muted)}

/* ---------- tabs ---------- */
.tabs{display:flex;align-items:stretch;gap:2px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tab{display:flex;align-items:center;position:relative;flex:none}
.tab-btn{display:flex;align-items:center;gap:7px;height:40px;padding:0 10px;border:0;background:none;color:var(--text-2);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab-btn svg{width:14px;height:14px;color:var(--muted)}
.tab-btn:hover{color:var(--text)}
.tab.active .tab-btn{color:var(--text);border-bottom-color:var(--accent)}
.tab.active .tab-btn svg{color:var(--accent)}
.tab-tools{display:flex;gap:1px;padding-right:4px}
.ib{display:inline-grid;place-items:center;width:24px;height:24px;border:0;border-radius:3px;background:none;color:var(--muted)}
.ib:hover:not(:disabled){background:var(--surface-3);color:var(--text)}
.ib:disabled{opacity:.35;cursor:default}
.ib svg{width:14px;height:14px}
.tab.editing{padding:6px 4px}
.tab-input{height:28px;width:220px;max-width:60vw;padding:0 8px;border:1px solid var(--accent);border-radius:4px;background:var(--surface);font-weight:500}
.tab-new,.tab-restore{display:flex;align-items:center;gap:6px;flex:none;height:40px;padding:0 10px;border:0;background:none;color:var(--accent);font-weight:500;white-space:nowrap}
.tab-new:hover,.tab-restore:hover{color:var(--accent-hover)}
.tab-restore{color:var(--muted);font-weight:400}
.tabs-sp{flex:1 0 12px}

/* ---------- workspace ---------- */
.work{display:grid;grid-template-columns:304px minmax(0,1fr);align-items:start}
.builder{position:sticky;top:0;max-height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:6px 16px 24px;scrollbar-width:thin;min-height:calc(100vh - 94px)}
.b-sec{padding:12px 0;border-bottom:1px solid var(--line)}
.b-sec:last-child{border-bottom:0}
.b-h{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.b-h .lnk{text-transform:none;letter-spacing:0;font-weight:500}
.lnk{border:0;background:none;padding:0;color:var(--accent);font-size:12px}
.lnk:hover{text-decoration:underline}
.slot{display:grid;grid-template-columns:18px minmax(0,1fr) 26px;gap:6px;align-items:center;margin-bottom:6px}
.slot-n{font-family:var(--font-num);font-size:11px;color:var(--muted);text-align:center}
.slot.one{grid-template-columns:minmax(0,1fr)}
.sel{position:relative;display:block;min-width:0}
.sel select{appearance:none;-webkit-appearance:none;width:100%;height:30px;padding:0 26px 0 9px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;text-overflow:ellipsis}
.sel select:hover{border-color:var(--muted)}
.sel::after{content:"";position:absolute;right:10px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel.sm select{height:26px;font-size:12px}
.f-grp{margin-bottom:10px}
.f-grp:last-child{margin-bottom:0}
.f-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:5px;font-size:12px;color:var(--text-2)}
.f-top em{font-style:normal;color:var(--muted);font-size:11px}
.f-grp.off{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{height:24px;padding:0 8px;border:1px solid var(--line-strong);border-radius:3px;background:var(--surface);color:var(--text-2);font-size:12px;white-space:nowrap}
.chip:hover:not(:disabled){border-color:var(--muted);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:500}
.chip:disabled{cursor:default}
.viz-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.viz-b{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px 6px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);color:var(--text-2);font-size:10.5px;line-height:1.15;text-align:center}
.viz-b svg{width:18px;height:18px}
.viz-b:hover{border-color:var(--muted);color:var(--text)}
.viz-b[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:500}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:30px}
.opt>span{color:var(--text-2)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden}
.seg button{height:26px;padding:0 10px;white-space:nowrap;border:0;background:var(--surface);color:var(--text-2);font-size:12px}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:500}
.seg button:disabled{opacity:.45;cursor:default}
.sw{position:relative;width:32px;height:18px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:9px;background:var(--line-strong);transition:background .15s;pointer-events:none}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{transform:translateX(14px)}
.sw input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.b-foot{padding-top:12px;color:var(--muted);font-size:11.5px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.b-note{font-size:11.5px;color:var(--muted);margin-top:6px}

main{min-width:0;padding:16px 20px 48px}
.crumbbar{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.bt-toggle{display:none;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);color:var(--text);font-weight:500}
.crumb{flex:1 1 380px;min-width:0;font-size:14px;color:var(--text-2);line-height:1.5}
.crumb b{color:var(--text);font-weight:600}
.crumb .sep{color:var(--line-strong);margin:0 6px}
.crumb .u{color:var(--text);font-weight:500}
.grand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.grand span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.grand b{font-size:20px;font-weight:500;letter-spacing:-.01em}
.grand small{color:var(--muted);font-size:12px}
.hints{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.hint{display:flex;gap:7px;align-items:flex-start;font-size:12px;color:var(--text-2);padding:6px 10px;background:var(--surface-2);border:1px solid var(--line);border-left:2px solid var(--accent-line);border-radius:0 3px 3px 0}
.hint svg{width:14px;height:14px;margin-top:1px;color:var(--accent);flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;margin-bottom:14px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 14px;border-bottom:1px solid var(--line)}
.card-h h2{margin:0;font-size:12.5px;font-weight:600}
.card-h .meta{color:var(--muted);font-size:12px}
.card-h .r{margin-left:auto;display:flex;gap:10px;align-items:center}
.chart-wrap{padding:8px 10px 6px}
#chart{width:100%;height:380px}
.legend-note{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:11.5px}
.sw-dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* ---------- pivot ---------- */
.pv-wrap{overflow:auto;max-height:72vh;scrollbar-width:thin}
table.pv{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
.pv th,.pv td{padding:0 10px;height:28px;border-bottom:1px solid var(--grid);white-space:nowrap}
.pv thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);color:var(--text-2);font-weight:500;font-size:11.5px;text-align:right;border-bottom:1px solid var(--line-strong);height:32px}
.pv thead th.corner{text-align:left;left:0;z-index:3;color:var(--muted);font-weight:500}
.pv tbody th{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;font-weight:400;max-width:280px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line)}
.pv thead th.corner{border-right:1px solid var(--line)}
.pv td.num{text-align:right;cursor:pointer;color:var(--text)}
.pv td.num:hover{box-shadow:inset 0 0 0 1px var(--accent)}
.pv td.num:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;border-radius:0}
.pv td.empty{color:var(--line-strong);cursor:default;text-align:right}
.pv td.empty:hover{box-shadow:none}
.pv tr.l1 th{font-weight:500}
.pv tr.l1.has-kids th,.pv tr.l1.has-kids td{border-top:1px solid var(--line)}
.pv tr.l2 th{padding-left:34px;color:var(--text-2)}
.pv tr.other th{font-style:italic;color:var(--text-2)}
.pv .tot{font-weight:600;border-left:1px solid var(--line)}
.pv tfoot th,.pv tfoot td{position:sticky;bottom:0;background:var(--surface-2);border-top:1px solid var(--line-strong);border-bottom:0;font-weight:600;height:32px;z-index:1}
.pv tfoot th{left:0;z-index:2;text-align:left;border-right:1px solid var(--line)}
.caret{display:inline-grid;place-items:center;width:18px;height:18px;margin:0 4px 0 -4px;border:0;border-radius:3px;background:none;color:var(--muted);vertical-align:-4px}
.caret:hover{background:var(--surface-3);color:var(--text)}
.caret svg{width:12px;height:12px;transition:transform .12s}
.caret[aria-expanded="true"] svg{transform:rotate(90deg)}
.empty-state{padding:40px 16px;text-align:center;color:var(--muted)}

/* ---------- drill drawer ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(100%);visibility:hidden;transition:transform .2s ease,visibility .2s;z-index:50;display:flex;flex-direction:column}
.drawer.open{transform:none;visibility:visible}
.dr-h{padding:14px 18px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.dr-k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.dr-t{font-size:15px;font-weight:600;margin:2px 0 0;overflow-wrap:anywhere}
.dr-sub{grid-column:1/-1;color:var(--text-2);font-size:12px}
.dr-close{grid-row:1/3;grid-column:2;align-self:start;display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);color:var(--text-2)}
.dr-close:hover{color:var(--text);border-color:var(--muted)}
.dr-stats{display:flex;gap:24px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.dr-stats div{display:flex;flex-direction:column}
.dr-stats span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dr-stats b{font-size:17px;font-weight:500}
.dr-body{overflow:auto;flex:1;min-height:0}
table.dt{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
.dt th,.dt td{padding:6px 10px;border-bottom:1px solid var(--grid);text-align:left;vertical-align:top}
.dt th{position:sticky;top:0;background:var(--surface);z-index:1;border-bottom:1px solid var(--line-strong);padding:0}
.dt th button{display:flex;align-items:center;gap:4px;width:100%;height:32px;padding:0 10px;border:0;background:none;color:var(--text-2);font-size:11.5px;font-weight:500;white-space:nowrap}
.dt th.r button{justify-content:flex-end}
.dt th button:hover{color:var(--text)}
.dt th button .ar{color:var(--accent);font-size:10px}
.dt td.r{text-align:right;white-space:nowrap}
.dt .nm{font-weight:500}
.dt .sb{color:var(--muted);font-size:11px;font-family:var(--font-num)}
.dt tfoot td{position:sticky;bottom:0;background:var(--surface-2);border-top:1px solid var(--line-strong);font-weight:600}
.neg{color:var(--div-neg)}
.dr-foot{padding:10px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;padding:9px 14px;background:var(--text);color:var(--surface);border-radius:4px;box-shadow:var(--shadow);font-size:12.5px;z-index:60;max-width:calc(100vw - 32px)}
.toast[hidden]{display:none}
.toast button{border:0;background:none;color:var(--surface);font-weight:600;text-decoration:underline;padding:0}

@media (max-width:1180px){ .kpi.opt-k{display:none} }
@media (max-width:960px){
  .work{grid-template-columns:minmax(0,1fr)}
  .builder{display:none;position:static;max-height:none;min-height:0;border-right:0;border-bottom:1px solid var(--line)}
  .app.builder-open .builder{display:block}
  .bt-toggle{display:inline-flex}
  .kpis{display:none}
  .theme-btn{margin-left:auto}
}
@media (max-width:600px){
  .top,.tabs,main{padding-left:16px;padding-right:16px}
  .builder{padding-left:16px;padding-right:16px}
  .top{gap:10px;height:auto;min-height:52px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
  .asof{display:none}
  .theme-btn .lbl{display:none}
  .grand b{font-size:17px}
  .tab-restore span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 22 22"><rect x="1.5" y="1.5" width="19" height="19" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M1.5 8h19M8 1.5v19" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="10" width="4" height="4" fill="currentColor"/><rect x="15" y="15" width="4" height="4" fill="currentColor" opacity=".45"/><rect x="15" y="10" width="4" height="4" fill="currentColor" opacity=".7"/></svg></span>Risk Pivot Studio</div>
    <span class="test-badge" title="Все цифры вымышленные">Тестовые данные</span>
    <span class="asof">FI-деск · на <span class="mono" id="asof"></span></span>
    <div class="kpis" id="kpis"></div>
    <button class="theme-btn" id="themeBtn" type="button"></button>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Сохранённые виды"></nav>
  <div class="work">
    <aside class="builder" id="builder" aria-label="Конструктор вида"></aside>
    <main>
      <div class="crumbbar">
        <button class="bt-toggle" id="btToggle" type="button" aria-expanded="false" aria-controls="builder"></button>
        <div class="crumb" id="crumb"></div>
        <div class="grand" id="grand"></div>
      </div>

let renaming = null, toastTimer = null;

    if (renaming === v.id) { h += `<div class="tab active editing" data-id="${v.id}"><input class="tab-input" value="${esc(v.name)}" maxlength="60" aria-label="Название вида"></div>`; return; }

      (act ? `<span class="tab-tools"><button type="button" class="ib" data-act="rename" aria-label="Переименовать вид" title="Переименовать">${ICON.pencil}</button><button type="button" class="ib" data-act="dup" aria-label="Дублировать вид" title="Дублировать">${ICON.copy}</button><button type="button" class="ib" data-act="del" aria-label="Удалить вид" title="Удалить"${views.length < 2 ? ' disabled' : ''}>${ICON.trash}</button></span>` : '') + '</div>';
  });

    `<button type="button" class="tab-restore" data-act="restore" title="Восстановить стандартные виды (свои виды сохранятся)" aria-label="Восстановить стандартные виды">${ICON.restore}<span class="sr">Стандартные виды</span></button>`;
  nav.innerHTML = h;

    const inp = nav.querySelector('.tab-input');
    if (inp) {
      inp.focus(); inp.select();
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); commitRename(inp.value); } else if (e.key === 'Escape') { e.preventDefault(); renaming = null; renderTabs(); focusActiveTab(); } });
      inp.addEventListener('blur', () => { if (renaming) commitRename(inp.value); });
    }
  } else {
    const a = nav.querySelector('.tab.active');
    if (a && a.scrollIntoView && nav.scrollWidth > nav.clientWidth) { const l = a.offsetLeft, r = l + a.offsetWidth; if (l < nav.scrollLeft || r > nav.scrollLeft + nav.clientWidth) nav.scrollLeft = l - 40; }
  }

}
function toast(msg, undo) {
  const t = $('#toast');
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button type="button">Отменить</button>' : '');
  t.hidden = false;
  if (undo) t.querySelector('button').addEventListener('click', () => { undo(); t.hidden = true; });
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, undo ? 8000 : 3500);
}
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, tab = b.closest('.tab'), id = tab && tab.dataset.id;
  if (act === 'open') { if (id !== activeId) { activeId = id; renaming = null; renderAll(); focusActiveTab(); } }
  else if (act === 'rename') { renaming = activeId; renderTabs(); }
  else if (act === 'dup') {
    const src = active(), i = views.indexOf(src);
    const cp = sanitize(JSON.parse(JSON.stringify(src))); cp.id = uid(); cp.pid = null; cp.name = (src.name + ' (копия)').slice(0, 60);
    views.splice(i + 1, 0, cp); activeId = cp.id; renaming = cp.id; renderAll();
  } else if (act === 'del') {
    if (views.length < 2) return;
    const i = views.findIndex(v => v.id === activeId), gone = views[i];
    views.splice(i, 1); activeId = (views[i] || views[i - 1]).id; renderAll(); focusActiveTab();
    toast('Вид «' + gone.name + '» удалён', () => { views.splice(i, 0, gone); activeId = gone.id; renderAll(); });
  } else if (act === 'new') {
    let n = 1; while (views.some(v => v.name === 'Новый вид ' + n)) n++;
    const nv = sanitize({ name: 'Новый вид ' + n, measure: 'dv01', rows: ['book'], col: null, viz: 'bars', opts: { sort: 'value' } });
    views.push(nv); activeId = nv.id; renaming = nv.id; renderAll();
  } else if (act === 'restore') {
    PRESETS.forEach((p, idx) => {
      const ex = views.find(v => v.pid === p.pid);
      if (ex) { Object.assign(ex, presetConfig(p)); ex.name = p.name; }

    keep.forEach((k, i) => series.push({ name: k, color: TK.cats[i % 8], data: cats.map(c => { const kd = c.node.kids.find(q => q.key === k); return { value: kd ? aval(kd.total, m) : 0, cons: Object.assign({ [P.d2]: [k] }, c.cons), title: c.label + ' · ' + k }; }) }));

  } else {
    cats = P.rows.map(n => ({ label: n.label, node: n, cons: { [P.d1]: n.members } })); catDim = P.d1;
    series.push({ name: measureLabel(m, v), single: true, data: cats.map(c => { const x = aval(c.node.total, m); return { value: x, cons: c.cons, title: c.label, itemStyle: { color: m.signed ? (x < 0 ? TK.neg : TK.pos) : TK.seq } }; }) });
  }

  const valAxis = Object.assign({ type: 'value' }, AX, { axisLine: { show: false }, axisLabel: Object.assign({}, AX.axisLabel, { formatter: x => fmtAxis(x, m, v) }) });

  return { height, opt: Object.assign(baseOpt(TK), {
    legend: legend ? { type: 'scroll', top: 0, left: 0, itemWidth: 10, itemHeight: 10, icon: 'rect', textStyle: { color: TK.text2, fontSize: 11.5 }, pageTextStyle: { color: TK.muted } } : undefined,
    tooltip: Object.assign(baseOpt(TK).tooltip, { trigger: 'axis', axisPointer: { type: 'shadow', shadowStyle: { color: TK.grid, opacity: .6 } },
      formatter: ps => { const t = ps[0] ? ps[0].axisValueLabel : ''; let tot = 0; const rows = ps.filter(p => p.value != null && p.value !== 0).map(p => { tot += +p.value; return ttRow(p.color && typeof p.color === 'string' ? p.color : null, p.seriesName, fmtM(p.value, m, v)); }).join('');
        return '<div style="font-weight:600;margin-bottom:4px">' + esc(t) + '</div>' + (rows || '<span style="color:var(--muted)">нет данных</span>') + (ps.length > 1 && stack ? '<div style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px">' + ttRow(null, 'Итого', fmtM(tot, m, v)) + '</div>' : '') + '<div style="color:var(--muted);font-size:11px;margin-top:3px">' + esc(unitLabel(m, v)) + ' · клик — позиции</div>'; } }),
    grid: { left: 8, right: 20, top: legend ? 34 : 12, bottom: 8, containLabel: true },

}
function treemapOption(v, m, TK) {

    series: [{ type: 'treemap', data, roam: false, nodeClick: false, breadcrumb: { show: false }, left: 0, right: 0, top: 0, bottom: 0, squareRatio: 1.2,
      label: { show: true, fontSize: 11.5, lineHeight: 15, overflow: 'truncate', formatter: p => p.name + '\n{n|' + fmtM(p.data.raw, m, v) + '}', rich: { n: { fontFamily: TK.fontNum, fontSize: 11 } } },
      upperLabel: { show: true, height: 22, color: TK.text, fontWeight: 600, fontSize: 11.5, formatter: p => p.data.raw == null ? '' : p.name + '   ' + fmtM(p.data.raw, m, v) },
      itemStyle: { borderColor: TK.surface, borderWidth: 1, gapWidth: 1 },
      levels: [{ upperLabel: { show: false }, itemStyle: { borderColor: TK.surface, borderWidth: 0, gapWidth: 3 } }, { itemStyle: { borderColor: TK.surface, borderWidth: 2, gapWidth: 1 } }, { itemStyle: { borderColor: TK.surface, borderWidth: 1, gapWidth: 1 } }],

}
function ladderOption(v, m, TK) {
  const sDim = v.rows[0] !== 'bucket' ? v.rows[0] : (v.rows[1] || (v.col && v.col !== 'bucket' ? v.col : null));
  const lv = Object.assign({}, v, { rows: sDim ? [sDim] : ['bucket'], col: sDim ? 'bucket' : null });

  const series = [];
  const bAgg = b => { if (!sDim) { const n = LP.rows.find(r => r.key === b); return n ? n.total : null; } return LP.colTot.get(b); };
  if (sDim) {
    const keys = LP.rows.map(n => n.key);
    const { keep, other } = limitKeys(keys, k => magOf(LP.rows.find(n => n.key === k).total, m), 8);
    keep.forEach((k, i) => { const n = LP.rows.find(r => r.key === k); series.push({ type: 'bar', stack: aggOf(m) === 'wavg' ? undefined : 'a', name: n.label, color: TK.cats[i % 8], itemStyle: { color: TK.cats[i % 8] }, barMaxWidth: 34,
      data: BK.map(b => { const x = aval(n.cells.get(b), m); return { value: x == null ? 0 : x, cons: { [sDim]: [k], bucket: [b] }, title: n.label + ' × ' + b }; }) }); });
    if (other.length) series.push({ type: 'bar', stack: 'a', name: 'Прочие (' + other.length + ')', color: TK.muted, itemStyle: { color: TK.muted }, barMaxWidth: 34,
      data: BK.map(b => ({ value: LP.rows.filter(n => other.includes(n.key)).reduce((s, n) => s + (aval(n.cells.get(b), m) || 0), 0), cons: { [sDim]: other, bucket: [b] }, title: 'Прочие × ' + b })) });
  }

    data: BK.map(b => { const x = aval(bAgg(b), m); return { value: x == null ? 0 : x, cons: { bucket: [b] }, title: 'Бакет ' + b + ' · все' }; }) });
  const AX = axisCommon(TK);
  const legend = series.length >= 2;
  return { height: 380, opt: Object.assign(baseOpt(TK), {
    legend: legend ? { type: 'scroll', top: 0, left: 0, itemWidth: 10, itemHeight: 10, textStyle: { color: TK.text2, fontSize: 11.5 }, pageTextStyle: { color: TK.muted } } : undefined,
    tooltip: Object.assign(baseOpt(TK).tooltip, { trigger: 'axis', axisPointer: { type: 'shadow', shadowStyle: { color: TK.grid, opacity: .6 } },
      formatter: ps => '<div style="font-weight:600;margin-bottom:4px">Бакет ' + esc(ps[0].axisValueLabel) + '</div>' + ps.filter(p => p.value).map(p => ttRow(typeof p.color === 'string' ? p.color : null, p.seriesName, fmtM(p.value, m, v))).join('') + '<div style="color:var(--muted);font-size:11px;margin-top:3px">' + esc(unitLabel(m, v)) + ' · клик — позиции</div>' }),
    grid: { left: 8, right: 20, top: legend ? 34 : 12, bottom: 8, containLabel: true },
    xAxis: { type: 'category', data: BK, axisLine: { lineStyle: { color: TK.lineS } }, axisTick: { show: false }, axisLabel: { color: TK.text2, fontSize: 11 } },
    yAxis: Object.assign({ type: 'value' }, AX, { axisLine: { show: false }, axisLabel: Object.assign({}, AX.axisLabel, { formatter: x => fmtAxis(x, m, v) }) }),

}
function renderViz(v, m) {

  card.hidden = false;
  if (!P.rows.length) { card.hidden = true; return; }
  const TK = tokens();
  let res;
  if (v.viz === 'heatmap') res = heatOption(v, m, TK);
  else if (v.viz === 'bars') res = barOption(v, m, TK);

  else if (v.viz === 'treemap') meta = 'площадь — |значение|, цвет — знак';

    ? `<span><span class="sw-dot" style="background:var(--div-neg)"></span>отрицательные</span><span><span class="sw-dot" style="background:var(--div-pos)"></span>положительные</span><span>клик — позиции</span>`

function renderMainOnly() {
  const v = active(), m = MEASURES[v.measure];
  curFacts = getFacts(v);
  P = buildPivot(v, curFacts);
  renderSummary(v, m); renderHints(v, m); renderPivot(v, m); renderViz(v, m);

function renderAll() { save(); renderTabs(); renderBuilder(); renderMainOnly(); }

/* ---------- drill-down ---------- */
let drill = null, drillReturn = null;
function openDrill(cons, facts, from) {
  const v = active(), m = MEASURES[v.measure];
  const ks = Object.keys(cons);
  const by = new Map();
  facts.forEach(f => {
    if (!ks.every(k => cons[k].includes(f.d[k]))) return;
    let e = by.get(f.r.id); if (!e) { e = { r: f.r, num: 0, den: 0 }; by.set(f.r.id, e); }
    e.num += f.num; e.den += f.den;
  });
  let list = [...by.values()];
  if (aggOf(m) === 'sum') list = list.filter(e => Math.abs(e.num) > 1e-6);
  drill = { cons, list, v, m, explode: facts === ladderFacts ? !!m.explode : isExplode(v, m), sort: { k: 'val', dir: -1 } };
  drillReturn = from || document.activeElement;
  renderDrill();
  $('#drawer').classList.add('open'); $('#drawer').setAttribute('aria-hidden', 'false'); $('#scrim').classList.add('open');
  $('#drClose').focus();
}
function closeDrill() {
  $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('open');
  if (drillReturn && drillReturn.isConnected) drillReturn.focus();
  drill = null;
}
function renderDrill() {
  const { list, v, m, cons } = drill;
  const a = aggOf(m), sc = unitsScale(v);
  const tot = a === 'count' ? list.length : a === 'wavg' ? (list.reduce((s, e) => s + e.den, 0) ? list.reduce((s, e) => s + e.num, 0) / list.reduce((s, e) => s + e.den, 0) : null) : list.reduce((s, e) => s + e.num, 0);
  const cols = [
    { k: 'name', l: 'Позиция', get: e => e.r.name, s: 1 },
    { k: 'book', l: 'Книга', get: e => D.BOOKS[e.r.book].name, s: 1 },
    { k: 'ccy', l: 'Вал.', get: e => e.r.ccy, s: 1 },
    { k: 'mat', l: 'Погашение', get: e => e.r.maturity || '', r: 1, fmt: e => fmtDate(e.r.maturity) },
  ];
  if (a === 'wavg') {
    cols.push({ k: 'w', l: 'Объём, млн ₽', r: 1, get: e => e.den, fmt: e => fmtNum(e.den / 1e6, 1) });
    cols.push({ k: 'val', l: m.wcol || 'Ставка, %', r: 1, get: e => e.num / e.den, fmt: e => fmtNum(e.num / e.den, m.dec != null ? m.dec : 2) });
  } else if (a === 'count') {
    cols.push({ k: 'val', l: 'MV, млн ₽', r: 1, get: e => isPos(e.r) ? e.r.p.mvRub : 0, fmt: e => isPos(e.r) ? fmtNum(e.r.p.mvRub / 1e6, 1) : '—' });
  } else {
    if (drill.explode) cols.push({ k: 'full', l: 'DV01 позиции', r: 1, get: e => e.r.p.dv01, fmt: e => fmtM(e.r.p.dv01, m, v) });
    cols.push({ k: 'val', l: drill.explode ? 'Вклад в ячейку' : measureLabel(m, v), r: 1, get: e => e.num, fmt: e => fmtM(e.num, m, v), sgn: 1 });
    cols.push({ k: 'share', l: 'Доля', r: 1, get: e => tot ? e.num / tot : 0, fmt: e => tot ? fmtNum(e.num / tot * 100, 1) + '%' : '—' });
  }

    if (sCol.k === 'val' || sCol.k === 'share' || sCol.k === 'full') return dir * (Math.abs(A) - Math.abs(B)) || dir * (A - B);
    return dir * (A < B ? -1 : A > B ? 1 : 0);

  let h = `<div class="dr-h"><div class="dr-k">Позиции ячейки · ${esc(measureLabel(m, v))}</div><button type="button" class="dr-close" id="drClose" aria-label="Закрыть панель">${ICON.x}</button>` +
    `<h2 class="dr-t" id="drTitle">${esc(consTitle(cons))}</h2><div class="dr-sub">${Object.keys(cons).map(k => esc(DIMS[k].label) + ': ' + esc(cons[k].length > 6 ? cons[k].slice(0, 6).join(', ') + ' …' : cons[k].join(', '))).join(' · ') || 'без ограничений по измерениям'}</div></div>`;
  h += `<div class="dr-stats"><div><span>${a === 'wavg' ? 'Среднее взвешенное' : 'Итого по ячейке'}</span><b class="num">${fmtM(tot, m, v)} <small style="font-size:12px;color:var(--muted);font-family:var(--font-ui)">${esc(unitLabel(m, v))}</small></b></div><div><span>Записей</span><b class="num">${nPos}${nF ? ' + ' + nF + ' фонд.' : ''}</b></div></div>`;
  h += '<div class="dr-body"><table class="dt"><thead><tr>' + cols.map(c => `<th class="${c.r ? 'r' : ''}" scope="col" aria-sort="${c.k === sCol.k ? (dir < 0 ? 'descending' : 'ascending') : 'none'}"><button type="button" data-sk="${c.k}">${esc(c.l)}${c.k === sCol.k ? `<span class="ar">${dir < 0 ? '▼' : '▲'}</span>` : ''}</button></th>`).join('') + '</tr></thead><tbody>';

      if (c.r) { const val = c.fmt ? c.fmt(e) : c.get(e); return `<td class="r num${c.sgn && e.num < 0 ? '' : ''}">${val}</td>`; }
      return `<td>${esc(c.get(e))}</td>`;
    }).join('') + '</tr>';
  });
  if (!sorted.length) h += `<tr><td colspan="${cols.length}" style="color:var(--muted);padding:20px 10px">Нет записей с ненулевым вкладом.</td></tr>`;
  h += '</tbody><tfoot><tr>' + cols.map((c, i) => i === 0 ? `<td>Подытог · ${list.length}</td>` : c.k === 'val' ? `<td class="r num">${fmtM(tot, m, v)}</td>` : c.k === 'share' ? '<td class="r num">100,0%</td>' : '<td></td>').join('') + '</tr></tfoot></table></div>';
  h += `<div class="dr-foot">Esc — закрыть · сортировка по клику на заголовок · ${esc(unitLabel(m, v))}</div>`;
  const dr = $('#drawer');
  dr.innerHTML = h;
  $('#drClose').addEventListener('click', closeDrill);
}
$('#drawer').addEventListener('click', e => {
  const b = e.target.closest('[data-sk]'); if (!b || !drill) return;

$('#scrim').addEventListener('click', closeDrill);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && drill) { e.preventDefault(); closeDrill(); }
  if (e.key === 'Tab' && drill) {
    const f = [...$('#drawer').querySelectorAll('button')]; if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }

/* ---------- theme reactivity ---------- */
const rerenderChart = () => { const v = active(); renderViz(v, MEASURES[v.measure]); };
if (window.matchMedia) { const mq = matchMedia('(prefers-color-scheme: dark)'); (mq.addEventListener ? mq.addEventListener('change', rerenderChart) : mq.addListener(rerenderChart)); }

let rzT = null, lastNarrow = window.innerWidth < 700;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { const n = window.innerWidth < 700; if (n !== lastNarrow) { lastNarrow = n; rerenderChart(); } }, 150); });

renderToggle();
renderAll();
})();
