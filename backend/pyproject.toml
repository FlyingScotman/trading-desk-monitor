[project]
name = "desk-backend"
version = "0.1.0"
description = "Trading Desk Monitor backend: hub snapshots -> core valuation -> desk runs"
requires-python = ">=3.11"
dependencies = [
    "rub-fixed-income-core==0.8.1",
    "trading-desk-monitor",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
desk = "desk.cli:main"

[tool.uv.sources]
# Development checkouts side by side; production pins a tagged wheel (06 §7).
rub-fixed-income-core = { path = "../../rub-fixed-income-core", editable = true }
trading-desk-monitor = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
