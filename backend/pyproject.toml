[project]
name = "desk-backend"
version = "0.2.30"
description = "Trading Desk Monitor backend: hub snapshots -> core valuation -> desk runs"
requires-python = ">=3.11"
dependencies = [
    "rub-fixed-income-core==0.45.0",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # the OS trust store for the hub's TLS (Windows root auto-download, corporate roots pushed by policy)
    "truststore>=0.10",
    # users and sessions (api/auth.py, ADR04: no custom cryptography): Argon2id password hashes, and the
    # self-signed certificate of `desk lan enable --self-signed`
    "argon2-cffi>=23.1",
    "cryptography>=42",
]

[project.optional-dependencies]
# pgserver: an embedded PostgreSQL for tests and the dev store (DESK_STORE_URL unset)
dev = ["pytest>=8.0", "pytest-xdist>=3.6", "ruff>=0.8", "pgserver>=0.1.4", "httpx>=0.27"]

[project.scripts]
desk = "desk.cli:main"

[tool.uv.sources]
# Core comes from its GitHub repository at a pinned commit (core tags stop at v0.3.0), so a
# plain clone of this repository builds. Production pins a wheel built from that commit (06 §7).
# To work on core and the backend together, override locally (not committed):
#   uv pip install -e ../../rub-fixed-income-core
rub-fixed-income-core = { git = "https://github.com/FlyingScotman/rub-fixed-income-core.git", rev = "85f8138c1725ad37cca3d0d70be2b142a36bc91e" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pytest -m live` checks the real hub in DESK_HUB_URL; the default run never touches the network.
addopts = "-m 'not live and not bundle and not full_property'"
markers = ["live: needs DESK_HUB_URL and a hub token",
           "bundle: builds a real wheel of the Windows bundle (uv and PyPI for the pinned build backends)",
           "full_property: the rest of the seeds of the pool's failure property (ci.yml «parallel-property», release): `pytest -m full_property`",
           "serial: process pools of its own or measured time, needs the machine to itself and never runs under pytest-xdist (ci.yml: -n 4 -m 'not serial and ...' first, then -m 'serial and ...' without -n; a plain pytest runs both)"]

[tool.ruff]
line-length = 110
target-version = "py311"
