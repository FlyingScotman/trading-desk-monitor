[project]
name = "desk-backend"
version = "0.2.4"
description = "Trading Desk Monitor backend: hub snapshots -> core valuation -> desk runs"
requires-python = ">=3.11"
dependencies = [
    "rub-fixed-income-core==0.36.0",
    "trading-desk-monitor",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # the OS trust store for the hub's TLS (Windows root auto-download, corporate roots pushed by policy)
    "truststore>=0.10",
    # users and sessions (api/auth.py, ADR04: no custom cryptography): Argon2id password hashes, and the
    # self-signed certificate of `desk lan enable --self-signed`
    "argon2-cffi>=23.1",
    "cryptography>=42",
]

[project.optional-dependencies]
# pgserver: an embedded PostgreSQL for tests and the dev store (DESK_STORE_URL unset)
dev = ["pytest>=8.0", "ruff>=0.8", "pgserver>=0.1.4", "httpx>=0.27"]

[project.scripts]
desk = "desk.cli:main"

[tool.uv.sources]
# Core comes from its GitHub repository at a pinned commit (core tags stop at v0.3.0), so a
# plain clone of this repository builds. Production pins a wheel built from that commit (06 §7).
# To work on core and the backend together, override locally (not committed):
#   uv pip install -e ../../rub-fixed-income-core
rub-fixed-income-core = { git = "https://github.com/FlyingScotman/rub-fixed-income-core.git", rev = "24fe77671122053289eae3a58615e6c259ea90e5" }
trading-desk-monitor = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pytest -m live` checks the real hub in DESK_HUB_URL; the default run never touches the network.
addopts = "-m 'not live and not bundle'"
markers = ["live: needs DESK_HUB_URL and a hub token",
           "bundle: builds a real wheel of the Windows bundle (uv and PyPI for the pinned build backends)"]

[tool.ruff]
line-length = 110
target-version = "py311"
