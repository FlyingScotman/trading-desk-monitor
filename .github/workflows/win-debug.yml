name: win-debug

# TEMPORARY (TDM#639): runs the pytest arguments in .github/win-debug-args.txt on Windows with CPython 3.11, so a failing
# test can be looked at in minutes and not after the whole suite. Removed before the pull request is merged.
on:
  push:
    branches: ["claude/**"]
    paths: [".github/win-debug-args.txt", ".github/win-debug-args2.txt", ".github/workflows/win-debug.yml", ".github/probe_db.py"]

jobs:
  debug:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Venv
        working-directory: backend
        shell: bash
        run: |
          uv venv -p 3.11 .venv
          uv pip install -p .venv/Scripts/python.exe -e ".[dev]"
      - name: Tests (a compact list of failures)
        working-directory: backend
        shell: bash
        run: |
          args=$(cat ../.github/win-debug-args.txt | tr -d '\r')
          .venv/Scripts/python.exe -m pytest -p no:cacheprovider --tb=no -q -rfE $args > ../out1.txt 2>&1 || true
          grep -E "^(FAILED|ERROR)|passed|failed" ../out1.txt | cut -c1-230 | tail -80
      - name: Tracebacks of chosen tests
        working-directory: backend
        shell: bash
        env:
          DESK_PRIVATE_ADAPTER_DEBUG: "1"
        run: |
          args=$(cat ../.github/win-debug-args2.txt | tr -d '\r')
          if [ -n "$args" ]; then
            .venv/Scripts/python.exe -m pytest -p no:cacheprovider --tb=short -q $args > ../out2.txt 2>&1 || true
            cut -c1-220 ../out2.txt | tail -${TB_LINES:-130}
          fi

  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "initdb on D and C (probe)"
        shell: bash
        run: |
          uv venv -p 3.11 .venv
          uv pip install -p .venv/Scripts/python.exe pgserver==0.1.4 psutil
          PY=.venv/Scripts/python.exe
          INITDB=$($PY -c "import pgserver,pathlib;print(pathlib.Path(pgserver.__file__).parent/'pginstall'/'bin'/'initdb.exe')")
          echo "initdb: $INITDB"; whoami
          for base in "$RUNNER_TEMP/dm1" "C:/Users/runneradmin/AppData/Local/DeskMonitorProbe" "D:/probe2"; do
            echo "=== $base"
            mkdir -p "$base"
            $PY - "$base" <<'PYEOF'
          import sys, pathlib
          p = pathlib.Path(sys.argv[1]) / "pg"
          p.mkdir(exist_ok=True)
          print("made", p)
          PYEOF
            icacls "$base/pg" || true
            "$INITDB" -D "$base/pg" --auth=trust --auth-local=trust --encoding=utf8 -U postgres > "$base/initdb.out" 2>&1; echo "initdb exit $?"; tail -5 "$base/initdb.out"
          done
          echo "=== fsutil"; fsutil fsinfo volumeinfo D:\\ | head -8 || true
          echo "=== TEMP=$TEMP RUNNER_TEMP=$RUNNER_TEMP LOCALAPPDATA=$LOCALAPPDATA"
      - name: "initdb in a folder closed by deskctl._private (variants)"
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          set +e
          PY=.venv/Scripts/python.exe
          INITDB=$($PY -c "import pgserver,pathlib;print(pathlib.Path(pgserver.__file__).parent/'pginstall'/'bin'/'initdb.exe')")
          SID=$(/c/Windows/System32/whoami.exe /user /fo csv /nh | grep -o 'S-1-[0-9-]*' | head -1); echo "SID=$SID"
          try() {
            name=$1; shift
            base="D:/probe_$name"; rm -rf "$base"; mkdir -p "$base"
            icacls.exe "$(cygpath -w $base)" "$@" > /dev/null; echo "icacls($name) exit $?"
            $PY -c "import pathlib,sys;pathlib.Path(sys.argv[1],'pg').mkdir()" "$base"
            icacls.exe "$(cygpath -w $base/pg)" | head -8
            "$INITDB" -D "$base/pg" --auth=trust --auth-local=trust --encoding=utf8 -U postgres > "$base/o.txt" 2>&1; echo "initdb($name) exit $?"; grep -i "error" "$base/o.txt" | head -3
          }
          try A '/inheritance:r' '/grant:r' "*$SID:(OI)(CI)F" '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F'
          try B '/inheritance:r' '/grant:r' "*$SID:(OI)(CI)F" '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' '*S-1-3-0:(OI)(CI)(IO)F'
          try C '/inheritance:r' '/grant:r' "*$SID:(OI)(CI)F" '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-32-545:(OI)(CI)RX'
          try D '/grant' "*$SID:(OI)(CI)F"
      - name: "desk db-migrate as the launcher starts it (variants)"
        if: always()
        shell: bash
        run: |
          uv pip install -p .venv/Scripts/python.exe -e backend
          .venv/Scripts/python.exe .github/probe_db.py "$(pwd)/.venv/Scripts/python.exe"
      - name: "initdb from a pwsh step (variants)"
        if: always()
        shell: pwsh
        run: |
          $py = ".venv/Scripts/python.exe"
          $initdb = & $py -c "import pgserver,pathlib;print(pathlib.Path(pgserver.__file__).parent/'pginstall'/'bin'/'initdb.exe')"
          Write-Host "initdb=$initdb"
          New-Item -ItemType Directory -Force D:\probe_pw | Out-Null
          # (a) directly from pwsh
          & $initdb -D D:\probe_pw\a --auth=trust --auth-local=trust --encoding=utf8 -U postgres 2>&1 | Select-Object -Last 3
          Write-Host "(a) exit $LASTEXITCODE"
          # (b) from python's subprocess.run
          & $py -c "import subprocess,sys;r=subprocess.run([sys.argv[1],'-D','D:/probe_pw/b','--auth=trust','--auth-local=trust','--encoding=utf8','-U','postgres'],capture_output=True,text=True);print('(b) rc',r.returncode,r.stderr.strip()[-200:])" $initdb
          # (c) python with mkdir first, as the driver does
          & $py -c "import subprocess,sys,os;os.makedirs('D:/probe_pw/c');r=subprocess.run([sys.argv[1],'-D','D:/probe_pw/c','--auth=trust','--auth-local=trust','--encoding=utf8','-U','postgres'],capture_output=True,text=True);print('(c) rc',r.returncode,r.stderr.strip()[-200:])" $initdb
          # (d) with the environment the driver gives (no PYTHON*, PATH only)
          & $py -c "import subprocess,sys,os;r=subprocess.run([sys.argv[1],'-D','D:/probe_pw/d','--auth=trust','--auth-local=trust','--encoding=utf8','-U','postgres'],capture_output=True,text=True,creationflags=0x200|0x08000000);print('(d) rc',r.returncode,r.stderr.strip()[-200:])" $initdb
          # (e) as (c) after a pause of 5 s
          & $py -c "import subprocess,sys,os,time;os.makedirs('D:/probe_pw/e');time.sleep(5);r=subprocess.run([sys.argv[1],'-D','D:/probe_pw/e','--auth=trust','--auth-local=trust','--encoding=utf8','-U','postgres'],capture_output=True,text=True);print('(e) rc',r.returncode,r.stderr.strip()[-200:])" $initdb
          # (f) the directory made by pwsh
          New-Item -ItemType Directory D:\probe_pw\f | Out-Null
          & $initdb -D D:\probe_pw\f --auth=trust --auth-local=trust --encoding=utf8 -U postgres 2>&1 | Select-Object -Last 2
          Write-Host "(f) exit $LASTEXITCODE"
          # (g) as (c), a second directory in the same parent, and the owner / acl printed
          & $py -c "import subprocess,sys,os;os.makedirs('D:/probe_pw/g');print(subprocess.run(['icacls','D:/probe_pw/g'],capture_output=True,text=True).stdout);print(subprocess.run(['icacls','D:/probe_pw/f'],capture_output=True,text=True).stdout)"
          Get-Acl D:\probe_pw\g | Format-List Owner, AccessToString
          Get-Acl D:\probe_pw\f | Format-List Owner, AccessToString
          exit 0
      - name: "initdb from a bash step, a directory made by python first (control)"
        if: always()
        shell: bash
        run: |
          set +e
          PY=.venv/Scripts/python.exe
          INITDB=$($PY -c "import pgserver,pathlib;print(pathlib.Path(pgserver.__file__).parent/'pginstall'/'bin'/'initdb.exe')")
          $PY -c "import subprocess,sys,os;os.makedirs('D:/probe_bs/c');r=subprocess.run([sys.argv[1],'-D','D:/probe_bs/c','--auth=trust','--auth-local=trust','--encoding=utf8','-U','postgres'],capture_output=True,text=True);print('(bash c) rc',r.returncode,r.stderr.strip()[-200:])" "$INITDB"
          exit 0

