name: release

# A version tag v<backend version> (backend/pyproject.toml) publishes a GitHub Release that the in-app updater
# (backend/src/desk/updater) reads: the Windows bundle without packages DeskMonitorMirror-<version>.zip (third-party
# packages come from the pip index of the PC; never with the private adapter), patches DeskMonitorMirror-patch-* from
# the previous release's published mirror bundle and from the last delivered mirror build (backend/tools/delivered),
# SHA256SUMS, release.json and notes with the checksums. Only the mirror kind is released (owner, 03.11.2026, #530):
# the full offline bundle DeskMonitor-<version>.zip is staged inside the CI (the mirror bundle is built from it) and
# never published; a previous release that has only a full bundle gives no patch (the kind changes once, by hand).
# Bump the version, commit, then either push the tag:  git tag v0.3.0 && git push origin v0.3.0
# or run Actions -> release -> «Run workflow» on main with the tag field empty: the tag v<backend version> is made by
# the release itself on the commit it built (as the adapter's release, TDA#99), after lint and tests pass; refused if
# that tag exists (bump the version first). A tag made with GITHUB_TOKEN does not start this workflow a second time.
# Re-running for an existing tag (Run workflow with the tag filled in) replaces its assets.
# Only a v-tag starts this workflow: a tag without v (or a release made by hand on GitHub) stays empty; tag-format.yml
# fails on such a tag with what to do, and check-tag below rejects a non-v tag given to Run workflow.
# The release job waits for the Windows check (windows-bundle.yml, TDM#639): install, update, rollback, stop on Windows.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to rebuild (v<backend version>); empty on main: make the tag v<backend version>"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # TDM#639: the bundle is installed, started, updated, rolled back and stopped on Windows with CPython 3.11 before it is
  # published (windows-bundle.yml, the same build command as below); a release without that check is not made
  windows:
    uses: ./.github/workflows/windows-bundle.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}

  release:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Release tag («Run workflow» without a tag makes v<backend version> on main)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag == ''
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "«Run workflow» without a tag releases main only, not $GITHUB_REF" >&2
            exit 1
          fi
          TAG="v$(python3 -c 'import tomllib; print(tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["version"])')"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists; bump the version in backend/pyproject.toml first, or fill in the tag to rebuild it" >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "MAKE_TAG=1" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v5
      - name: Python 3.11 with pip (the bundle builder downloads win_amd64 / cp311 wheels with it)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python 3.12 venv with the backend (tests, the release tool)
        working-directory: backend
        run: |
          uv venv -p 3.12 .venv
          uv pip install -p .venv -e ".[dev]"
      - name: The tag names the backend version
        run: backend/.venv/bin/python backend/tools/release_assets.py check-tag --tag "$TAG"
      - name: Lint and tests
        run: |
          backend/.venv/bin/ruff check backend
          (cd backend && .venv/bin/python -m pytest -q -p no:cacheprovider)
          backend/.venv/bin/python -m pytest -q -p no:cacheprovider tests
      - name: The previous release's mirror bundle, as published (base of the patches)
        # the patch is made against the bytes that were delivered, never a rebuild that only has the same version
        # (v-tags only: a release with a tag without v was made by hand and has no bundle). A previous release of
        # the full kind (before #530) has no DeskMonitorMirror-*.zip: no base, no patch, the owner changes kind by hand
        run: |
          mkdir -p prev
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 30 \
                   --json tagName --jq '.[].tagName' | grep -vxF "$TAG" | grep '^v' | head -n 1 || true)
          if [ -n "$prev" ]; then
            echo "previous release: $prev"
            if gh release download "$prev" --repo "$GITHUB_REPOSITORY" --dir prev \
                 --pattern 'DeskMonitorMirror-*.zip' --pattern SHA256SUMS \
               && compgen -G 'prev/DeskMonitorMirror-*.zip' >/dev/null; then
              rm -f prev/DeskMonitorMirror-patch-*.zip prev/*-with-adapter.zip
              (cd prev && sha256sum --check --ignore-missing --strict SHA256SUMS)
            else
              echo "::warning::no mirror zip of $prev downloaded (a release of the full kind?): no patch from it, the owner changes the kind by hand"
              rm -f prev/*
            fi
          fi
          ls -la prev
      - name: Build the Windows mirror bundle and the patches from the previous release and the last delivered build
        # --mirror-only: the bundle without packages and its patches are written; the full stage is built inside (the
        # mirror one is made from it, its wheelhouse is checked against mirror.json) but no full zip or patch is made
        # --patch-from-delivered: also a patch from the newest backend/tools/delivered/<version>/ record of the mirror
        # kind (what the owner got outside the releases); one patch per base version, made to fit every known build
        run: |
          bases=()
          for z in prev/DeskMonitorMirror-*.zip; do if [ -f "$z" ]; then bases+=(--patch-base "$z"); fi; done
          python3.11 backend/tools/build_windows_bundle.py --out dist --mirror-only "${bases[@]}" --patch-from-delivered
          ls -la dist
      - name: SHA256SUMS, release.json, notes
        run: >
          backend/.venv/bin/python backend/tools/release_assets.py write --dist dist --tag "$TAG"
          --repo "$GITHUB_REPOSITORY" --commit "$(git rev-parse HEAD)"
      - name: Publish the release
        run: |
          shopt -s nullglob
          assets=(dist/DeskMonitorMirror-*.zip dist/SHA256SUMS dist/release.json)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file dist/NOTES.md
          else
            # «Run workflow» without a tag: the release makes the tag on the commit that was built and tested
            if [ "${MAKE_TAG:-}" = "1" ]; then WHERE=(--target "$GITHUB_SHA"); else WHERE=(--verify-tag); fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${WHERE[@]}" --latest \
              --title "Desk Monitor $TAG" --notes-file dist/NOTES.md "${assets[@]}"
          fi
