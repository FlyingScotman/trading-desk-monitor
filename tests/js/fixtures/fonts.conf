<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Шрифт браузерных тестов мониторов (#352): system-ui и sans-serif — Inter (пакет fonts-inter), как на машине
     разработки. Ширины подписей на графиках (K.labelWidth) зависят от шрифта; без этого Chromium в CI берёт DejaVu Sans,
     он на 12–15 % шире. CI задаёт FONTCONFIG_FILE=tests/js/fixtures/fonts.conf для smoke и *.pw.test.js. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit>
  </match>
</fontconfig>
