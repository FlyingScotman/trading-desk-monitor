[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-desk-monitor"
version = "0.1.0"
description = "FI desk monitor: SQLite store for calculation results, writer SDK and web UI server"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
tdm = "tdm.cli:main"

[tool.setuptools]
packages = ["tdm"]

[tool.setuptools.package-data]
tdm = ["schema.sql"]
